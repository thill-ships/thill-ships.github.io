<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>BYU Gameday · Basketball demo</title>
<meta name="theme-color" content="#03060F" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  /* ---------------------------------------------------------------------------
     A demo of the BYU basketball board, built to match the football one
     (field/board.html): team stats on the left, the score in the middle,
     BYU's players on the right, the last play under them and four other
     games along the bottom. Football's drive strip becomes a game-flow strip
     (who led, minute by minute), and "All drives" becomes a shot chart.

     It replays the real BYU vs #6 Iowa State game (Feb 21, 2026) from ESPN's
     play-by-play: everything on screen is worked out from the plays so far.
     ?from=start plays it from the tip, ?at=final jumps to the end.

     Laid out at 1280x695 and scaled to fit, like the football board.
     No ?. or ??, no flex gap: Chromium 74.
     --------------------------------------------------------------------------- */
  :root{
    --ink:#FFFFFF; --dim:rgba(255,255,255,0.64); --faint:rgba(255,255,255,0.42);
    --royal:#0062B8; --hi:#5FA8FF; --panel:rgba(6,13,30,0.84); --rule:rgba(255,255,255,0.09);
    --opp:#F1BE48; --bad:#FF5A4E;
    --txt:'Barlow',Roboto,Helvetica,Arial,sans-serif;
    --num:'Barlow Condensed','Roboto Condensed','Arial Narrow',sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;overflow:hidden;background:#03060F;}
  body{font-family:var(--txt);font-weight:500;color:var(--ink);font-variant-numeric:tabular-nums;
    -webkit-font-smoothing:antialiased;cursor:default;user-select:none;-webkit-user-select:none;}
  #stage{position:absolute;left:0;top:0;width:1280px;height:695px;transform-origin:0 0;overflow:hidden;visibility:hidden;
    background:radial-gradient(ellipse 420px 260px at 540px 0,rgba(255,240,205,0.14),rgba(255,240,205,0) 70%),
               radial-gradient(ellipse 420px 260px at 740px 0,rgba(255,240,205,0.14),rgba(255,240,205,0) 70%),
               linear-gradient(180deg,#03060F 0%,#08122A 50%,#0A1630 100%);}
  #stage.ready{visibility:visible;}
  .abs{position:absolute;}
  .np{pointer-events:none;}
  img.lg{display:block;object-fit:contain;}

  /* ---- stats either side (the football board's tall-card sizes) ---- */
  .panel{top:10px;width:420px;height:490px;padding:10px 20px;background:var(--panel);
    border:1px solid rgba(255,255,255,0.1);border-radius:18px;}
  .ph{display:flex;align-items:center;height:40px;font-size:18px;color:var(--dim);}
  .ph .c{width:110px;}
  .ph .c img{width:34px;height:34px;margin-left:auto;}
  .dots i{display:inline-block;width:8px;height:8px;border-radius:4px;margin-left:7px;background:rgba(255,255,255,0.2);vertical-align:2px;}
  .dots i.on{background:var(--hi);}
  .row{display:flex;align-items:center;height:71px;border-top:1px solid var(--rule);}
  .row .k{flex:1;min-width:0;font-size:27px;color:rgba(255,255,255,0.82);white-space:nowrap;}
  .row .c{width:110px;text-align:right;white-space:nowrap;font-family:var(--num);font-weight:600;font-size:44px;}
  .row .c.o{color:var(--dim);}
  .row .c.f{color:var(--hi);}
  .ld{height:71px;border-top:1px solid var(--rule);padding-top:3px;}
  .ld .l1{display:flex;align-items:baseline;height:37px;}
  .ld .n{flex:1;min-width:0;font-size:27px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .ld .n img{display:inline-block;width:24px;height:24px;margin-right:8px;vertical-align:-3px;}
  .ld .big{font-family:var(--num);font-weight:600;font-size:36px;line-height:1;}
  .ld .u{font-size:19px;color:var(--dim);margin-left:5px;}
  .ld .l2{font-size:26px;line-height:30px;color:rgba(255,255,255,0.7);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .ld.o .n,.ld.o .big{color:rgba(255,255,255,0.75);}
  .ld.new .n{color:var(--hi);}

  /* ---- the score ---- */
  #score{left:436px;top:6px;width:408px;}
  .sc{display:flex;align-items:center;}
  .tm{width:82px;display:flex;flex-direction:column;align-items:center;}
  .lgw{position:relative;width:76px;height:76px;}
  .lgw img{width:76px;height:76px;}
  .rkb{position:absolute;left:-10px;top:-6px;font-family:var(--num);font-weight:700;font-size:21px;line-height:24px;padding:0 7px;
    border-radius:13px;background:#05080F;color:#FFFFFF;border:2px solid rgba(255,255,255,0.85);}
  .rkb:empty{display:none;}
  /* timeouts left, as in football */
  .tos{height:8px;margin-top:8px;white-space:nowrap;}
  .tos i{display:inline-block;width:16px;height:4px;border-radius:2px;margin:0 2px;background:var(--hi);vertical-align:top;}
  .tos i.used{background:rgba(255,255,255,0.18);}
  .pts{width:104px;text-align:center;font-family:var(--num);font-weight:600;font-size:96px;line-height:1;transition:color .4s;}
  .pts.o{color:var(--dim);}
  .pts.pop{color:var(--hi);}
  .mid{width:36px;}
  .clkrow{text-align:center;margin-top:4px;white-space:nowrap;}
  .clk{font-family:var(--num);font-weight:600;font-size:36px;color:var(--hi);}
  .net{font-size:18px;font-weight:600;letter-spacing:1px;color:rgba(255,255,255,0.8);margin-left:14px;vertical-align:4px;}
  .dd{text-align:center;font-size:30px;font-weight:600;margin-top:2px;white-space:nowrap;}
  .dd.run{color:var(--hi);}
  .lines{margin:12px auto 0;width:396px;background:rgba(6,13,30,0.8);border-radius:14px;padding:6px 18px 8px;}
  .lines table{border-collapse:collapse;width:100%;}
  .lines td{padding:0;text-align:center;font-family:var(--num);font-weight:500;font-size:36px;line-height:42px;color:rgba(255,255,255,0.88);}
  .lines td.h{font-family:var(--txt);font-size:18px;line-height:24px;color:var(--dim);}
  .lines td.t{width:52px;}
  .lines td.t img{width:36px;height:36px;vertical-align:middle;}
  .lines td.tot{font-weight:700;color:#FFFFFF;}

  /* ---- game flow: who led, minute by minute (football's drive strip) ---- */
  #flow{left:440px;top:394px;width:400px;height:60px;border-radius:9px;overflow:hidden;background:#0B1A3A;cursor:pointer;
    box-shadow:0 0 0 1px rgba(255,255,255,0.18);}
  #flow svg{display:block;}
  #demo{left:440px;top:466px;width:400px;text-align:center;font-size:14px;color:var(--faint);}

  /* ---- last play, fouls, and the buttons ---- */
  #strip{left:12px;top:508px;width:1256px;height:52px;border-radius:12px;background:var(--panel);border:1px solid rgba(255,255,255,0.1);
    display:flex;align-items:center;padding:0 6px 0 18px;}
  #strip .tag{font-size:21px;color:var(--hi);margin-right:14px;white-space:nowrap;}
  #strip .txt{flex:1;min-width:0;font-size:27px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  #strip .fl{font-size:23px;color:var(--dim);margin:0 12px 0 16px;white-space:nowrap;}
  #strip .fl img{display:inline-block;width:26px;height:26px;vertical-align:-6px;margin:0 6px 0 10px;}
  #strip .fl b{font-family:var(--num);font-weight:600;font-size:28px;color:rgba(255,255,255,0.88);}
  #strip .fl .bonus{font-size:15px;font-weight:600;letter-spacing:1px;color:#05080F;background:var(--hi);border-radius:4px;padding:1px 5px;margin-left:6px;vertical-align:3px;}
  .btn{font-size:21px;color:rgba(255,255,255,0.75);border:1px solid rgba(255,255,255,0.28);border-radius:20px;padding:5px 16px;cursor:pointer;white-space:nowrap;margin-left:8px;}
  .btn.sport{color:#FFFFFF;border-color:var(--royal);background:rgba(0,98,184,0.35);}

  /* ---- the four other games (football's short logo cards) ---- */
  .gc{position:absolute;top:568px;width:305px;height:118px;padding:4px 14px 0;border-radius:14px;background:rgba(8,16,36,0.88);
    border:1px solid rgba(255,255,255,0.1);}
  .gc.post{background:rgba(8,16,36,0.55);}
  .gl{display:flex;align-items:center;height:72px;}
  .gl .lw{position:relative;width:62px;height:62px;}
  .gl .lw img{width:62px;height:62px;}
  .gl .rkb{font-size:20px;line-height:23px;}
  .gl .s{width:76px;text-align:center;font-family:var(--num);font-weight:600;font-size:54px;line-height:1;}
  .gl .s.lo{color:var(--dim);}
  .gl .vs{flex:1;text-align:center;font-size:22px;color:var(--faint);}
  .gf{display:flex;align-items:center;height:42px;border-top:1px solid var(--rule);margin-top:2px;font-size:25px;}
  .gf .ck{font-family:var(--num);font-weight:600;font-size:31px;color:var(--hi);white-space:nowrap;}
  .gf .st{flex:1;min-width:0;margin-left:10px;color:rgba(255,255,255,0.8);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .gf .tv{font-size:23px;font-weight:600;color:rgba(255,255,255,0.7);margin-left:8px;white-space:nowrap;}
  .gc.post .gf .ck{color:var(--dim);}

  /* ---- banners: timeouts, as in football ---- */
  .pill{left:640px;top:386px;transform:translateX(-50%);white-space:nowrap;text-align:center;border-radius:14px;
    padding:8px 22px 9px;background:rgba(3,6,15,0.94);border:2px solid var(--royal);display:none;}
  .pill.on{display:block;}
  .pill .a{font-family:var(--num);font-weight:600;font-size:36px;color:var(--hi);}
  .pill .b{font-size:18px;color:var(--dim);}
  #toast{left:640px;top:300px;transform:translateX(-50%);max-width:700px;text-align:center;font-size:24px;line-height:32px;
    padding:14px 26px;border-radius:14px;background:rgba(3,6,15,0.96);border:2px solid var(--royal);display:none;}
  #toast.on{display:block;}

  /* ---- every shot: the court, full screen (football's "All drives") ---- */
  #shots{left:0;top:0;width:1280px;height:695px;background:#0B1220;display:none;cursor:pointer;}
  #shots.on{display:block;}
  #shots .hd{position:absolute;left:24px;right:24px;top:4px;height:52px;display:flex;align-items:center;}
  #shots .ttl{font-family:var(--num);font-weight:800;font-size:32px;letter-spacing:1px;margin-right:18px;}
  #shots .sub{font-size:17px;color:var(--dim);}
  #shots .sco{margin-left:auto;font-size:20px;font-weight:700;white-space:nowrap;}
  #shots .sco b{font-family:var(--num);font-weight:800;font-size:34px;margin:0 16px 0 6px;}
  #shots .sco .o{color:var(--dim);}
  #shots .sco .q{font-family:var(--num);font-size:26px;color:var(--hi);}
  #court{left:20px;top:60px;width:1240px;height:573px;}
  #shots .ft{position:absolute;left:24px;right:24px;top:638px;height:54px;display:flex;align-items:center;font-size:19px;color:rgba(255,255,255,0.85);}
  #shots .ft span.it{margin-right:26px;white-space:nowrap;}
  #shots .ft svg{vertical-align:middle;margin-right:6px;}
  #shots .ft .back{margin-left:auto;font-size:16px;font-weight:700;color:#0B1220;background:#FFFFFF;border-radius:22px;padding:10px 18px;}
</style>
</head>

</div>

$('lgH').innerHTML = logo(T.H.id) + '<span class="rkb">' + (T.H.rank || '') + '</span>';
$('tLA').innerHTML = logo(T.A.id); $('tLH').innerHTML = logo(T.H.id);
$('net').textContent = GAME.tv;

/* ===========================================================================
   The game so far. ESPN's plays, in order, each
     [period, clock seconds, away score, home score, team slot, kind, text,
      made, three, shot x, shot y, player, second player]
   kind: fg ft oreb dreb xreb to stl blk foul tmo tv end other.
   Shot x is feet across the court (the basket at 25), y feet out from the
   basket. Everything on screen is added up from the plays up to "upto", so
   the demo shows the game as it stood at that moment.
   =========================================================================== */
var P = GAME.plays;
var HALF = 1200, OT = 300, TIMEOUTS = 4;
function elapsed(period, clock){ return period <= 2 ? (period - 1) * HALF + (HALF - clock) : 2 * HALF + (period - 3) * OT + (OT - clock); }
function blankTeam(){ return { fgm:0, fga:0, tpm:0, tpa:0, ftm:0, fta:0, oreb:0, dreb:0, ast:0, stl:0, blk:0, to:0, pf:0, halfPf:0, tmo:0, lines:[] }; }
function blankPlayer(name, t){ return { n:name, team:t, pts:0, fgm:0, fga:0, tpm:0, tpa:0, ftm:0, fta:0, reb:0, ast:0, stl:0, blk:0, to:0, pf:0 }; }

function gameAt(upto){
  var g = { t: { H: blankTeam(), A: blankTeam() }, players: {}, score: { H: 0, A: 0 }, period: 1, clock: HALF,
            last: null, flow: [[0, 0]], shots: [], lead: { H: 0, A: 0 }, changes: 0, run: null, over: false, halftime: false };
  var pl = function(id){
    if(!id || !GAME.ath[id]) return null;
    if(!g.players[id]) g.players[id] = blankPlayer(GAME.ath[id][0], GAME.ath[id][1]);
    return g.players[id];
  };
  var leader = '', streak = { team: '', pts: 0, against: 0 };
  for(var i = 0; i <= upto && i < P.length; i++){
    var p = P[i], per = p[0], clk = p[1], s = p[4], kind = p[5], made = p[7], three = p[8];
    var a = pl(p[11]), b = pl(p[12]), tm = s ? g.t[s] : null;
    if(per !== g.period){ g.period = per; g.t.H.halfPf = 0; g.t.A.halfPf = 0; }
    g.clock = clk; g.halftime = false;
    if(kind === 'fg' && tm){
      tm.fga++; if(three) tm.tpa++;
      if(a){ a.fga++; if(three) a.tpa++; }
      if(made){ tm.fgm++; if(three) tm.tpm++; if(a){ a.fgm++; if(three) a.tpm++; a.pts += three ? 3 : 2; } if(b){ b.ast++; tm.ast++; } }
      if(p[9] !== null) g.shots.push({ team: s, x: p[9], y: p[10], made: made, three: three, i: i });
    } else if(kind === 'ft' && tm){
      tm.fta++; if(a) a.fta++;
      if(made){ tm.ftm++; if(a){ a.ftm++; a.pts++; } }
    } else if((kind === 'oreb' || kind === 'dreb') && tm){
      if(kind === 'oreb') tm.oreb++; else tm.dreb++;
      if(a) a.reb++;
    } else if(kind === 'to' && tm){ tm.to++; if(a) a.to++; }
    else if(kind === 'stl' && tm){ tm.stl++; if(a) a.stl++; }
    else if(kind === 'blk' && tm){ tm.blk++; if(a) a.blk++; }
    else if(kind === 'foul' && tm){ tm.pf++; tm.halfPf++; if(a) a.pf++; }
    else if(kind === 'tmo' && tm){ tm.tmo++; }
    else if(kind === 'end'){ if(/Game/.test(p[6])) g.over = true; else if(per === 1) g.halftime = true; }

    // the score, the lead, runs and the flow line
    var was = { H: g.score.H, A: g.score.A };
    g.score.A = p[2]; g.score.H = p[3];
    var dh = g.score.H - was.H, da = g.score.A - was.A;
    if(dh || da){
      var who = dh ? 'H' : 'A', pts = dh || da;
      if(streak.team === who) streak.pts += pts; else { streak = { team: who, pts: pts, against: 0 }; }
      var margin = g.score.H - g.score.A;
      if(margin > g.lead.H) g.lead.H = margin;
      if(-margin > g.lead.A) g.lead.A = -margin;
      var now = margin > 0 ? 'H' : margin < 0 ? 'A' : '';
      if(now && leader && now !== leader) g.changes++;
      if(now) leader = now;
      g.flow.push([elapsed(per, clk), margin]);
    }
    if(kind !== 'tv' && kind !== 'end' && kind !== 'other') g.last = { i: i, text: p[6], kind: kind, team: s };
  }
  g.run = streak.pts >= 7 ? streak : null;
  g.t.H.lines = lineScore('H', upto); g.t.A.lines = lineScore('A', upto);
  g.state = g.over ? 'post' : 'in';
  return g;
}
// Points by period, from the score at the end of each one.
function lineScore(s, upto){
  var out = [], col = s === 'H' ? 3 : 2, before = 0, last = 0;
  for(var i = 0; i <= upto && i < P.length; i++){
    var per = P[i][0];
    if(per > out.length){ before = last; while(out.length < per) out.push(0); }
    out[per - 1] = P[i][col] - before;
    last = P[i][col];
  }
  return out;
}

/* ------------------------------ drawing ------------------------------ */
function clockText(g){
  if(g.over) return 'Final' + (g.period > 2 ? (g.period === 3 ? '/OT' : '/' + (g.period - 2) + 'OT') : '');
  if(g.halftime) return 'Half';
  var m = Math.floor(g.clock / 60), sec = Math.floor(g.clock % 60);
  var c = g.clock < 60 ? g.clock.toFixed(1) : m + ':' + (sec < 10 ? '0' : '') + sec;
  var name = g.period === 1 ? '1st' : g.period === 2 ? '2nd' : g.period === 3 ? 'OT' : (g.period - 2) + 'OT';
  return name + ' ' + c;
}
var shownScore = { H: null, A: null };
function drawScore(g){
  ['A', 'H'].forEach(function(s){
    var el = $('s' + s);
    el.textContent = g.score[s];
    if(shownScore[s] !== null && g.score[s] !== shownScore[s]){
      el.className = 'pts pop';
      setTimeout(function(){ el.className = 'pts' + (g.score[s] < g.score[s === 'H' ? 'A' : 'H'] ? ' o' : ''); }, 1400);
    } else if(el.className.indexOf('pop') < 0) el.className = 'pts' + (g.score[s] < g.score[s === 'H' ? 'A' : 'H'] ? ' o' : '');
    shownScore[s] = g.score[s];
    var left = Math.max(0, TIMEOUTS - g.t[s].tmo), d = '';
    for(var i = 0; i < TIMEOUTS; i++) d += '<i' + (i >= left ? ' class="used"' : '') + '></i>';
    $('to' + s).innerHTML = g.over ? '' : d;
  });
  $('clk').textContent = clockText(g);
  var m = g.score[FEAT] - g.score[OPP], dd = $('dd');
  if(g.over){ dd.className = 'dd'; dd.textContent = m > 0 ? T[FEAT].name + ' wins' : m < 0 ? T[OPP].name + ' wins' : ''; }
  else if(g.run){ dd.className = 'dd run'; dd.textContent = T[g.run.team].name + ' on a ' + g.run.pts + '–0 run'; }
  else { dd.className = 'dd'; dd.textContent = m === 0 ? 'Tied' : T[m > 0 ? FEAT : OPP].name + ' by ' + Math.abs(m); }

  var periods = Math.max(2, g.t.H.lines.length);
  var head = '<tr><td class="h t"></td>' + (function(){ var h = ''; for(var i = 1; i <= periods; i++) h += '<td class="h">' + (i === 1 ? '1st' : i === 2 ? '2nd' : i === 3 ? 'OT' : (i - 2) + 'OT') + '</td>'; return h; })() + '<td class="h">' + (g.over ? 'Final' : 'Total') + '</td></tr>';
  var row = function(s){
    var r = '<tr><td class="t">' + logo(T[s].id) + '</td>';
    for(var i = 0; i < periods; i++) r += '<td>' + (i < g.t[s].lines.length ? g.t[s].lines[i] : '') + '</td>';
    return r + '<td class="tot">' + g.score[s] + '</td></tr>';
  };
  $('lineScore').innerHTML = head + row('A') + row('H');
}

// Team stats: six rows a page, two pages that take turns, like football.
// A number that just changed shows in blue for a few seconds.
var statPage = 0, flash = {};
function pct(m, a){ return a ? Math.round(100 * m / a) + '%' : '–'; }
function teamRows(g, prev){
  var a = g.t.A, h = g.t.H;
  var rows = statPage ? [
    ['Assists', a.ast, h.ast],
    ['Off. rebounds', a.oreb, h.oreb],
    ['Steals', a.stl, h.stl],
    ['Blocks', a.blk, h.blk],
    ['Fouls', a.pf, h.pf],
    ['Largest lead', g.lead.A, g.lead.H],
  ] : [
    ['Field goals', a.fgm + '-' + a.fga, h.fgm + '-' + h.fga],
    ['Shooting', pct(a.fgm, a.fga), pct(h.fgm, h.fga)],
    ['3-pointers', a.tpm + '-' + a.tpa, h.tpm + '-' + h.tpa],
    ['Free throws', a.ftm + '-' + a.fta, h.ftm + '-' + h.fta],

  ];

  $('tD').innerHTML = '<i' + (statPage ? '' : ' class="on"') + '></i><i' + (statPage ? ' class="on"' : '') + '></i>';
  var now = Date.now();
  $('team').innerHTML = rows.map(function(r){
    var key = r[0];
    if(prev && prev[key]){
      if(prev[key][0] !== String(r[1])) flash[key + 'A'] = now + 4000;
      if(prev[key][1] !== String(r[2])) flash[key + 'H'] = now + 4000;
    }
    var fa = flash[key + 'A'] > now, fh = flash[key + 'H'] > now;
    return '<div class="row"><span class="k">' + key + '</span><span class="c' + (fa ? ' f' : (OPP === 'A' ? ' o' : '')) + '">' + esc(r[1]) +
           '</span><span class="c' + (fh ? ' f' : (OPP === 'H' ? ' o' : '')) + '">' + esc(r[2]) + '</span></div>';
  }).join('');
  var out = {}; rows.forEach(function(r){ out[r[0]] = [String(r[1]), String(r[2])]; }); return out;
}

// BYU's players by points, with the rest of their line in words. Page 2 is
// the boards, assists and defense leaders, then the other team's scorers.
var leaderNames = null;
function many(n, one, more){ return n + ' ' + (n === 1 ? one : more); }
function line(p){
  var bits = [p.fgm + '-' + p.fga + ' FG'];
  if(p.tpa) bits.push(p.tpm + '-' + p.tpa + ' 3PT');
  if(p.reb) bits.push(p.reb + ' reb');
  if(p.ast) bits.push(p.ast + ' ast');
  return bits.join(', ');
}
function leaderRows(g){
  var all = Object.keys(g.players).map(function(k){ return g.players[k]; });
  var mine = all.filter(function(p){ return p.team === FEAT; }), theirs = all.filter(function(p){ return p.team === OPP; });
  var by = function(list, key){ return list.slice().sort(function(x, y){ return (y[key] - x[key]) || (y.pts - x.pts); }); };
  var lines = [];
  if(!statPage){
    by(mine, 'pts').slice(0, 6).forEach(function(p){ lines.push({ o: false, n: p.n, big: p.pts, u: 'pts', sub: line(p) }); });
  } else {
    var r = by(mine, 'reb')[0], as = by(mine, 'ast')[0], d = mine.slice().sort(function(x, y){ return (y.stl + y.blk) - (x.stl + x.blk); })[0];
    if(r) lines.push({ o: false, n: r.n, big: r.reb, u: 'reb', sub: r.pts + ' pts' + (r.ast ? ', ' + r.ast + ' ast' : '') });
    if(as) lines.push({ o: false, n: as.n, big: as.ast, u: 'ast', sub: as.pts + ' pts' + (as.to ? ', ' + many(as.to, 'turnover', 'turnovers') : '') });
    if(d && d.stl + d.blk) lines.push({ o: false, n: d.n, big: d.stl + d.blk, u: 'stl + blk', sub: many(d.stl, 'steal', 'steals') + ', ' + many(d.blk, 'block', 'blocks') });
    by(theirs, 'pts').slice(0, 3).forEach(function(p){ lines.push({ o: true, n: p.n, big: p.pts, u: 'pts', sub: line(p) }); });
  }
  $('lT').textContent = statPage ? 'Boards, assists & ' + T[OPP].name : 'BYU players';
  $('lD').innerHTML = $('tD').innerHTML;
  var names = lines.map(function(l){ return l.n + l.u; });
  $('leaders').innerHTML = lines.length ? lines.map(function(l, i){
    var isNew = leaderNames && leaderNames.page === statPage && leaderNames.list.indexOf(names[i]) < 0;
    return '<div class="ld' + (l.o ? ' o' : '') + (isNew ? ' new' : '') + '"><div class="l1"><span class="n">' + (l.o ? logo(T[OPP].id) : '') + esc(l.n) +
           '</span><span class="big">' + l.big + '</span><span class="u">' + l.u + '</span></div><div class="l2">' + esc(l.sub) + '</div></div>';
  }).join('') : '<div class="ld"><div class="l2">Nothing yet</div></div>';
  leaderNames = { page: statPage, list: names };
}

// Game flow: the lead over the game, BYU's above the line in white and the
// other team's below in gold, halftime marked, the clock so far filled in.
function drawFlow(g){
  var W = 400, H = 60, mid = H / 2, total = 2 * HALF + Math.max(0, g.period - 2) * OT;
  var big = 10; g.flow.forEach(function(f){ big = Math.max(big, Math.abs(f[1])); });
  var X = function(t){ return (t / total * W).toFixed(1); }, Y = function(m){ return (mid - m / big * (mid - 4)).toFixed(1); };
  var sgn = FEAT === 'H' ? 1 : -1;               // BYU's lead goes up
  var now = elapsed(g.period, g.clock), d = 'M0 ' + mid, last = 0;
  g.flow.forEach(function(f){ d += ' L' + X(f[0]) + ' ' + Y(last * sgn) + ' L' + X(f[0]) + ' ' + Y(f[1] * sgn); last = f[1]; });
  d += ' L' + X(now) + ' ' + Y(last * sgn) + ' L' + X(now) + ' ' + mid + ' Z';
  var svg = '<svg width="' + W + '" height="' + H + '" viewBox="0 0 ' + W + ' ' + H + '">' +
    '<defs><clipPath id="up"><rect x="0" y="0" width="' + W + '" height="' + mid + '"/></clipPath>' +
    '<clipPath id="dn"><rect x="0" y="' + mid + '" width="' + W + '" height="' + mid + '"/></clipPath></defs>' +
    '<rect x="' + X(now) + '" y="0" width="' + (W - X(now)) + '" height="' + H + '" fill="rgba(0,0,0,0.25)"/>' +
    '<path d="' + d + '" fill="' + COLOR[FEAT] + '" fill-opacity="0.9" clip-path="url(#up)"/>' +
    '<path d="' + d + '" fill="' + COLOR[OPP] + '" fill-opacity="0.9" clip-path="url(#dn)"/>' +
    '<line x1="0" y1="' + mid + '" x2="' + W + '" y2="' + mid + '" stroke="rgba(255,255,255,0.35)" stroke-width="1"/>' +
    '<line x1="' + X(HALF) + '" y1="0" x2="' + X(HALF) + '" y2="' + H + '" stroke="rgba(255,255,255,0.5)" stroke-width="1" stroke-dasharray="3 3"/>' +
    (g.over ? '' : '<circle cx="' + X(now) + '" cy="' + Y(last * sgn) + '" r="4" fill="' + '#5FA8FF' + '"/>') +
    '</svg>';
  $('flow').innerHTML = svg;
}

function drawStrip(g){
  $('lp').textContent = g.last ? g.last.text : 'Tipoff';
  // Team fouls this half; seven puts the other team in the bonus.

    return logo(T[s].id).replace('<img', '<img style="display:inline-block"') + '<b>' + g.t[s].halfPf + '</b>' +

  };
  $('fouls').innerHTML = g.over ? '' : 'Fouls' + f('A') + f('H');
}

// The other games: the football board's short logo cards.

    var pts = function(t, lo){ return '<span class="s' + (lo ? ' lo' : '') + '">' + t.score + '</span>'; };
    return '<div class="gc post" style="left:' + (12 + i * 317) + 'px"><div class="gl">' + side(o.away) + pts(o.away, lead > 0) +
           '<span class="vs">–</span>' + pts(o.home, lead < 0) + side(o.home) + '</div>' +
           '<div class="gf"><span class="ck">Final</span><span class="st"></span><span class="tv">' + esc(o.tv) + '</span></div></div>';

}

/* ------------------------------ the shot chart ------------------------------ */
// The court at 13 px a foot: 94 x 50 ft is 1222 x 650... too tall for the
// screen, so 11.4 px a foot (1072 x 570) centred in the 1240 x 573 box.
var FT = 11.4, CW = 94 * FT, CH = 50 * FT, CX = (1240 - CW) / 2, CY = (573 - CH) / 2;
function courtLines(){
  var c = function(x){ return (CX + x * FT).toFixed(1); }, r = function(y){ return (CY + y * FT).toFixed(1); };
  var L = 'stroke="rgba(255,255,255,0.85)" stroke-width="2.5" fill="none"';
  var h = '<defs><linearGradient id="wood" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#C99257"/><stop offset="1" stop-color="#A8743F"/></linearGradient></defs>';
  h += '<rect x="' + c(0) + '" y="' + r(0) + '" width="' + CW + '" height="' + CH + '" fill="url(#wood)" rx="4"/>';
  for(var y = 2.5; y < 50; y += 2.5) h += '<line x1="' + c(0) + '" y1="' + r(y) + '" x2="' + c(94) + '" y2="' + r(y) + '" stroke="rgba(80,45,15,0.18)" stroke-width="1"/>';
  h += '<rect x="' + c(0) + '" y="' + r(0) + '" width="' + CW + '" height="' + CH + '" fill="rgba(4,10,24,0.22)" rx="4"/>';
  // each end: the lane (BYU blue), free-throw circle, arc, rim
  [0, 1].forEach(function(end){
    var bx = end ? 94 - 5.25 : 5.25, dir = end ? -1 : 1, base = end ? 94 : 0;
    var laneX = end ? 94 - 19 : 0;
    h += '<rect x="' + c(laneX) + '" y="' + r(19) + '" width="' + (19 * FT) + '" height="' + (12 * FT) + '" fill="#0047BA" fill-opacity="0.55" ' + L + '/>';
    h += '<circle cx="' + c(base + dir * 19) + '" cy="' + r(25) + '" r="' + (6 * FT) + '" ' + L + '/>';
    // the three-point line: straight in the corners, then an arc 22 ft 1.75 in out
    var R = 22.146, cy = 25, yc = Math.sqrt(R * R - 21.65 * 21.65), cornerX = bx + dir * yc;
    h += '<path d="M' + c(base) + ' ' + r(cy - 21.65) + ' L' + c(cornerX) + ' ' + r(cy - 21.65) +
         ' A' + (R * FT).toFixed(1) + ' ' + (R * FT).toFixed(1) + ' 0 0 ' + (end ? 0 : 1) + ' ' + c(cornerX) + ' ' + r(cy + 21.65) +
         ' L' + c(base) + ' ' + r(cy + 21.65) + '" ' + L + '/>';
    h += '<line x1="' + c(base + dir * 4) + '" y1="' + r(22) + '" x2="' + c(base + dir * 4) + '" y2="' + r(28) + '" stroke="#FFFFFF" stroke-width="4"/>';
    h += '<circle cx="' + c(bx) + '" cy="' + r(25) + '" r="' + (0.75 * FT) + '" stroke="#FF7A1A" stroke-width="3" fill="none"/>';
  });
  h += '<line x1="' + c(47) + '" y1="' + r(0) + '" x2="' + c(47) + '" y2="' + r(50) + '" ' + L + '/>';
  h += '<circle cx="' + c(47) + '" cy="' + r(25) + '" r="' + (6 * FT) + '" ' + L + '/>';
  h += '<image href="https://a.espncdn.com/i/teamlogos/ncaa/500/' + T[FEAT].id + '.png" x="' + (CX + 47 * FT - 50) + '" y="' + (CY + 25 * FT - 50) + '" width="100" height="100" opacity="0.85"/>';
  h += '<rect x="' + c(0) + '" y="' + r(0) + '" width="' + CW + '" height="' + CH + '" ' + L + ' rx="4"/>';
  return h;
}
// BYU shoots at the right-hand basket, the other team at the left.
function shotXY(s){
  var right = s.team === FEAT, along = 5.25 + Math.max(-3, s.y), across = s.x;
  return right ? { x: CX + (94 - along) * FT, y: CY + across * FT } : { x: CX + along * FT, y: CY + (50 - across) * FT };
}
function drawShots(g){
  var h = courtLines();
  g.shots.forEach(function(s, k){
    var at = shotXY(s), col = COLOR[s.team], recent = k >= g.shots.length - 2;
    h += s.made
      ? '<circle cx="' + at.x.toFixed(1) + '" cy="' + at.y.toFixed(1) + '" r="' + (s.three ? 9 : 8) + '" fill="' + col + '" stroke="#05080F" stroke-width="2"/>'
      : '<circle cx="' + at.x.toFixed(1) + '" cy="' + at.y.toFixed(1) + '" r="7" fill="none" stroke="' + col + '" stroke-width="3" stroke-opacity="0.85"/>';
    if(recent) h += '<circle cx="' + at.x.toFixed(1) + '" cy="' + at.y.toFixed(1) + '" r="15" fill="none" stroke="#5FA8FF" stroke-width="3"/>';
  });
  $('court').innerHTML = h;
  $('shSub').textContent = T[FEAT].name + ' shoots right · ' + T[OPP].name + ' shoots left';
  $('shSco').innerHTML = '<span class="o">' + esc(T.A.abbr) + '</span><b class="o">' + g.score.A + '</b>' + esc(T.H.abbr) + '<b>' + g.score.H + '</b><span class="q">' + esc(clockText(g)) + '</span>';
  var dot = function(col, made){ return '<svg width="22" height="22">' + (made ? '<circle cx="11" cy="11" r="8" fill="' + col + '"/>' : '<circle cx="11" cy="11" r="7" fill="none" stroke="' + col + '" stroke-width="3"/>') + '</svg>'; };
  var fg = function(s){ var t = g.t[s]; return t.fgm + '-' + t.fga + ' (' + pct(t.fgm, t.fga) + '), 3PT ' + t.tpm + '-' + t.tpa; };
  $('shFt').innerHTML = '<span class="it">' + dot(COLOR[FEAT], 1) + dot(COLOR[FEAT], 0) + esc(T[FEAT].name) + ' ' + fg(FEAT) + '</span>' +
    '<span class="it">' + dot(COLOR[OPP], 1) + dot(COLOR[OPP], 0) + esc(T[OPP].name) + ' ' + fg(OPP) + '</span>' +
    '<span class="it">Filled: made · Ring: missed · Free throws not shown</span><span class="back">Back to live</span>';
}

/* ------------------------------ banners ------------------------------ */
var bannerTimer = null;
function banner(a, b, ms){
  $('bA').textContent = a; $('bB').textContent = b || '';
  $('banner').className = 'abs pill np on';
  clearTimeout(bannerTimer);
  bannerTimer = setTimeout(function(){ $('banner').className = 'abs pill np'; }, ms || 5000);
}
var toastTimer = null;
function toast(text){
  $('toast').textContent = text; $('toast').className = 'abs np on';
  clearTimeout(toastTimer); toastTimer = setTimeout(function(){ $('toast').className = 'abs np'; }, 4500);
}

/* ------------------------------ the replay ------------------------------ */
// From 8:00 left in the game unless ?from=start; a play every 2.4 s, the
// way it would arrive live (sped up), then the final holds.
var STEP = 2400;
function startIndex(){
  if(/[?&]at=final\b/.test(QS)) return P.length - 1;
  if(/[?&]from=start\b/.test(QS)) return 0;
  for(var i = 0; i < P.length; i++) if(P[i][0] === 2 && P[i][1] <= 480) return i;
  return 0;
}
var upto = startIndex(), game = null, prevRows = null, shotsOpen = false;
function show(fresh){
  var before = fresh ? game : null;
  game = gameAt(upto);
  drawScore(game);
  prevRows = teamRows(game, prevRows);
  leaderRows(game);
  drawFlow(game);
  drawStrip(game);
  if(shotsOpen) drawShots(game);
  var p = P[upto];
  if(before && p && p[5] === 'tmo') banner('Timeout', T[p[4]].name + ' · ' + (TIMEOUTS - game.t[p[4]].tmo) + ' left', 6000);
  if(before && p && p[5] === 'tv') banner('TV timeout', clockText(game), 5000);
}
function step(){
  if(upto >= P.length - 1) return;
  upto++;
  // Quiet plays (rebounds after a made free throw, TV breaks) go by faster.
  var p = P[upto];
  show(true);
  var wait = p[5] === 'tmo' || p[5] === 'tv' ? 6500 : STEP;
  if(upto < P.length - 1) setTimeout(step, wait);
}

/* ------------------------------ buttons ------------------------------ */
function openShots(){ shotsOpen = true; drawShots(game); $('shots').className = 'abs on'; }
function closeShots(){ shotsOpen = false; $('shots').className = 'abs'; }
$('btnShots').onclick = openShots;
$('flow').onclick = openShots;
$('shots').onclick = closeShots;
$('btnFootball').onclick = function(){ toast('Shows when BYU football is on at the same time. Tap it to go to the football game; the football game is the default.'); };
$('btnHome').onclick = function(){ toast('Back to all the games. In the demo it stays here.'); };

drawGames();
show();
setInterval(function(){ statPage = statPage ? 0 : 1; prevRows = null; show(); }, 10000);
if(upto < P.length - 1) setTimeout(step, 3000);
if(document.fonts && document.fonts.ready) document.fonts.ready.then(function(){ $('stage').className = 'ready'; });
setTimeout(function(){ $('stage').className = 'ready'; }, 1500);
</script>
