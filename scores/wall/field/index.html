<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>BYU Gameday · Field demo</title>
<meta name="theme-color" content="#03060F" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Public+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  /* ---------------------------------------------------------------------------
     A demo of the BYU gameday screen "under the lights", built the way the
     real one will run on the kitchen calendar (Chromium 74, slow hardware):
     the sky, glows and tilted field are ONE pre-baked picture; the lines, the
     drive and the ball are drawn flat on top at positions worked out with the
     same perspective math the picture was baked with. Nothing here is 3D and
     nothing is blurred live.

     The whole screen is laid out at 1280x695, the calendar's page size, so
     it shows there unscaled; anywhere else it is scaled to fit the window.
     No ?. or ??, no flex gap: Chromium 74.
     --------------------------------------------------------------------------- */
  :root{
    --ink:#FFFFFF; --dim:rgba(255,255,255,0.62); --faint:rgba(255,255,255,0.4);
    --gold:#FFE7A3; --byu:#9DC3F0; --panel:rgba(4,10,26,0.82); --rule:rgba(255,255,255,0.08);
    --isu:#F1BE48; --bad:#FF5A4E;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;overflow:hidden;background:#03060F;}
  body{font-family:'Public Sans',Helvetica,Arial,sans-serif;color:var(--ink);font-variant-numeric:tabular-nums;
    -webkit-font-smoothing:antialiased;cursor:default;user-select:none;-webkit-user-select:none;}
  #stage{position:absolute;left:0;top:0;width:1280px;height:695px;transform-origin:0 0;overflow:hidden;
    background:#03060F url(lights.jpg) 0 0 / 1280px 695px no-repeat;visibility:hidden;}
  #stage.ready{visibility:visible;}
  #overlay{position:absolute;left:0;top:0;pointer-events:none;}
  .abs{position:absolute;}
  .np{pointer-events:none;}
  #tap{left:0;top:380px;width:1280px;height:315px;cursor:pointer;}

  /* ---- the ball and things that sit on the turf ---- */
  #ball{left:0;top:0;width:40px;height:25px;margin:-12px 0 0 -20px;border-radius:50%;
    background:radial-gradient(ellipse at 40% 35%,#A8622F 0%,#7A3F18 70%);border:3px solid #FFFFFF;
    box-shadow:0 4px 10px rgba(0,0,0,0.7);transition:transform 0.9s cubic-bezier(.3,.8,.3,1);will-change:transform;}
  .chip{font-family:'Big Shoulders Display',sans-serif;font-weight:800;font-size:24px;line-height:27px;padding:0 8px;
    border-radius:6px;background:rgba(0,0,0,0.62);white-space:nowrap;transform:translate(-50%,-100%);}
  .chip.last{background:#FFFFFF;color:#0B1220;}
  .chip.neg{background:var(--bad);color:#FFFFFF;}
  .chip.flag{background:#FFD633;color:#2A1405;}
  .chip.kick{color:var(--gold);}
  #downbox{width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:4px;background:#FF7A1A;text-align:center;
    font-family:'Big Shoulders Display',sans-serif;font-weight:900;font-size:25px;line-height:30px;
    box-shadow:0 2px 6px rgba(0,0,0,0.6);transition:transform 0.9s cubic-bezier(.3,.8,.3,1);z-index:2;}

  /* ---- top: score in the middle, panels either side ---- */
  .panel{top:10px;width:424px;height:350px;padding:10px 18px;background:var(--panel);
    border:1px solid rgba(255,255,255,0.12);border-radius:16px;}
  .ph{display:flex;align-items:center;height:30px;font-size:15px;font-weight:800;letter-spacing:2px;color:var(--dim);}
  .ph .c{width:104px;text-align:right;}
  .ph .c.byu{color:var(--byu);}
  .dots i{display:inline-block;width:9px;height:9px;border-radius:5px;margin-left:6px;background:rgba(255,255,255,0.2);}
  .dots i.on{background:var(--gold);}
  .row{display:flex;align-items:center;height:51px;border-top:1px solid var(--rule);font-size:28px;font-weight:700;}
  .row .k{flex:1;min-width:0;font-size:22px;font-weight:500;color:rgba(255,255,255,0.78);white-space:nowrap;}
  .row .c{width:104px;text-align:right;white-space:nowrap;}
  .row .c.o{color:var(--dim);}
  .row.fB .c.b,.row.fA .c.o{color:var(--gold);}
  .ld{display:flex;align-items:center;height:51px;border-top:1px solid var(--rule);}
  .ld .t{width:52px;font-size:14px;font-weight:800;letter-spacing:1px;color:var(--gold);}
  .ld .t.o{color:var(--faint);}
  .ld .n{flex:1;min-width:0;font-size:23px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .ld .n.o{color:var(--dim);font-weight:600;}
  .ld .v{font-size:21px;color:rgba(255,255,255,0.82);white-space:nowrap;margin-left:8px;}
  .ld .v.o{color:var(--faint);}
  .ld.new .n{color:var(--gold);}

  #score{left:438px;top:8px;width:404px;display:flex;flex-direction:column;align-items:center;}
  .sc{display:flex;align-items:flex-end;}
  .tm{display:flex;flex-direction:column;align-items:center;width:124px;}
  .tm .nm{font-size:21px;font-weight:700;white-space:nowrap;}
  .tm .pts{font-family:'Big Shoulders Display',sans-serif;font-weight:800;font-size:92px;line-height:0.9;}
  .tm.o .nm,.tm.o .pts{color:var(--dim);}
  .tos{height:8px;margin-top:3px;}
  .tos i{display:inline-block;width:16px;height:4px;border-radius:2px;margin:0 2px;background:var(--gold);vertical-align:top;}
  .tos i.used{background:rgba(255,255,255,0.18);}
  .poss{display:inline-block;width:14px;height:9px;border-radius:50%;background:#A8622F;border:1.5px solid #FFFFFF;
    margin-right:5px;vertical-align:1px;visibility:hidden;}
  .poss.on{visibility:visible;}
  .rk{color:var(--gold);font-size:19px;font-weight:800;margin-right:5px;}
  .mid{display:flex;flex-direction:column;align-items:center;width:156px;padding-bottom:14px;}
  .clk{font-family:'Big Shoulders Display',sans-serif;font-weight:700;font-size:36px;white-space:nowrap;color:var(--gold);}
  .net{font-size:17px;font-weight:800;letter-spacing:2px;color:rgba(255,255,255,0.85);}
  .dd{font-size:27px;font-weight:800;margin-top:2px;}
  .lines{margin-top:6px;background:rgba(4,10,26,0.75);border-radius:10px;padding:4px 12px;font-size:21px;}
  .lines table{border-collapse:collapse;}
  .lines td{padding:1px 8px;text-align:center;color:rgba(255,255,255,0.9);font-weight:600;}
  .lines td.h{color:var(--dim);font-size:15px;font-weight:800;letter-spacing:1px;}
  .lines td.t{text-align:left;font-weight:700;color:#FFFFFF;}
  .lines td.tot{font-weight:800;color:#FFFFFF;}

  /* timeouts and replays get a pill just under the score */
  .pill{left:640px;top:262px;transform:translateX(-50%);white-space:nowrap;text-align:center;border-radius:12px;
    padding:6px 16px 7px;background:rgba(3,6,15,0.9);border:1px solid rgba(255,231,163,0.5);display:none;}
  .pill.on{display:block;}
  .pill .a{font-family:'Big Shoulders Display',sans-serif;font-weight:800;font-size:32px;letter-spacing:2px;color:var(--gold);}
  .pill .b{font-size:17px;font-weight:600;color:var(--dim);}
  #replay .a{color:#FFFFFF;}
  #replay .dot{display:inline-block;width:12px;height:12px;border-radius:6px;background:var(--bad);margin-right:8px;vertical-align:1px;}

  #drive{right:14px;bottom:10px;max-width:640px;background:rgba(3,6,15,0.8);border-radius:10px;padding:8px 14px;}
  #drive .a{font-size:15px;font-weight:700;letter-spacing:1px;color:var(--dim);}
  #drive .b{font-size:23px;font-weight:600;margin-top:1px;}
  #key{left:14px;bottom:62px;font-size:15px;font-weight:600;color:var(--dim);background:rgba(3,6,15,0.6);border-radius:8px;padding:5px 10px;}
  #key svg{vertical-align:middle;margin:0 4px 0 10px;}
  #key svg:first-child{margin-left:0;}
  #btnDrives{left:14px;bottom:10px;font-size:17px;font-weight:800;letter-spacing:1px;color:#0B1220;background:#FFFFFF;
    border-radius:22px;padding:10px 18px;cursor:pointer;}
  #demo{left:180px;bottom:22px;font-size:13px;font-weight:700;letter-spacing:2px;color:var(--faint);}

  /* ---- touchdown ---- */
  #td{left:0;right:0;top:390px;text-align:center;font-family:'Big Shoulders Display',sans-serif;font-weight:900;
    font-size:150px;line-height:1;letter-spacing:4px;color:#FFFFFF;text-shadow:0 6px 30px rgba(0,46,93,0.9);
    opacity:0;transform:scale(0.7);transition:opacity .35s, transform .5s cubic-bezier(.2,1.4,.4,1);}
  #td.on{opacity:1;transform:none;}

  /* ---- every drive: flat field, one bar per drive ---- */
  #drives{left:0;top:0;width:1280px;height:695px;background:#0B1220;display:none;cursor:pointer;}
  #drives.on{display:block;}
  #drives .hd{position:absolute;left:24px;right:24px;top:4px;height:52px;display:flex;align-items:center;}
  #drives .ttl{font-family:'Big Shoulders Display',sans-serif;font-weight:800;font-size:32px;letter-spacing:1px;margin-right:18px;}
  #drives .sub{font-size:17px;color:var(--dim);}
  #drives .sco{margin-left:auto;font-size:20px;font-weight:700;}
  #drives .sco b{font-family:'Big Shoulders Display',sans-serif;font-weight:800;font-size:34px;margin:0 16px 0 6px;}
  #drives .sco .o{color:var(--dim);}
  #drives .sco .q{font-family:'Big Shoulders Display',sans-serif;font-size:26px;color:var(--gold);}
  #flat{left:20px;top:60px;width:1240px;height:573px;border-radius:6px;}
  #flatDim{left:20px;top:60px;width:1240px;height:573px;border-radius:6px;background:rgba(4,14,9,0.5);}
  .bar{position:absolute;border-radius:15px;font-family:'Big Shoulders Display',sans-serif;font-weight:800;font-size:18px;
    white-space:nowrap;box-shadow:0 3px 10px rgba(0,0,0,0.5);display:flex;align-items:center;cursor:pointer;}
  .bar.BYU{background:#FFFFFF;color:#002E5D;justify-content:flex-end;padding-right:14px;}
  .bar.ISU{background:var(--isu);color:#2A1405;padding-left:14px;}
  .bar.fade{opacity:0.55;box-shadow:none;}
  .bar.now{border:3px solid #FFD23F;box-shadow:0 0 16px rgba(255,210,63,0.6);}
  .bar .out{position:absolute;color:#FFFFFF;}
  .half{position:absolute;left:40px;width:1200px;height:2px;background:rgba(255,255,255,0.8);}
  .halfT{position:absolute;left:46px;font-family:'Big Shoulders Display',sans-serif;font-weight:800;font-size:14px;letter-spacing:3px;color:rgba(255,255,255,0.85);}
  #drives .ft{position:absolute;left:24px;right:24px;top:638px;height:54px;display:flex;align-items:center;font-size:19px;color:rgba(255,255,255,0.85);}
  #drives .ft .k{display:inline-block;width:26px;height:12px;border-radius:6px;margin:0 8px 0 0;vertical-align:-1px;}
  #drives .ft span.it{margin-right:26px;}
  #drives .ft .back{margin-left:auto;font-size:16px;font-weight:700;color:#0B1220;background:#FFFFFF;border-radius:22px;padding:10px 18px;}
</style>
</head>
<body>
<div id="stage">
  <svg id="overlay" width="1280" height="695" viewBox="0 0 1280 695" aria-hidden="true">
    <g id="lines"></g>
    <g id="trail"></g>
  </svg>
  <div class="abs" id="tap" title="Every drive"></div>
  <div id="chips" class="np"></div>
  <div class="abs np" id="downbox" style="transition:none">1</div>
  <div class="abs np" id="ball" style="transition:none"></div>

  <div class="abs panel" style="left:12px">
    <div class="ph"><span style="flex:1"><span id="tT">TEAM STATS</span><span class="dots" id="tD"></span></span><span class="c">ISU</span><span class="c byu">BYU</span></div>
    <div id="team"></div>
  </div>

  <div class="abs" id="score">
    <div class="sc">
      <div class="tm o"><div class="nm"><span class="poss" id="pA"></span>Iowa State</div><div class="pts" id="sA">10</div><div class="tos" id="toA"></div></div>
      <div class="mid"><div class="clk" id="clk">Q4 9:52</div><div class="net">ESPN</div></div>
      <div class="tm"><div class="nm"><span class="poss" id="pH"></span><span class="rk">14</span>BYU</div><div class="pts" id="sH">24</div><div class="tos" id="toH"></div></div>
    </div>
    <div class="dd" id="dd"></div>
    <div class="lines"><table id="lineScore"></table></div>
  </div>

  <div class="abs panel" style="right:12px">
    <div class="ph"><span style="flex:1" id="lT">BYU OFFENSE</span><span class="dots" id="lD"></span></div>
    <div id="leaders"></div>
  </div>

  <div class="abs pill np" id="banner"><div class="a" id="bA"></div><div class="b" id="bB"></div></div>
  <div class="abs pill np" id="replay"><div class="a"><span class="dot"></span>REPLAY</div><div class="b" id="rB"></div></div>

  <div class="abs np" id="key">
    <svg width="34" height="10"><line x1="2" y1="5" x2="32" y2="5" stroke="#FFF" stroke-width="4" stroke-linecap="round"/></svg>run
    <svg width="34" height="14"><path d="M2 12 Q17 -4 32 12" fill="none" stroke="#FFF" stroke-width="3" stroke-dasharray="6 4"/></svg>pass
    <svg width="34" height="10"><line x1="2" y1="5" x2="32" y2="5" stroke="#FF5A4E" stroke-width="4" stroke-linecap="round"/></svg>loss
    <svg width="34" height="10"><line x1="2" y1="5" x2="32" y2="5" stroke="#FFD633" stroke-width="3" stroke-dasharray="2 4"/></svg>flag
  </div>
  <div class="abs np" id="drive"><div class="a" id="dA"></div><div class="b" id="dB"></div></div>
  <div class="abs" id="btnDrives">ALL DRIVES</div>
  <div class="abs np" id="demo">DEMO · MADE-UP GAME</div>
  <div class="abs np" id="td">TOUCHDOWN</div>

  <div class="abs" id="drives">
    <div class="hd">
      <div class="ttl">Every drive</div>
      <div class="sub">BYU attacks right · Iowa State attacks left</div>
      <div class="sco"><span class="o">ISU</span><b class="o" id="dvA"></b>BYU<b id="dvH"></b><span class="q" id="dvC"></span></div>
    </div>
    <img class="abs" id="flat" alt="" src="flat.jpg">
    <div class="abs" id="flatDim"></div>
    <div id="bars"></div>
    <div class="ft">
      <span class="it"><i class="k" style="background:#FFFFFF"></i>BYU</span>
      <span class="it"><i class="k" style="background:#F1BE48"></i>Iowa State</span>
      <span class="it"><i class="k" style="background:rgba(255,255,255,0.55)"></i>Faded: punt or turnover</span>
      <span class="it">Tap a drive to replay it</span>
      <span class="back">Back to live</span>
    </div>
  </div>
</div>

<script>
/* ===========================================================================
   Perspective: the picture was baked as a 1240x573 plane (the field image) at
   (20,85) tilted back 38deg with perspective 1100px, perspective origin at
   50% -40%. project() maps a point on that plane to the screen, so anything
   drawn here lands on the right spot of the turf.
   =========================================================================== */
var PW = 1240, PH = 573, OX = 20, OY = 85, D = 1100, TH = 38 * Math.PI / 180;
var POX = PW / 2, POY = -0.4 * PH;
function project(u, v){
  var X = u - PW / 2, Y = v - PH;
  var yp = Y * Math.cos(TH), z = Y * Math.sin(TH);
  var s = D / (D - z);
  var px = X + PW / 2, py = yp + PH;
  return { x: OX + POX + (px - POX) * s, y: OY + POY + (py - POY) * s, s: s };
}
// Field coordinates: yards from BYU's goal line (0-100, BYU attacks right),
// and yards in from the far sideline (0-53.3). The image is 10 CSS px a yard,
// with a 20 px apron and 10-yard end zones.
function spot(yd, lat){ return project(20 + (10 + yd) * 10, 20 + lat * 10); }

var $ = function(id){ return document.getElementById(id); };
var esc = function(s){ return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); };
var MINUS = '−';
function plural(n, w){ return n + ' ' + w + (n === 1 ? '' : 'S'); }
function signed(n){ return n > 0 ? '+' + n : n < 0 ? MINUS + (-n) : '0'; }

/* ---------------------------- fit the window ---------------------------- */
function fit(){
  var k = Math.min(window.innerWidth / 1280, window.innerHeight / 695);
  var st = $('stage');
  st.style.transform = 'scale(' + k + ')';
  st.style.left = Math.round((window.innerWidth - 1280 * k) / 2) + 'px';
  st.style.top = Math.round((window.innerHeight - 695 * k) / 2) + 'px';
}
window.addEventListener('resize', fit);
fit();

/* ------------------------------ teams ------------------------------ */
var TEAMS = {
  BYU: { full: 'BYU', color: '#FFFFFF', dir: 1 },
  ISU: { full: 'Iowa State', color: '#F1BE48', dir: -1 },
};
function other(t){ return t === 'BYU' ? 'ISU' : 'BYU'; }
function toGoal(team, yd){ return team === 'BYU' ? 100 - yd : yd; }
function fieldPos(yd){ return yd === 50 ? '50' : yd < 50 ? 'BYU ' + yd : 'ISU ' + (100 - yd); }
function ord(n){ return ['', '1st', '2nd', '3rd', '4th'][n]; }
function scoreText(){ return state.game.score.BYU + '–' + state.game.score.ISU; }

/* ===========================================================================
   Plays. Every play is { t, from, to, yds, text } in field yards, plus:
     inc:  air  (how far the throw went; the ball stays at from)
     int:  air, caught  (where it was picked off; to = where the return ended)
     punt: to = where it landed or was downed
     fg:   dist, good
   t is one of rush pass inc sack pen int fum punt fg. A rush for a loss is
   still a rush; it is drawn in red because yds < 0.
   =========================================================================== */
function ballAt(p){ return p.t === 'inc' || p.t === 'fg' ? p.from : p.to; }
function ends(p){ return p.td || p.t === 'punt' || p.t === 'int' || p.t === 'fum' || p.t === 'fg'; }
function scrimEnd(p){ return p.t === 'punt' || p.t === 'int' || p.t === 'fum' || p.t === 'fg' ? p.from : p.to; }

/* ------------------------------ drawing ------------------------------ */
function pts(list){ return list.map(function(p){ return p.x.toFixed(1) + ',' + p.y.toFixed(1); }).join(' '); }
function quad(yd, half, color, opacity){
  return '<polygon points="' + pts([spot(yd - half, 0), spot(yd + half, 0), spot(yd + half, 53.3), spot(yd - half, 53.3)]) +
         '" fill="' + color + '" fill-opacity="' + opacity + '"/>';
}
// A soft glow is just a wider, fainter copy underneath: no blur filters.
function fieldLine(yd, color){
  return quad(yd, 1.4, color, 0.18) + quad(yd, 0.8, color, 0.3) + quad(yd, 0.38, color, 0.95);
}

var LANE = 38;      // the drive runs between the near hashes and the numbers
var LANE2 = 41.5;   // losses, flags and returns run a little nearer, so they don't hide the gains
var BAD = '#FF5A4E', FLAG = '#FFD633';

function seg(a, b, color, w, dash){
  var d = 'M' + a.x.toFixed(1) + ' ' + a.y.toFixed(1) + ' L' + b.x.toFixed(1) + ' ' + b.y.toFixed(1);
  return '<path d="' + d + '" fill="none" stroke="#000" stroke-opacity="0.35" stroke-width="' + (w + 4) + '" stroke-linecap="round"/>' +
         '<path d="' + d + '" fill="none" stroke="' + color + '" stroke-width="' + w + '" stroke-linecap="round"' +
         (dash ? ' stroke-dasharray="' + dash + '"' : '') + '/>';
}
// Passes and kicks fly: a curve lifted off the turf. Returns the svg and the top of the curve (for the label).
function arc(a, b, lift, color, w, dash, opacity){
  var cx = (a.x + b.x) / 2, cy = Math.min(a.y, b.y) - lift;
  var d = 'M' + a.x.toFixed(1) + ' ' + a.y.toFixed(1) + ' Q' + cx.toFixed(1) + ' ' + cy.toFixed(1) + ' ' + b.x.toFixed(1) + ' ' + b.y.toFixed(1);
  var o = opacity === undefined ? 1 : opacity;
  return {
    svg: '<path d="' + d + '" fill="none" stroke="#000" stroke-opacity="' + (0.3 * o) + '" stroke-width="' + (w + 3) + '"/>' +
         '<path d="' + d + '" fill="none" stroke="' + color + '" stroke-opacity="' + o + '" stroke-width="' + w + '" stroke-dasharray="' + dash + '"/>',
    top: { x: cx, y: 0.25 * a.y + 0.5 * cy + 0.25 * b.y },
  };
}
function cross(p, color){
  var r = 8, d = 'M' + (p.x - r) + ' ' + (p.y - r) + ' L' + (p.x + r) + ' ' + (p.y + r) + ' M' + (p.x + r) + ' ' + (p.y - r) + ' L' + (p.x - r) + ' ' + (p.y + r);
  return '<path d="' + d + '" stroke="#000" stroke-opacity="0.5" stroke-width="7" stroke-linecap="round"/>' +
         '<path d="' + d + '" stroke="' + color + '" stroke-width="4" stroke-linecap="round"/>';
}
function dot(p, color){ return '<circle cx="' + p.x.toFixed(1) + '" cy="' + p.y.toFixed(1) + '" r="6" fill="' + color + '" stroke="#000" stroke-opacity="0.4" stroke-width="2"/>'; }
function chip(at, text, cls){
  return '<div class="abs chip ' + (cls || '') + '" style="left:' + at.x.toFixed(0) + 'px;top:' + (at.y - 9).toFixed(0) + 'px">' + esc(text) + '</div>';
}
function mid(a, b){ return { x: (a.x + b.x) / 2, y: Math.min(a.y, b.y) }; }

// One play's marks on the field: { svg, chip }.
function drawPlay(p, team, last){
  var tc = TEAMS[team].color, dir = TEAMS[team].dir, cls = last ? 'last' : '';
  var a = spot(p.from, LANE), b, r;
  switch(p.t){
    case 'rush':
    case 'sack':
      if(p.yds < 0){ a = spot(p.from, LANE2); b = spot(p.to, LANE2); return { svg: seg(a, b, BAD, 6) + dot(b, BAD), chip: chip(mid(a, b), signed(p.yds), 'neg') }; }
      b = spot(p.to, LANE);
      return { svg: seg(a, b, tc, 6) + dot(b, tc), chip: chip(mid(a, b), p.td ? 'TD' : signed(p.yds), cls) };
    case 'pass':
      b = spot(p.to, LANE);
      r = arc(a, b, 16 + Math.abs(p.yds) * 1.6, tc, 5, '10 7');
      return { svg: r.svg + dot(b, tc), chip: chip(r.top, p.td ? 'TD' : signed(p.yds), cls) };
    case 'inc':
      b = spot(p.from + dir * p.air, LANE);
      r = arc(a, b, 16 + p.air * 1.6, tc, 4, '8 8', 0.5);
      return { svg: r.svg + cross(b, 'rgba(255,255,255,0.8)'), chip: chip(r.top, 'INC', cls) };
    case 'pen':
      a = spot(p.from, LANE2); b = spot(p.to, LANE2);
      return { svg: seg(a, b, FLAG, 4, '2 7') + '<rect x="' + (b.x - 6).toFixed(1) + '" y="' + (b.y - 6).toFixed(1) + '" width="12" height="12" rx="2" fill="' + FLAG + '"/>',
               chip: chip(mid(a, b), 'FLAG ' + signed(p.yds), 'flag') };
    case 'int':
    case 'fum':
      b = spot(p.caught, LANE);
      r = p.t === 'int' ? arc(a, b, 16 + p.air * 1.6, tc, 4, '8 8', 0.6) : { svg: '', top: b };
      return { svg: r.svg + seg(spot(p.caught, LANE2), spot(p.to, LANE2), BAD, 5, '3 7') + cross(b, BAD),
               chip: chip(r.top, p.t === 'int' ? 'INT' : 'FUMBLE', 'neg') };
    case 'punt':
      b = spot(p.to, LANE);
      r = arc(a, b, 150, tc, 3, '3 8', 0.85);
      return { svg: r.svg + dot(b, tc), chip: chip(r.top, 'PUNT ' + Math.abs(p.to - p.from), 'kick') };
    case 'fg':
      // toward the posts on the end line, kept in the drive's lane so it stays clear of the panels
      b = spot(dir > 0 ? 110 : -10, LANE - 6);
      r = arc(a, b, 60, p.good ? FLAG : BAD, 3, '3 8');
      return { svg: r.svg, chip: chip(r.top, 'FG ' + p.dist + (p.good ? ' ✓' : ' ✗'), p.good ? 'kick' : 'neg') };
  }
  return { svg: '', chip: '' };
}

/* ---------------------------------------------------------------------------
   Leaders, worked out from the box score every time (the same rule the live
   version will use on ESPN's per-player box score):
     BYU  PASS  the most passing yards
          RUSH  the top two in rushing yards
          REC   the top three in receiving yards
          DEF   the most total tackles (ties: more tackles for loss)
          SACK  the most sacks (if nobody has one yet: TFL, the most TFLs)
          KICK  the kicker
     ISU  one line each for passing, rushing and receiving yards
   So a name can move up or drop off as the game goes; a new name shows gold.
   Page 1 is BYU's offense; page 2 is the BYU defense, the kicker and ISU.
   --------------------------------------------------------------------------- */
function best(list, key, n, tie){
  return list.slice().sort(function(x, y){ return (y[key] - x[key]) || (tie ? y[tie] - x[tie] : 0); }).slice(0, n);
}
function leaderRows(){
  var B = state.players.BYU, A = state.players.ISU, lines = [];
  var add = function(tag, own, p, val){ lines.push({ tag: tag, own: own, name: p.n, val: val }); };
  var td = function(n){ return n ? ' · ' + (n > 1 ? n + ' TD' : 'TD') : ''; };
  var p = best(B.pass, 'y', 1)[0];
  add('PASS', true, p, p.c + '/' + p.a + ' · ' + p.y + ' · ' + p.td + ' TD' + (p.int ? ' · ' + p.int + ' INT' : ''));
  best(B.rush, 'y', 2).forEach(function(r){ add('RUSH', true, r, r.car + ' · ' + r.y + td(r.td)); });
  best(B.rec, 'y', 3).forEach(function(r){ add('REC', true, r, r.r + ' · ' + r.y + td(r.td)); });
  p = best(B.def, 'tkl', 1, 'tfl')[0];
  add('DEF', true, p, p.tkl + ' tkl · ' + p.tfl + ' TFL' + (p.int ? ' · INT' : ''));
  p = best(B.def, 'sk', 1, 'tfl')[0];
  if(p.sk) add('SACK', true, p, p.sk + (p.sk === 1 ? ' sack' : ' sacks'));
  else { p = best(B.def, 'tfl', 1)[0]; add('TFL', true, p, p.tfl + ' TFL'); }
  p = B.kick[0];
  add('KICK', true, p, 'FG ' + p.fgm + '/' + p.fga + (p.lng ? ' · ' + p.lng : '') + ' · XP ' + p.xpm + '/' + p.xpa);
  p = best(A.pass, 'y', 1)[0];
  add('ISU', false, p, p.c + '/' + p.a + ' · ' + p.y);
  p = best(A.rush, 'y', 1)[0];
  add('ISU', false, p, p.car + ' · ' + p.y);
  p = best(A.rec, 'y', 1)[0];
  add('ISU', false, p, p.r + ' · ' + p.y);

  var before = state.leaderNames, now = lines.map(function(l){ return l.tag + l.name; });
  $('lT').textContent = statPage ? 'DEFENSE · IOWA STATE' : 'BYU OFFENSE';
  $('lD').innerHTML = dots();
  var first = statPage ? 6 : 0;
  $('leaders').innerHTML = lines.slice(first, first + 6).map(function(l, i){
    var o = l.own ? '' : ' o', isNew = before && before.indexOf(now[first + i]) < 0;
    return '<div class="ld' + (isNew ? ' new' : '') + '"><span class="t' + o + '">' + l.tag + '</span><span class="n' + o + '">' +
           esc(l.name) + '</span><span class="v' + o + '">' + esc(l.val) + '</span></div>';
  }).join('');
  state.leaderNames = now;
}

/* ===========================================================================
   Every drive: the flat field with one bar per drive, top to bottom in game
   order. Tap a drive to replay it on the big field; tap anywhere else to go
   back. It closes itself after a minute so the wall never gets stuck here.
   =========================================================================== */
var drivesOpen = false, drivesTimer = 0;
function X(yd){ return 140 + yd * 10; }
function drawDrives(){
  var g = state.game;
  $('dvA').textContent = g.score.ISU; $('dvH').textContent = g.score.BYU; $('dvC').textContent = 'Q4 ' + g.clock;
  var list = state.drives.slice();
  if(!state.over && state.cur.plays.length) list.push({ team: state.cur.team, start: state.cur.start, end: g.spot, result: 'NOW', q: 4, now: true });
  var sep = 22, n = list.length, h = Math.min(42, (537 - sep) / Math.max(n, 1)), bh = Math.max(16, Math.round(h - 8)), y = 78, html = '';
  list.forEach(function(d, i){
    if(i && list[i - 1].q <= 2 && d.q >= 3){
      html += '<div class="half" style="top:' + (y + sep / 2 - 6).toFixed(0) + 'px"></div><div class="halfT" style="top:' + (y + sep / 2 - 2).toFixed(0) + 'px">HALFTIME</div>';
      y += sep;
    }
    var x0 = X(Math.min(d.start, d.end)), w = Math.max(10, Math.abs(d.end - d.start) * 10);
    var label = d.result === 'TD' || d.result === 'FG' ? d.result + ' · ' + d.score : d.result;
    var fade = d.result === 'Punt' || d.result === 'INT' || d.result === 'Fumble' || d.result === 'Downs';
    var inside = w >= 18 + label.length * 9;
    var outPos = d.team === 'BYU' ? 'left:' + (w + 8) + 'px' : 'right:' + (w + 8) + 'px';
    html += '<div class="bar ' + d.team + (fade ? ' fade' : '') + (d.now ? ' now' : '') + '" data-i="' + (d.now ? 'now' : i) + '" style="left:' + x0 +
            'px;top:' + y.toFixed(0) + 'px;width:' + w + 'px;height:' + bh + 'px;font-size:' + Math.min(18, bh - 6) + 'px">' +
            (inside ? esc(label) : '<span class="out" style="' + outPos + '">' + esc(label) + '</span>') + '</div>';
    y += h;
  });
  $('bars').innerHTML = html;
}

function describe(d){

            Fumble: 'drive ending in a fumble', Downs: 'turned over on downs' }[d.result] || 'drive';
  return 'Q' + d.q + ' ' + r;

/* ===========================================================================
   Replays: the drive's plays again, one every 1.5 s, then back to live.
   After a touchdown the live version waits ~90 s (the extra point and the
   kickoff break) before replaying the scoring drive; the demo waits 7 s.
   =========================================================================== */
var REPLAY_AFTER_TD = 7000;
function startReplay(drive, why, done){
  clearTimeout(state.replayTimer);
  state.replay = { drive: drive, i: 0, why: why, done: done };
  snapBall(); render();
  var tick = function(){
    var r = state.replay;
    if(!r) return;
    if(r.i < r.drive.plays.length){
      r.i += 1; render();
      state.replayTimer = setTimeout(tick, r.i === r.drive.plays.length ? 3500 : 1500);
      return;
    }
    state.replay = null; snapBall(); render();
    if(r.done) r.done();
  };
  state.replayTimer = setTimeout(tick, 1400);
}

/* ===========================================================================
   The demo game. BYU leads Iowa State 24-10 with 9:52 left; the earlier
   drives are filled in so "All drives" has a whole game to show. The script
   then plays out: an ISU three-and-out with a sack and a punt, a BYU
   touchdown drive with a loss, a flag, an incompletion and an ISU
   timeout, the replay, an interception, and a field goal.
   =========================================================================== */
var PAST = [
  ['BYU', 25, 100, 'TD', 1, '7–0'], ['ISU', 75, 48, 'Punt', 1], ['BYU', 12, 40, 'INT', 1],
  ['ISU', 40, 22, 'FG', 2, '7–3'], ['BYU', 25, 100, 'TD', 2, '14–3'], ['ISU', 75, 66, 'Punt', 2],
  ['BYU', 30, 73, 'FG', 2, '17–3'],
  ['ISU', 75, 0, 'TD', 3, '17–10'], ['BYU', 25, 58, 'Punt', 3], ['ISU', 80, 71, 'Punt', 3],
  ['BYU', 20, 100, 'TD', 4, '24–10'],
];
// Rough plays for the earlier drives (the live version has every real play).
function synth(row){
  var team = row[0], dir = TEAMS[team].dir, pos = row[1], end = row[2], res = row[3], plays = [], i = 0;
  var pat = [6, 11, 3, 14, 8, 4, 17, 9, 5, 12];
  while(dir * (end - pos) > 0){
    var gain = Math.min(pat[i % pat.length], dir * (end - pos)), t = i % 2 ? 'pass' : 'rush', to = pos + dir * gain;
    var td = res === 'TD' && to === end;
    plays.push({ t: t, from: pos, to: to, yds: gain, td: td,
                 text: (t === 'rush' ? 'Run for ' : 'Pass complete for ') + gain + (td ? ', TOUCHDOWN' : '') });
    pos = to; i += 1;
  }
  if(res === 'Punt'){ var land = Math.max(5, Math.min(95, pos + dir * 42)); plays.push({ t: 'punt', from: pos, to: land, yds: 42, text: 'Punt, ' + Math.abs(land - pos) + ' yards' }); }
  if(res === 'INT') plays.push({ t: 'int', from: pos, air: 14, caught: pos + dir * 14, to: pos + dir * 14, yds: 0, text: 'Pass intercepted' });
  if(res === 'FG') plays.push({ t: 'fg', from: pos, to: pos, dist: toGoal(team, pos) + 17, good: true, yds: 0, text: (toGoal(team, pos) + 17) + '-yard field goal is good' });
  return { team: team, start: row[1], end: res === 'TD' ? end : pos, result: res, q: row[4], score: row[5] || '', plays: plays };
}

      BYU: {
        pass: [{ n: 'Q. Back', c: 19, a: 26, y: 279, td: 2, int: 1 }],
        rush: [{ n: 'R. Runner', car: 13, y: 74, td: 1 }, { n: 'B. Back', car: 8, y: 41, td: 0 }, { n: 'Q. Back', car: 5, y: 22, td: 0 }],
        rec: [{ n: 'W. Receiver', r: 5, y: 116, td: 1 }, { n: 'T. Catcher', r: 4, y: 69, td: 1 }, { n: 'J. Tight', r: 4, y: 42, td: 0 }, { n: 'S. Slot', r: 3, y: 31, td: 0 }],
        def: [{ n: 'L. Backer', tkl: 9, tfl: 1.5, sk: 0, int: 0 }, { n: 'C. Safety', tkl: 7, tfl: 0, sk: 0, int: 0 }, { n: 'E. Rusher', tkl: 4, tfl: 2, sk: 1, int: 0 }],
        kick: [{ n: 'K. Leg', fgm: 1, fga: 1, lng: 38, xpm: 3, xpa: 3 }],
      },
      ISU: {
        pass: [{ n: 'A. Passer', c: 16, a: 29, y: 98, td: 1, int: 0 }],
        rush: [{ n: 'B. Runner', car: 14, y: 61, td: 0 }, { n: 'C. Quick', car: 6, y: 29, td: 0 }],
        rec: [{ n: 'D. Wideout', r: 5, y: 41, td: 0 }, { n: 'F. End', r: 4, y: 33, td: 1 }],
        def: [{ n: 'M. Linebacker', tkl: 11, tfl: 1, sk: 0, int: 1 }],
        kick: [{ n: 'P. Kicker', fgm: 1, fga: 1, lng: 40, xpm: 1, xpa: 1 }],
      },
    },
    flash: { team: '', keys: '' },
    leaderNames: null,
    step: 0,
  };
}
function byName(list, name){
  for(var i = 0; i < list.length; i++) if(list[i].n === name) return list[i];
  return null;
}

function newDrive(team, at){
  var g = state.game;
  g.poss = team; g.spot = at; g.down = 1; g.toGo = Math.min(10, toGoal(team, at));
  state.cur = { team: team, start: at, plays: [] };
  state.over = false; state.overText = ''; state.flash = { team: '', keys: '' };
  snapBall();
}
function endDrive(result, text){
  var c = state.cur, last = c.plays[c.plays.length - 1];
  state.drives.push({ team: c.team, start: c.start, end: last.td ? (c.team === 'BYU' ? 100 : 0) : scrimEnd(last),
                      result: result, q: 4, score: result === 'TD' || result === 'FG' ? scoreText() : '', plays: c.plays });
  state.over = true; state.overText = text;
}
function kickoffTo(team){ return team === 'BYU' ? 25 : 75; }

function runPlay(e){
  var g = state.game, team = g.poss, opp = other(team), dir = TEAMS[team].dir, from = g.spot;
  var s = state.stats[team], P = state.players[team], Dp = state.players[opp];
  var p = { t: e.t, from: from, to: from, yds: e.yds || 0, text: e.text }, keys = [];
  var downBefore = g.down;
  g.clock = e.clock;

  if(e.t === 'rush' || e.t === 'pass' || e.t === 'sack' || e.t === 'pen' || e.t === 'punt'){
    p.to = Math.max(0, Math.min(100, from + dir * e.yds));
  }
  if(e.t === 'inc') p.air = e.air;
  if(e.t === 'int'){ p.air = e.air; p.caught = from + dir * e.air; p.to = p.caught - dir * e.ret; }
  if(e.t === 'fg'){ p.dist = toGoal(team, from) + 17; p.good = true; }
  p.td = (e.t === 'rush' || e.t === 'pass') && toGoal(team, p.to) === 0;
  var gained = dir * (p.to - from);

  // team stats and the box score (college football counts sacks as rushing)
  if(e.t === 'rush' || e.t === 'sack'){
    s.yds += gained; s.plays += 1; s.rush += gained; s.car += 1; keys.push('yds', 'rush');
    if(e.r){ var ru = byName(P.rush, e.r); ru.car += 1; ru.y += gained; if(p.td) ru.td += 1; }
    if(e.sk){ var sk = byName(Dp.def, e.sk); sk.sk += 1; sk.tfl += 1; sk.tkl += 1; }
  }
  if(e.t === 'pass'){
    s.yds += gained; s.plays += 1; s.pass += gained; s.comp += 1; s.att += 1; keys.push('yds', 'pass');
    var qb = byName(P.pass, e.p); qb.c += 1; qb.a += 1; qb.y += gained; if(p.td) qb.td += 1;
    var rc = byName(P.rec, e.c); rc.r += 1; rc.y += gained; if(p.td) rc.td += 1;
  }
  if(e.t === 'inc'){ s.plays += 1; s.att += 1; byName(P.pass, e.p).a += 1; keys.push('pass'); }
  if(e.t === 'int'){
    s.plays += 1; s.att += 1; s.to += 1; keys.push('pass', 'to');
    var q2 = byName(P.pass, e.p); q2.a += 1; q2.int += 1;
    byName(Dp.def, e.pick).int += 1;
  }
  if(e.t === 'pen'){ s.pen[0] += 1; s.pen[1] += -e.yds; keys.push('pen'); }
  if(e.tk){ var tk = byName(Dp.def, e.tk); if(tk) tk.tkl += 1; }
  if(e.t === 'fg'){ var k = P.kick[0]; k.fga += 1; k.fgm += 1; k.lng = Math.max(k.lng, p.dist); }

  state.cur.plays.push(p);
  state.banner = null;
  state.flash = { team: team, keys: keys.join(' ') };

  if(p.td){
    g.score[team] += 7; g.line[team][3] += 7;
    P.kick[0].xpa += 1; P.kick[0].xpm += 1;
    g.spot = p.to; g.down = 1; g.toGo = 0;
    endDrive('TD', 'Touchdown, ' + TEAMS[team].full);
    return 'td';
  }
  if(e.t === 'punt'){ g.spot = p.to; endDrive('Punt', TEAMS[team].full + ' punts'); state.next = { team: opp, at: p.to }; return 'end'; }
  if(e.t === 'int'){ g.spot = p.to; endDrive('INT', 'Intercepted! ' + TEAMS[opp].full + ' ball'); state.next = { team: opp, at: p.to }; return 'end'; }
  if(e.t === 'fg'){
    g.score[team] += 3; g.line[team][3] += 3;
    endDrive('FG', p.dist + '-yard field goal is good');
    return 'fg';
  }

  // downs: a flag replays the down; a gain past the sticks is a first down
  var need = g.toGo;
  if(e.t === 'pen'){ g.toGo -= gained; if(g.toGo <= 0){ g.down = 1; g.toGo = 10; } }
  else if(gained >= need){ g.down = 1; g.toGo = 10; s.fd += 1; keys.push('fd'); }
  else { g.down += 1; g.toGo = need - gained; }
  if(downBefore === 3 && e.t !== 'pen'){ s.d3[1] += 1; if(g.down === 1) s.d3[0] += 1; keys.push('d3'); }
  g.spot = p.to;
  g.toGo = Math.min(g.toGo, toGoal(team, g.spot));
  p.dd = { down: g.down, toGo: g.toGo };
  state.flash = { team: team, keys: keys.join(' ') };
  return 'ok';
}

function busy(){ return drivesOpen || !!state.replay || state.hold; }
function later(ms){ clearTimeout(stepTimer); stepTimer = setTimeout(step, ms); }

function step(){
  if(busy()){ later(600); return; }
  if(state.next){ newDrive(state.next.team, state.next.at); state.next = null; render(); later(2600); return; }
  var e = SCRIPT[state.step];
  if(!e){ restart(); return; }
  state.step += 1;

  if(e.ev === 'timeout'){
    state.game.tos[e.team] -= 1; state.game.clock = e.clock;
    state.banner = { a: 'TIMEOUT · ' + TEAMS[e.team].full.toUpperCase(), b: state.game.tos[e.team] + ' left this half' };
    render(); later(4200); return;
  }

  var r = runPlay(e);
  firstPage();
  render();
  if(r === 'td'){
    state.hold = true;
    var drive = state.drives[state.drives.length - 1], scorer = state.game.poss;
    $('td').className = 'abs np on';
    setTimeout(function(){ $('td').className = 'abs np'; }, 3200);
    setTimeout(function(){
      var go = function(){
        if(drivesOpen || state.replay){ setTimeout(go, 600); return; }
        startReplay(drive, TEAMS[scorer].full + ' touchdown drive', function(){
          state.hold = false; state.next = { team: other(scorer), at: kickoffTo(other(scorer)) };
        });
      };
      go();
    }, REPLAY_AFTER_TD);
    later(600);
    return;
  }
  later(r === 'fg' ? 9000 : r === 'end' ? 3800 : 3400);
}

function restart(){
  clearTimeout(state.replayTimer);
  state = fresh(); snapBall(); render(); later(2500);
}

// Start only once the background picture has fully arrived, so the screen
// never shows it half-loaded; give up waiting after 20 s and start anyway.
var started = false;
function start(){
  if(started) return;
  started = true;
  state = fresh();
  firstPage();
  render();
  // Place the ball without sliding it in from the corner, then let later moves animate.
  snapBall();
  $('stage').className = 'ready';
  later(2500);
}
var bg = new Image();
bg.onload = start; bg.onerror = start;
bg.src = 'lights.jpg';
setTimeout(start, 20000);
</script>
