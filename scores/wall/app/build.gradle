// The whole app is one screen: a full-screen web view showing the wall board.
plugins { id 'com.android.application' version '8.5.2' }

android {
    namespace 'io.github.thillships.wall'
    compileSdk 34
    defaultConfig {
        applicationId 'io.github.thillships.wall'
        minSdk 26          // the kitchen calendar runs Android 10 (29)
        targetSdk 34
        versionCode 5
        versionName '1.4'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
