<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Gameday Wall</title>
<meta name="theme-color" content="#07101F" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2032%2032'%3E%20%3Crect%20width='32'%20height='32'%20rx='7'%20fill='%23111'/%3E%20%3Crect%20x='5.5'%20y='7'%20width='9.5'%20height='7'%20rx='1.8'%20fill='%23F5F2ED'/%3E%20%3Crect%20x='17'%20y='7'%20width='9.5'%20height='7'%20rx='1.8'%20fill='%23FF9B2F'/%3E%20%3Crect%20x='5.5'%20y='18'%20width='9.5'%20height='7'%20rx='1.8'%20fill='%235C5F69'/%3E%20%3Crect%20x='17'%20y='18'%20width='9.5'%20height='7'%20rx='1.8'%20fill='%23F5F2ED'/%3E%3C/svg%3E" />
<style>
  /* ---------------------------------------------------------------------------
     Built for the Dragon Touch calendar: 1920x1080 landscape, Chromium 74.
     Everything is sized in vh so it fills the screen whatever height the
     browser's URL bar leaves us. No flex `gap`, clamp(), min()/max(),
     aspect-ratio or :is() — none of them exist in Chromium 74.
     --------------------------------------------------------------------------- */
  :root{
    --bg:#07101F; --tile:#0E1A33; --tile2:#14223F; --line:#22304D;
    --ink:#FFFFFF; --dim:rgba(255,255,255,0.62); --faint:rgba(255,255,255,0.42);
    --hot:#5FA8FF; --byu:#5FA8FF; --royal:#0062B8; --b12:#2F6E4F; --ball:#C9884E; --red:#FF5A4F;
    --num:'Barlow Condensed','Roboto Condensed','Arial Narrow',sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--ink);}
  body{background:linear-gradient(180deg,#05080F 0%,#08122A 55%,#0A1630 100%);}
  body{
    font-family:Barlow,Roboto,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;font-weight:500;
    font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;
    display:flex;flex-direction:column;padding:2.2vh 1.6vw 2vh;
    cursor:none;user-select:none;-webkit-user-select:none;
  }

  /* ---- header ---- */
  .hd{flex:none;display:flex;align-items:center;height:7vh;margin-bottom:2vh;}
  .hd .ttl{font-size:4.2vh;font-weight:900;letter-spacing:-.02em;}
  .hd .wk{font-size:2.4vh;font-weight:700;color:var(--dim);margin-left:1.6vw;letter-spacing:.02em;}
  .hd .live{display:flex;align-items:center;margin-left:1.6vw;font-size:2.4vh;font-weight:800;color:var(--hot);}
  .hd .live .dot{width:1.3vh;height:1.3vh;border-radius:50%;background:var(--hot);margin-right:.7vw;
    animation:pulse 2s ease-in-out infinite;}
  .hd .live.off{color:var(--faint);}
  .hd .live.off .dot{background:var(--faint);animation:none;}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
  .hd .rt{margin-left:auto;display:flex;align-items:baseline;}
  .hd .stamp{font-size:1.9vh;font-weight:600;color:var(--faint);margin-right:1.8vw;}
  .hd .stamp.bad{color:var(--hot);}
  .hd .watch{font:inherit;font-size:2.2vh;font-weight:800;color:var(--dim);background:var(--tile);
    border:1px solid var(--line);border-radius:3vh;padding:1vh 1.4vw;margin-right:1.8vw;cursor:pointer;}
  .hd .watch.on{color:var(--bg);background:var(--byu);border-color:var(--byu);}
  .hd .date{font-size:2.6vh;font-weight:700;color:var(--dim);margin-right:1.2vw;}
  .hd .clock{font-size:5vh;font-weight:800;letter-spacing:-.03em;}

  /* ---- the four big cards ---- */
  .hero{flex:none;display:grid;grid-template-columns:repeat(4,1fr);grid-gap:1.2vw;height:32vh;margin-bottom:2.4vh;}
  .card{background:var(--tile);border-radius:1.4vh;padding:2vh 1.3vw 1.8vh;border-left:.6vh solid var(--line);
    display:flex;flex-direction:column;justify-content:space-between;min-width:0;}
  .card.byu{border-left-color:var(--byu);}
  .card.close{border-left-color:var(--hot);background:var(--tile2);}
  .card.pre{background:#111216;}
  .card .tm{display:flex;align-items:center;height:8.2vh;}
  .card .lg{flex:none;width:5.8vh;height:5.8vh;margin-right:.8vw;object-fit:contain;}
  .card .lg.none{visibility:hidden;}
  .card .nm{flex:1;min-width:0;font-size:3.05vh;font-weight:800;letter-spacing:-.015em;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .card .sc{flex:none;font-size:6.3vh;font-weight:900;letter-spacing:-.04em;margin-left:.8vw;line-height:1;}
  .card .lo .nm,.card .lo .sc{color:var(--dim);}
  .card .lo .lg{opacity:.55;}
  .card .sit{height:3.2vh;display:flex;align-items:center;font-size:2.3vh;font-weight:700;color:var(--dim);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .card .sit.rz{color:var(--red);}
  .card .ft{display:flex;align-items:baseline;border-top:1px solid var(--line);padding-top:1.3vh;}
  .card .ck{font-size:2.7vh;font-weight:800;color:var(--hot);letter-spacing:.01em;white-space:nowrap;}
  .card.pre .ck,.card.post .ck{color:var(--dim);}
  .card .soon{font-size:2.1vh;font-weight:700;color:var(--hot);margin-left:.9vw;white-space:nowrap;}
  .card .tv{margin-left:auto;padding-left:.8vw;font-size:2.2vh;font-weight:700;color:var(--dim);letter-spacing:.03em;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .ball{display:inline-block;width:1.05em;height:.62em;margin-left:.35em;vertical-align:.06em;color:var(--ball);flex:none;}
  .ball.rz{color:var(--red);}
  .rk{font-size:.62em;font-weight:800;color:var(--hot);margin-right:.25em;vertical-align:.45em;letter-spacing:0;}

  /* ---- the default: sixteen cards, four by four (?layout=list for the old cards + list) ---- */
  .grid{display:none;}
  body.grid16 .hero,body.grid16 .main{display:none !important;}
  body.grid16 .grid{flex:1;min-height:0;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(4,1fr);
    grid-gap:1.5vh 1vw;}
  .gc{position:relative;background:var(--tile);border-radius:1.6vh;padding:1vh 1vw 0;display:flex;flex-direction:column;min-width:0;min-height:0;}
  .gc.post{background:#0B152B;}
  .gc.empty{background:transparent;}
  .gnote{grid-column:span 4;display:flex;align-items:center;justify-content:center;background:rgba(14,26,51,0.35);
    border-radius:1.6vh;font-size:3vh;color:var(--faint);}
  .gc.byu{box-shadow:inset 0 0 0 .35vh var(--royal);}
  .gc .gl{flex:1;min-height:0;display:flex;align-items:center;}
  .gc .lw{position:relative;flex:none;width:9vh;height:9vh;}
  .gc .lw img{width:9vh;height:9vh;object-fit:contain;display:block;}
  .gc .lw .ab{display:flex;align-items:center;justify-content:center;width:9vh;height:9vh;border-radius:50%;
    background:var(--tile2);font-weight:700;font-size:2.6vh;letter-spacing:.02em;}
  .gc .rkb{position:absolute;left:-.9vh;top:-.6vh;font-family:var(--num);font-weight:700;font-size:2.7vh;line-height:3.2vh;
    padding:0 .9vh;border-radius:1.8vh;background:#05080F;color:#FFFFFF;border:.28vh solid rgba(255,255,255,0.85);}
  .gc .bl{position:absolute;right:-.5vh;bottom:.2vh;width:2.7vh;height:1.8vh;border-radius:50%;background:#A8622F;border:.28vh solid #FFFFFF;}
  .gc .s{flex:1;text-align:center;font-family:var(--num);font-weight:600;font-size:7.6vh;line-height:1;}
  .gc .s.lo{color:var(--dim);}
  .gc .s.when{font-size:4.6vh;color:var(--ink);}
  .gc .vs{flex:none;width:1.4vw;text-align:center;font-size:3vh;color:var(--faint);}
  .gc .gf{flex:none;display:flex;align-items:center;height:5.6vh;border-top:1px solid var(--line);font-size:3.1vh;}
  .gc .ck{font-family:var(--num);font-weight:600;font-size:3.9vh;color:var(--hot);white-space:nowrap;}
  .gc.post .ck{color:var(--dim);}
  .gc .st{flex:1;min-width:0;margin-left:.8vw;color:rgba(255,255,255,0.82);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .gc .st.rz{color:#FF8A80;}
  /* the network sits at the top of the card, so the down and spot get the whole footer */
  .gc .tv{position:absolute;left:0;right:0;top:.6vh;text-align:center;font-size:2.4vh;font-weight:600;letter-spacing:.05vh;color:var(--dim);white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis;}

  /* ---- everything else, one line each, filled column by column ---- */
  .main{flex:1;min-height:0;display:flex;}
  .list{flex:1;min-width:0;min-height:0;display:grid;grid-template-columns:repeat(3,1fr);grid-auto-flow:column;
    grid-column-gap:1.2vw;grid-row-gap:.7vh;align-content:start;}
  .g{display:flex;align-items:center;height:5.4vh;background:var(--tile);border-radius:.9vh;
    padding:0 .9vw;font-size:2.75vh;border-left:.45vh solid transparent;min-width:0;}
  .g.byu{border-left-color:var(--byu);}
  .g.b12{border-left-color:var(--b12);}
  .g.close{background:var(--tile2);border-left-color:var(--hot);}
  .g .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700;}
  .g .at{color:var(--faint);font-weight:600;margin:0 .3em;}
  .g .l{color:var(--dim);}
  .g .n{flex:none;font-weight:900;margin-left:.6vw;letter-spacing:-.02em;}
  .g .n .d{color:var(--faint);margin:0 .2em;}
  .g .tv{flex:none;width:4.8vw;margin-left:.6vw;text-align:right;font-size:2vh;font-weight:700;color:var(--faint);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;letter-spacing:.03em;}
  .g .c{flex:none;min-width:6.6vw;margin-left:.5vw;text-align:right;font-size:2.4vh;font-weight:800;color:var(--hot);white-space:nowrap;}
  .g .c.pre,.g .c.post{color:var(--dim);font-weight:700;}
  .sec{display:flex;align-items:flex-end;height:5.4vh;padding:0 .3vw .7vh;font-size:2vh;font-weight:800;
    letter-spacing:.16em;text-transform:uppercase;color:var(--faint);}
  .more{display:flex;align-items:center;height:5.4vh;padding:0 1vw;font-size:2.3vh;font-weight:700;color:var(--faint);}

  /* ---- BYU box score: the left of the screen while BYU plays ---- */
  .box{flex:none;width:63%;margin-right:1.6vw;display:flex;flex-direction:column;min-width:0;}
  body.byumode .list{grid-template-columns:1fr;}
  body.solo .box{width:100%;margin-right:0;}
  body.solo .list{display:none !important;}
  /* basketball box score */
  .pl{display:flex;align-items:center;height:4.3vh;font-size:2.4vh;font-weight:700;border-bottom:1px solid var(--line);}
  .pl:last-child{border-bottom:0;}
  .pl.hd{height:3.6vh;font-size:1.7vh;font-weight:800;letter-spacing:.1em;color:var(--faint);}
  .pl .who{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .pl .who .s{color:var(--faint);font-size:.75em;margin-left:.4em;}
  .pl .n{flex:none;width:4.4vw;text-align:right;color:var(--dim);}
  .pl .n.pts{color:var(--ink);font-weight:900;}
  body.solo .pl .n{width:5.4vw;}
  .opp{margin-top:1.4vh;}
  .st .v.w{width:10.5vw;white-space:nowrap;}
  .st .v em{font-style:normal;font-size:.68em;font-weight:700;color:var(--dim);margin-left:.35em;}
  .bx-sb{flex:none;display:flex;align-items:center;background:var(--tile);border-radius:1.4vh;
    border-left:.6vh solid var(--byu);padding:1.8vh 1.6vw;height:17vh;}
  .bx-tm{flex:1;display:flex;align-items:center;min-width:0;}
  .bx-tm.hm{flex-direction:row-reverse;text-align:right;}
  .bx-tm .lg{flex:none;width:9vh;height:9vh;object-fit:contain;}
  .bx-tm .lg.none{visibility:hidden;}
  .bx-tm .nm{font-size:3.4vh;font-weight:800;margin:0 1.2vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .bx-tm .sc{font-size:9vh;font-weight:900;letter-spacing:-.04em;line-height:1;}
  .bx-tm.lo .nm,.bx-tm.lo .sc{color:var(--dim);}
  .bx-tm.lo .lg{opacity:.55;}
  .bx-mid{flex:none;width:23%;text-align:center;}
  .bx-mid .ck{font-size:3.4vh;font-weight:800;color:var(--hot);}
  .bx-mid.post .ck{color:var(--dim);}
  .bx-mid .dn{font-size:2.1vh;font-weight:700;color:var(--dim);margin-top:.6vh;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .bx-mid .dn.rz{color:var(--red);}
  .bx-mid .tv{font-size:1.9vh;font-weight:700;color:var(--faint);margin-top:.5vh;letter-spacing:.04em;}
  .bx-body{flex:1;min-height:0;display:flex;margin-top:1.6vh;}
  .bx-col{flex:1;min-width:0;background:var(--tile);border-radius:1.4vh;padding:1.4vh 1.2vw;}
  .bx-col + .bx-col{margin-left:1.2vw;}
  .bx-h{display:flex;align-items:center;font-size:1.8vh;font-weight:800;letter-spacing:.16em;text-transform:uppercase;
    color:var(--faint);padding-bottom:1vh;border-bottom:1px solid var(--line);margin-bottom:.4vh;}
  .bx-h .ab{margin-left:auto;letter-spacing:.04em;}
  .bx-h .ab + .ab{margin-left:1.6vw;}
  .st{display:flex;align-items:center;height:6.4vh;font-size:3vh;font-weight:800;}
  .st .lb{flex:1;min-width:0;font-size:2.4vh;font-weight:700;color:var(--dim);white-space:nowrap;}
  .st .v{flex:none;width:7vw;text-align:right;}
  .st .v.lo{color:var(--dim);}
  .st .bar{display:flex;height:.6vh;border-radius:.3vh;margin-top:.6vh;margin-right:1.2vw;overflow:hidden;}
  .st .bar i{display:block;height:100%;background:var(--faint);}
  .st .bar i.byu{background:var(--byu);}
  .st .bar i + i{margin-left:2px;}
  .ld{padding:1.1vh 0;border-bottom:1px solid var(--line);}
  .ld:last-child{border-bottom:0;}
  .ld .cat{font-size:1.7vh;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);}
  .ld .p{display:flex;align-items:baseline;font-size:2.6vh;font-weight:800;margin-top:.5vh;white-space:nowrap;}
  .ld .p .t{flex:none;width:3.6vw;font-size:1.7vh;color:var(--faint);letter-spacing:.04em;}
  .ld .p .who{flex:none;max-width:42%;overflow:hidden;text-overflow:ellipsis;}
  .ld .p .ln{flex:1;min-width:0;margin-left:.8vw;font-size:2.3vh;font-weight:700;color:var(--dim);
    overflow:hidden;text-overflow:ellipsis;text-align:right;}
  .bx-none{color:var(--faint);font-size:2.2vh;font-weight:700;padding-top:2vh;}

  /* ---- score alerts: the bottom half of the screen, in the scoring team's colours ---- */
  .al{position:fixed;left:0;right:0;bottom:0;height:50vh;z-index:10;overflow:hidden;
    transform:translateY(105%);transition:transform .65s cubic-bezier(.2,.9,.25,1);
    box-shadow:0 -2vh 6vh rgba(0,0,0,.6);}
  .al.show{transform:translateY(0);}
  .al .bar{position:absolute;left:0;right:0;top:0;height:1.1vh;}
  .al .shine{position:absolute;top:0;bottom:0;left:0;width:28%;
    background:linear-gradient(100deg,rgba(255,255,255,0),rgba(255,255,255,.16),rgba(255,255,255,0));
    animation:sweep 1.5s .5s ease-out both;}
  @keyframes sweep{from{transform:translateX(-120%)}to{transform:translateX(480%)}}
  .al .in{position:absolute;top:0;left:0;right:0;bottom:0;display:flex;align-items:center;padding:3vh 4vw 2vh;}
  .al .lg{flex:none;width:30vh;height:30vh;object-fit:contain;margin-right:3.5vw;
    animation:drop .7s .25s cubic-bezier(.2,1.4,.4,1) both;}
  .al .lg.none{display:none;}
  @keyframes drop{from{transform:scale(.4) rotate(-12deg);opacity:0}to{transform:none;opacity:1}}
  .al .txt{flex:1;min-width:0;}
  .al .kick{font-size:3.2vh;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:rgba(255,255,255,.82);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;animation:rise .5s .35s both;}
  .al .word{font-size:14vh;line-height:1.02;font-weight:900;font-style:italic;letter-spacing:-.025em;color:#fff;
    white-space:nowrap;animation:punch .65s .45s cubic-bezier(.2,1.3,.4,1) both;}
  @keyframes punch{from{transform:scale(.55) translateX(-6%);opacity:0}to{transform:none;opacity:1}}
  .al .line{display:flex;align-items:center;font-size:5.2vh;font-weight:800;color:#fff;margin-top:.6vh;
    white-space:nowrap;animation:rise .5s .7s both;}
  .al .line .s{font-weight:900;margin:0 .4em;}
  .al .line .l{color:rgba(255,255,255,.6);}
  .al .line .ck{font-size:3vh;font-weight:800;margin-left:1.4vw;padding:.4vh .8vw;border-radius:.8vh;
    background:rgba(0,0,0,.28);color:rgba(255,255,255,.9);}
  .al .play{font-size:2.6vh;font-weight:600;color:rgba(255,255,255,.72);margin-top:1.2vh;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;animation:rise .5s .9s both;}
  @keyframes rise{from{transform:translateY(2vh);opacity:0}to{transform:none;opacity:1}}

  .msg{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
    color:var(--dim);font-size:2.6vh;line-height:1.6;}
  .msg b{color:var(--ink);font-size:4vh;margin-bottom:1vh;}
</style>
</head>
<body>
  <div class="hd">
    <span class="ttl">Gameday</span>
    <span class="wk" id="wk"></span>
    <span class="live off" id="live"><span class="dot"></span><span id="liveN"></span></span>
    <span class="rt">
      <button class="watch" id="watch" style="display:none" onclick="goLive('')"></button>
      <span class="stamp" id="stamp"></span>
      <span class="date" id="date"></span>
      <span class="clock" id="clock"></span>
    </span>
  </div>
  <div class="hero" id="hero" style="display:none"></div>
  <div class="grid" id="grid"></div>
  <div class="main">
    <div class="box" id="box" style="display:none"></div>
    <div class="list" id="list" style="display:none"></div>
  </div>
  <div class="msg" id="msg"><b>Loading the slate…</b></div>
  <div class="al" id="alert"></div>

<script>
/* ===========================================================================
   The gameday board, rebuilt for a screen on the wall. ESPN straight from
   the browser; nobody touches it, so it decides on its own what goes up top,
   fills the rest of the screen, and calls out the scores that matter.

   Runs on Chromium 74, so: no ?. or ??, nothing newer than ES2018.

   Add ?test to the address to play a sample run of the score alerts, or
   ?boxdemo to see the BYU box-score layout with made-up numbers, or
   ?hoopsdemo for the BYU basketball view.
   =========================================================================== */

// groups=80 is all of FBS, so one request covers every game on the board.
const URL = 'https://site.api.espn.com/apis/site/v2/sports/football/' +
            'college-football/scoreboard?groups=80&limit=300';

/* ------------------------- which games count -------------------------
   Two tiers. The games that matter: any with a ranked team, any with a
   Big 12 team (BYU's league), and Michigan's and Notre Dame's. Results and
   what's coming up show only those. Live, the rest of Power Four (Notre
   Dame counts) and ranked teams against FBS opponents also count, but only
   fill the screen after every game that matters.
   ESPN tags every FBS team with its conference (the Big 12 is 4); the
   abbreviation lists are the fallback when it doesn't. The Pac-12 is not
   Power Four; FCS teams get some other conference number or none.        */
const P4_CONF  = new Set(['1', '4', '5', '8']);          // ACC, Big 12, Big Ten, SEC
const FBS_CONF = new Set(['1', '4', '5', '8', '9', '12', '15', '17', '18', '37', '151']);
// Fallback for a team ESPN sends without a conference (2026 membership).
const P4_ABBR = new Set([
  'ALA','ARK','AUB','FLA','UGA','UK','LSU','MISS','MSST','MIZ','OU','SC','TENN','TEX','TA&M','TAMU','VAN',
  'ILL','IND','IOWA','MD','MICH','MSU','MINN','NEB','NU','OSU','ORE','PSU','PUR','RUTG','UCLA','USC','WASH','WIS',
  'ARIZ','ASU','BAY','BYU','CIN','COLO','HOU','ISU','KU','KSU','OKST','TCU','TTU','UCF','UTAH','WVU',
  'BC','CAL','CLEM','DUKE','FSU','GT','LOU','MIA','UNC','NCST','PITT','SMU','STAN','SYR','UVA','VT','WAKE',
  'ND']);
const BIG12 = new Set(['ARIZ','ASU','BAY','BYU','CIN','COLO','HOU','ISU','KU',
                       'KSU','OKST','TCU','TTU','UCF','UTAH','WVU']);
const FAVORITES = new Set(['MICH', 'ND']);

const isP4  = t => t.conf ? (P4_CONF.has(t.conf) || t.abbr === 'ND') : P4_ABBR.has(t.abbr);
const isFBS = t => t.conf ? FBS_CONF.has(t.conf) : P4_ABBR.has(t.abbr);
const isB12 = t => t.conf ? t.conf === '4' : BIG12.has(t.abbr);
// Fetched and kept: everything that could be worth showing live.
const counts = g => isP4(g.home) || isP4(g.away) ||
                    (isFBS(g.home) && isFBS(g.away) && (!!g.home.rank || !!g.away.rank));
// The games that matter.
const matters = g => !!g.home.rank || !!g.away.rank || isB12(g.home) || isB12(g.away) ||
                     FAVORITES.has(g.home.abbr) || FAVORITES.has(g.away.abbr);

const HERO = 4;
const BOOT = Date.now();
const QS = location.search;

let games = [], week = '', timer = null, lastOk = 0, failures = 0;
let before = null;            // each game's score and state at the previous good fetch

/* --------------------------- watching BYU ---------------------------
   A button in the header turns the board into a companion for the BYU
   game on TV: BYU's box score takes the left of the screen and every
   other game moves to a column on the right. Off again, the normal board
   comes back. It survives a reload, and switches itself off an hour
   after the final (or after six hours, whichever comes first).         */
const WATCH_KEY = 'gamedayWall.watchingByu';
const WATCH_FOR = 6 * 3600000;
let watchingSince = 0;
try{ watchingSince = Number(localStorage.getItem(WATCH_KEY)) || 0; }catch(e){}
// The in-page BYU box score is retired (field/live.html took over); it only shows for ?boxdemo.
const watching = () => !!watchingSince && Date.now() - watchingSince < WATCH_FOR && /boxdemo/.test(location.search);


// Around a BYU game: from ten minutes before kickoff until an hour after
// the final. ESPN doesn't say when a game ended, so it is the first time
// this page saw it final, or, if it was already over when the page
// loaded, about three and a half hours after kickoff.
const finalSeen = {};
function byuNear(g){
  if(!g || g.off) return false;
  const now = Date.now();
  if(g.state === 'in') return true;
  if(g.state === 'pre') return !!g.kickoff && g.kickoff - now < 10 * 60000;
  if(g.state !== 'post') return false;
  const ended = finalSeen[g.id] || (g.kickoff ? g.kickoff.getTime() + 3.5 * 3600000 : 0);
  return now - ended < 3600000;
}

// The button only appears around a BYU game. Once that window closes the
// BYU view switches itself off.
function watchButton(){
  const g = games.filter(x => x.byu)[0];
  const on = byuLive(g);
  const b = $('watch');
  b.style.display = on ? '' : 'none';
  b.className = 'watch';
  b.textContent = 'BYU game';
  if(on && !stayingHere(g) && !/[?&]stay\b/.test(QS)) goLive('');
}

/* ------------------------- BYU's game takes over -------------------------
   From kickoff until 30 minutes after the final, the screen is BYU's game:
   field/live.html, the live box score, drive tracker and replays. Its "All
   games" button comes back here and sets wall.stayAll, so the board stays
   put for the rest of that game; the "BYU game" button here goes back.
   The time the final was first seen is shared with that page.            */
const LIVE_PAGE = 'field/live.html';
function byuLive(g){
  if(!g || g.off) return false;
  if(g.state === 'in') return true;
  if(g.state !== 'post') return false;
  let seen = 0;
  try{ seen = Number(localStorage.getItem('wall.finalSeen.' + g.id)) || 0; }catch(e){ seen = 0; }
  const ended = seen || finalSeen[g.id] || (g.kickoff ? g.kickoff.getTime() + 3.5 * 3600000 : 0);
  return Date.now() - ended < 30 * 60000;
}
function stayingHere(g){
  try{ return localStorage.getItem('wall.stayAll') === g.id; }catch(e){ return false; }
}
// Any game's live screen; '' for BYU's.
function goLive(id){
  try{ localStorage.removeItem('wall.stayAll'); }catch(e){ /* private mode */ }
  location.href = LIVE_PAGE + (id ? '?event=' + encodeURIComponent(id) : '');
}

const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const num = x => x == null ? 0 : x;
const scoreText = x => x == null ? '–' : String(x);

/* --------------------------- parsing --------------------------- */
function parse(ev){
  const c = (ev.competitions || [])[0]; if(!c) return null;
  const st = c.status || ev.status || {}, ty = st.type || {};
  const side = {}; (c.competitors || []).forEach(x => { side[x.homeAway] = x; });
  const h = side.home, a = side.away; if(!h || !a) return null;

  const team = x => {
    const t = x.team || {}, cr = x.curatedRank || {};
    let rank = parseInt(cr.current, 10);
    if(!(rank >= 1 && rank <= 25)) rank = null;
    const abbr = String(t.abbreviation || '??').toUpperCase();
    return { id: String(t.id || x.id || ''), abbr,
             name: t.shortDisplayName || t.displayName || abbr,
             // cards and upcoming rows: "Georgia" fits, "Oklahoma St" becomes OKST
             short: t.shortDisplayName && t.shortDisplayName.length <= 9 ? t.shortDisplayName : abbr,
             conf: t.conferenceId == null ? '' : String(t.conferenceId),
             color: /^[0-9a-f]{6}$/i.test(t.color || '') ? t.color : '',
             alt: /^[0-9a-f]{6}$/i.test(t.alternateColor || '') ? t.alternateColor : '',
             logo: t.logo || '', rank,
             score: x.score == null || x.score === '' ? null : Number(x.score) };
  };
  const H = team(h), A = team(a);
  const state = ty.state || 'pre';                       // pre | in | post

  // TV: national broadcast names first, then the per-market list as a fallback.
  const tv = [];
  (c.broadcasts || []).forEach(b => (b.names || []).forEach(n => tv.push(n)));
  if(!tv.length) (c.geoBroadcasts || []).forEach(b => {
    const n = b.media && (b.media.shortName || b.media.callLetters);
    if(n) tv.push(n);
  });

  // ESPN reports "0" for a game that has not started. Treat that as no score,
  // or every upcoming game reads as a scoreless tie.
  if(state === 'pre'){ H.score = null; A.score = null; }

  // Live detail: who has the ball, where, and ESPN's own win probability.
  // Any of it can be missing; everything that uses it copes without.
  const sit = (state === 'in' && c.situation) || {};
  const lp = sit.lastPlay || {};
  const prob = lp.probability && typeof lp.probability.homeWinPercentage === 'number'
             ? lp.probability.homeWinPercentage : null;

  return {
    id: String(ev.id), home: H, away: A, state,
    status: ty.name || '',
    period: Number(st.period || 0),
    clock: st.displayClock || '',
    detail: ty.shortDetail || ty.detail || '',
    kickoff: ev.date && !isNaN(new Date(ev.date)) ? new Date(ev.date) : null,
    timeKnown: c.timeValid !== false,
    tv: tv.filter((n, i) => tv.indexOf(n) === i).slice(0, 2).join('/'),
    tv1: tv[0] || '',
    byu: H.abbr === 'BYU' || A.abbr === 'BYU',
    b12: BIG12.has(H.abbr) || BIG12.has(A.abbr),
    margin: (H.score != null && A.score != null) ? Math.abs(H.score - A.score) : null,
    // Postponed and canceled games come through as "post" too. They are not results.
    off: /POSTPONED|CANCELED|CANCELLED|FORFEIT/.test(ty.name || ''),
    ball: sit.possession ? String(sit.possession) : '',
    down: sit.downDistanceText || sit.shortDownDistanceText || '',
    redZone: !!sit.isRedZone,
    homeProb: prob >= 0 && prob <= 1 ? prob : null,
    playText: lp.text || '',
    playType: (lp.type && lp.type.text) || '',
    playScore: Number(lp.scoreValue || 0),
  };
}

/* --------------------- how good is this game? ---------------------
   A game is worth watching when the result is still in doubt, and doubt
   late is worth far more than doubt early: a tie with two minutes left
   beats a tie after the opening kickoff. Stakes multiply that; a blowout
   between two top-ten teams is still a blowout.                          */

// How much of regulation is gone, 0 to 1. Overtime counts as the very end.
function progress(g){
  if(g.state !== 'in') return g.state === 'post' ? 1 : 0;
  if(g.period >= 5) return 1;
  if(g.status === 'STATUS_HALFTIME') return 0.5;
  let left = clockSeconds(g.clock);
  if(left == null || g.status === 'STATUS_END_PERIOD') left = g.status === 'STATUS_END_PERIOD' ? 0 : 450;
  const done = (Math.max(1, g.period) - 1) * 900 + (900 - Math.min(900, left));
  return Math.max(0, Math.min(1, done / 3600));
}

// 1 when it is a coin flip, 0 when it is over. ESPN's win probability when
// it sends one (it knows who has the ball and where); otherwise a plain
// estimate from the margin and the time left.
function doubt(g){
  if(g.state !== 'in' || g.margin == null) return 0;
  if(g.homeProb != null) return 1 - Math.abs(2 * g.homeProb - 1);
  if(g.period >= 5) return g.margin <= 8 ? 1 : 0.5;
  const left = Math.max(30, 3600 * (1 - progress(g)));
  // How far a college score swings in the time left. Never less than about
  // one score: down seven with the ball and two minutes left is far from over.
  const spread = Math.max(7, 16 * Math.sqrt(left / 3600));
  return erfc(g.margin / (spread * Math.SQRT2));
}

function erfc(x){                                // Abramowitz & Stegun 7.1.26, plenty for this
  const t = 1 / (1 + 0.3275911 * x);
  const y = t * (0.254829592 + t * (-0.284496736 + t * (1.421413741 + t * (-1.453152027 + t * 1.061405429))));
  return Math.max(0, Math.min(1, y * Math.exp(-x * x)));
}

// Would `dog` beating `fav` be an upset? A ranked team losing to an unranked
// one, or to one ranked at least 15 places lower. #12 over #2 is just a good game.
const wouldUpset = (dog, fav) => !!fav.rank && (!dog.rank || dog.rank - fav.rank >= 15);

// The ranked team is losing, or barely ahead, to someone it should beat.
function upsetWatch(g){
  if(g.state !== 'in' || progress(g) < 0.5) return false;
  const a = g.away, h = g.home;
  const fav = wouldUpset(h, a) ? a : wouldUpset(a, h) ? h : null;
  if(!fav) return false;
  const dog = fav === a ? h : a;
  return num(dog.score) >= num(fav.score) - 3;
}

function watchability(g){
  if(g.state !== 'in') return -1000;
  const p = progress(g);
  let s = 100 * doubt(g) * (0.45 + 1.1 * p * p);

  const r1 = g.away.rank, r2 = g.home.rank;
  let stakes = 1;
  if(r1 && r2)      stakes += 0.35 + (r1 <= 10 ? 0.1 : 0) + (r2 <= 10 ? 0.1 : 0);
  else if(r1 || r2) stakes += 0.15 + ((r1 || r2) <= 10 ? 0.05 : 0);
  if(g.b12) stakes += 0.1;                        // BYU's conference race
  s *= stakes;

  // Crunch time: a one-score game in the last five minutes, or overtime.
  // Every snap can decide it, which a plain "how uncertain is it" undersells.
  const left = g.period === 4 ? clockSeconds(g.clock) : null;
  if(g.period >= 5 || (left != null && left <= 300 && g.margin <= 8)) s += 45 * stakes;

  if(upsetWatch(g)) s += 18;
  if(g.redZone && p >= 0.75 && g.margin <= 8) s += 12;
  if(g.period >= 5) s += 10;
  if(g.byu) s += 1000;                            // always on top
  return s;
}

// "7:21" -> 441. Null when ESPN gives us nothing useful.
function clockSeconds(c){
  const m = /^(\d+):(\d{2})$/.exec(String(c || '').trim());
  return m ? Number(m[1]) * 60 + Number(m[2]) : null;
}

const isClose = g => g.state === 'in' && g.margin != null &&
                     g.margin <= 8 && g.period >= 3;

// The ranked games of the day, roughly: both ranked, then one, then neither.
const stakes = g => (g.away.rank ? 1 : 0) + (g.home.rank ? 1 : 0);

const byWatch = (x, y) => watchability(y) - watchability(x);

/* --------------------------- text --------------------------- */
function timeText(d){
  return d.toLocaleTimeString([], { hour:'numeric', minute:'2-digit' })
          .replace(' ', '').toLowerCase();
}

function clockText(g){
  if(g.state === 'post') return g.off ? (g.detail || 'Off') : (/OT/.test(g.detail) ? g.detail : 'Final');
  if(g.state === 'in'){
    if(g.status === 'STATUS_HALFTIME') return 'Half';
    const q = g.period >= 5 ? (g.period === 5 ? 'OT' : (g.period - 4) + 'OT') : 'Q' + g.period;
    if(g.status === 'STATUS_END_PERIOD') return 'End ' + q;
    if(g.period >= 5) return q;                    // college OT has no clock
    return g.clock ? q + ' ' + g.clock : (g.detail || 'Live');
  }
  if(!g.kickoff) return g.detail || '';
  const sameDay = g.kickoff.toDateString() === new Date().toDateString();
  const day = sameDay ? '' : g.kickoff.toLocaleDateString([], { weekday:'short' }) + ' ';
  // "Sat 10am" rather than "Sat 10:00am": the rows have no room to spare.
  return day + (g.timeKnown ? timeText(g.kickoff).replace(':00', '') : 'TBD');
}

// "in 25m" for a kickoff inside the next hour and a half, otherwise nothing.
function soonText(g){
  if(g.state !== 'pre' || !g.kickoff || !g.timeKnown) return '';
  const mins = Math.round((g.kickoff - Date.now()) / 60000);
  if(mins > 90) return '';
  if(mins <= 0) return 'kicking off';
  return mins >= 60 ? 'in ' + Math.floor(mins / 60) + 'h ' + (mins % 60) + 'm' : 'in ' + mins + 'm';
}

/* --------------------------- pieces --------------------------- */
const rankTag = t => t.rank ? `<span class="rk">${t.rank}</span>` : '';

// Ball between plays only: at the half or a quarter break nobody "has" it.
const hasBall = (g, t) => g.state === 'in' && !!g.ball && g.ball === t.id &&
                          g.status !== 'STATUS_HALFTIME' && g.status !== 'STATUS_END_PERIOD';

function ballTag(g, t){
  if(!hasBall(g, t)) return '';
  return `<svg class="ball${g.redZone ? ' rz' : ''}" viewBox="0 0 24 14" aria-hidden="true">` +
    `<ellipse cx="12" cy="7" rx="11.5" ry="6.6" fill="currentColor"/>` +
    `<path d="M7.5 7h9M10 5v4M12 5v4M14 5v4" stroke="#0B0B0C" stroke-width="1.3" fill="none"/></svg>`;
}

// ESPN's default logos are drawn for a white background, and plenty of them
// (navy, black) vanish on this one. Most teams also have a "-dark" version;
// try that first and fall back if it is missing.
function logoTag(t){
  if(!t.logo) return '<img class="lg none" alt="">';
  const dark = t.logo.replace('/500/', '/500-dark/');
  return `<img class="lg" alt="" src="${esc(dark)}" data-plain="${esc(t.logo)}" onerror="logoFailed(this)">`;
}

// Dark logo missing: try the plain one. That missing too: leave the space empty.
// The grid's logo: ESPN's dark-background logo, then the plain one, then the
// team's letters in a circle, so a card never loses who is playing.
function gridLogo(t){
  if(!t.logo) return `<span class="ab">${esc(t.abbr)}</span>`;
  const dark = t.logo.replace('/500/', '/500-dark/');
  return `<img alt="" src="${esc(dark)}" data-plain="${esc(t.logo)}" data-abbr="${esc(t.abbr)}" onerror="gridLogoFailed(this)">`;
}
function gridLogoFailed(img){
  const plain = img.getAttribute('data-plain');
  if(plain && img.src !== plain){ img.src = plain; return; }
  img.onerror = null;
  img.outerHTML = `<span class="ab">${esc(img.getAttribute('data-abbr'))}</span>`;
}

// One game in the grid: the network along the top, logo, score, score, logo,
// and a line for the clock and the down (or how soon it kicks off).
function gridCard(g){
  const lead = num(g.home.score) - num(g.away.score), decided = g.state !== 'pre';
  const side = t => `<div class="lw">${gridLogo(t)}` + (t.rank ? `<span class="rkb">${t.rank}</span>` : '') +
                    (hasBall(g, t) ? '<span class="bl"></span>' : '') + '</div>';
  const pts = (t, lo) => `<span class="s${lo ? ' lo' : ''}">${esc(scoreText(t.score))}</span>`;
  let mid;
  if(decided && !g.off) mid = pts(g.away, lead > 0) + '<span class="vs">&ndash;</span>' + pts(g.home, lead < 0);
  else mid = `<span class="s when">${esc(g.off ? (g.detail || 'Off') : g.kickoff && g.timeKnown ? timeText(g.kickoff) : 'TBD')}</span>`;
  const live = g.state === 'in';
  const sit = live && g.down && (hasBall(g, g.home) || hasBall(g, g.away)) ? g.down : g.state === 'pre' ? soonText(g) : '';
  const ck = g.state === 'pre' ? (g.kickoff ? dayText(g.kickoff) : '') : clockText(g);
  const tap = g.state === 'pre' ? '' : ` onclick="goLive('${g.byu ? '' : esc(g.id)}')"`;
  return `<div class="gc${g.state === 'post' ? ' post' : ''}${g.byu ? ' byu' : ''}"${tap}>` +
    `<span class="tv">${esc(g.tv1)}</span>` +
    `<div class="gl">${side(g.away)}${mid}${side(g.home)}</div>` +
    `<div class="gf"><span class="ck">${esc(ck)}</span><span class="st${live && g.redZone ? ' rz' : ''}">${esc(sit)}</span></div></div>`;
}
// "Today", "Sat" or "Oct 25" for an upcoming game's footer.
function dayText(d){
  const now = new Date(), days = Math.round((new Date(d.toDateString()) - new Date(now.toDateString())) / 864e5);
  if(days === 0) return 'Today';
  if(days > 0 && days < 7) return d.toLocaleDateString([], { weekday:'short' });
  return d.toLocaleDateString([], { month:'short', day:'numeric' });
}

function logoFailed(img){
  const plain = img.getAttribute('data-plain');
  if(plain && img.src !== plain){ img.src = plain; return; }
  img.onerror = null;
  img.className = 'lg none';
}

function card(g){
  const lead = num(g.home.score) - num(g.away.score);
  const row = (t, lo) =>
    `<div class="tm${lo ? ' lo' : ''}">${logoTag(t)}` +
      `<span class="nm">${rankTag(t)}${esc(t.short)}${ballTag(g, t)}</span>` +
      (g.state === 'pre' ? '' : `<span class="sc">${scoreText(t.score)}</span>`) + `</div>`;
  const live = g.state === 'in';
  const cls = (g.byu ? ' byu' : isClose(g) ? ' close' : '') + (live ? '' : ' ' + g.state);
  const soon = soonText(g);
  const showDown = live && g.down && (hasBall(g, g.home) || hasBall(g, g.away));
  const sit = showDown ? (g.redZone ? 'Red zone · ' : '') + g.down : '';
  const decided = live || g.state === 'post';
  return `<div class="card${cls}">` +
    row(g.away, decided && lead > 0) +
    row(g.home, decided && lead < 0) +
    `<div class="sit${g.redZone ? ' rz' : ''}">${esc(sit)}</div>` +
    `<div class="ft"><span class="ck">${esc(clockText(g))}</span>` +
    (soon ? `<span class="soon">${esc(soon)}</span>` : '') +
    (g.tv ? `<span class="tv">${esc(g.tv)}</span>` : '') + `</div></div>`;
}

function line(g){
  const lead = num(g.home.score) - num(g.away.score);
  const decided = g.state === 'in' || g.state === 'post';
  const aLo = decided && lead > 0, hLo = decided && lead < 0;
  // A row with a score has no room for names; upcoming rows do.
  const nm = (t, lo) => `<span class="${lo ? 'l' : ''}">${rankTag(t)}` +
    `${esc(g.state === 'pre' ? t.short : t.abbr)}</span>${ballTag(g, t)}`;
  const sc = (t, lo) => `<span class="${lo ? 'l' : ''}">${scoreText(t.score)}</span>`;
  const cls = (g.byu ? ' byu' : isClose(g) ? ' close' : g.b12 ? ' b12' : '');
  return `<div class="g${cls}">` +
    `<span class="t">${nm(g.away, aLo)}<span class="at">at</span>${nm(g.home, hLo)}</span>` +
    (g.state === 'pre' || g.off ? '' :
      `<span class="n">${sc(g.away, aLo)}<span class="d">–</span>${sc(g.home, hLo)}</span>`) +
    `<span class="tv">${esc(g.tv1)}</span>` +
    `<span class="c ${g.state}">${esc(clockText(g))}</span></div>`;
}

/* --------------------------- layout ---------------------------
   Top: four big cards. Live games take them first, best game first. Any
   left over go to whatever kicks off next (BYU ahead of everything), and
   once the week is played out, to the results that mattered most.

   Below: everything else, one line each — more live, then up next, then
   finals — filled column by column until the screen is full.           */
function pickHero(live, soon, done){
  const hero = live.slice(0, HERO);
  const byuSoon = soon.filter(g => g.byu);
  const next = byuSoon.concat(soon.filter(g => !g.byu));
  // Results only once nothing is left to play, or the top row would fill
  // with this morning's games while tonight's are still to come.
  const pool = next.length ? next : done.filter(g => !g.off);
  for(let i = 0; hero.length < HERO && i < pool.length; i++) hero.push(pool[i]);
  return hero;
}

// Measured once, and again only when the window changes size: measuring
// means emptying the list, which would make it flash on every redraw.
let fitRows = 0;
function rowsThatFit(){
  if(fitRows) return fitRows;
  const list = $('list');
  const probe = document.createElement('div');
  probe.className = 'g'; probe.textContent = 'x';
  list.innerHTML = ''; list.appendChild(probe);
  const rowH = probe.offsetHeight;
  const gap = parseFloat(getComputedStyle(list).rowGap || getComputedStyle(list).gridRowGap) || 0;
  list.innerHTML = ''; lastHtml.list = '';
  if(!rowH) return 8;
  fitRows = Math.max(1, Math.floor((list.clientHeight + gap) / (rowH + gap)));
  return fitRows;
}

// Only touch the screen when something on it changed. Rebuilding the cards
// every half minute for the clock's sake would reload every logo, and on
// this hardware that shows as a blink.
const lastHtml = {};
function put(id, html){
  if(lastHtml[id] === html) return;
  lastHtml[id] = html;
  $(id).innerHTML = html;
}

function render(){
  watchButton();
  const games = onBoard();
  const hv = hoopsView();
  if(!games.length && !hv){
    showMessage('<b>No games this week</b>No Power Four or ranked games on ESPN\'s scoreboard right now.');
    return;
  }
  // Live: the games that matter first, best first; the others after them.
  const live = games.filter(g => g.state === 'in')
                    .sort((x, y) => (matters(y) - matters(x)) || byWatch(x, y));
  const soon = games.filter(g => g.state === 'pre' && matters(g))
                    .sort((x, y) => (x.kickoff || 0) - (y.kickoff || 0));
  const done = games.filter(g => g.state === 'post' && matters(g))
                    .sort((x, y) => (x.off - y.off) || (y.byu - x.byu) || (stakes(y) - stakes(x)) ||
                                    (y.b12 - x.b12) || ((y.kickoff || 0) - (x.kickoff || 0)));

  // With "Watching BYU" on, BYU football's box score takes the left of the
  // screen and every other game shares one column on the right. A live BYU
  // basketball game does the same on its own; with no football on, it gets
  // the whole screen.
  const feature = byuFeature(games);
  const hoopsOn = !feature && !!hv;
  const solo = hoopsOn && !live.length;
  setMode(!!feature || hoopsOn, solo);

  const hero = feature || hoopsOn ? [] : pickHero(live, soon, done);
  const used = {}; hero.forEach(g => { used[g.id] = true; });
  if(feature) used[feature.id] = true;
  const left = arr => arr.filter(g => !used[g.id]);

  $('msg').style.display = 'none';
  // The grid, by row: the top two are live games only (the eight most worth
  // watching; an empty spot stays empty), then results, then what kicks off
  // next. Those two rows show four at a time and take turns every 8 s.
  if(GRID && !byuMode){
    const next = soon.filter(g => g.byu).concat(soon.filter(g => !g.byu));
    const empty = '<div class="gc empty"></div>';
    const fill = (list, n) => { const out = list.map(gridCard); while(out.length < n) out.push(empty); return out.join(''); };
    const page = (list, turn) => {
      const pages = Math.max(1, Math.ceil(list.length / 4)), at = turn % pages;
      return list.slice(at * 4, at * 4 + 4);
    };
    const note = (text, rows) => `<div class="gnote" style="grid-row:span ${rows}">${esc(text)}</div>`;
    const shownDone = page(done, gridTurn), shownNext = page(next, gridTurn);
    put('grid',
      (live.length ? fill(live.slice(0, 8), 8) : note('Nothing live right now', 2)) +
      (done.length ? fill(shownDone, 4) : note('No finals yet', 1)) +
      (next.length ? fill(shownNext, 4) : note('Nothing else on the schedule', 1)));
    finishHeader(live, hv);
    return;
  }
  $('hero').style.display = byuMode ? 'none' : '';
  $('box').style.display = byuMode ? '' : 'none';
  $('list').style.display = '';
  if(feature) put('box', boxPanel(feature));
  else if(hoopsOn) put('box', hoopsPanel(hv, solo));
  else put('hero', hero.map(card).join(''));
  if(solo){ finishHeader(live, hv); return; }

  // Section headers and rows share one column-major grid. Work out how many
  // rows a column holds, then lay the items in so no header is left stranded
  // at the foot of a column.
  const rows = rowsThatFit(), cols = byuMode ? 1 : 3, cap = rows * cols;
  const groups = [
    [byuMode ? 'Around the country' : 'More live', left(live)],
    ['Up next', left(soon)],
    ['Final', left(done)],
  ].filter(x => x[1].length);

  const items = [];
  let shown = 0, total = groups.reduce((n, x) => n + x[1].length, 0);
  for(let gi = 0; gi < groups.length; gi++){
    const label = groups[gi][0], list = groups[gi][1];
    if(items.length % rows === rows - 1) items.push('<div></div>');
    if(items.length >= cap - 1) break;
    items.push(`<div class="sec">${esc(label)} &middot; ${list.length}</div>`);
    for(let i = 0; i < list.length; i++){
      if(items.length >= cap) break;
      items.push(line(list[i])); shown++;
    }
  }
  if(shown < total){
    // Make room for a "+N more" in the last slot.
    while(items.length >= cap){
      const gone = items.pop();
      if(gone.indexOf('class="g') !== -1) shown--;
    }
    items.push(`<div class="more">+${total - shown} more</div>`);
  }
  $('list').style.gridTemplateRows = `repeat(${rows}, auto)`;
  put('list', items.join(''));
  finishHeader(live, hv);
}

function finishHeader(live, hv){
  const n = live.length, hoopsLive = !!hv && hv.state === 'in';
  $('live').className = 'live' + (n || hoopsLive ? '' : ' off');
  $('liveN').textContent = n ? `${n} live` : hoopsLive ? 'BYU basketball' : 'Nothing live';
  $('wk').textContent = n || !hv ? week : '';
  stamp();
}

function onBoard(){ return games; }

let byuMode = false, soloMode = false;
let gridTurn = 0;               // which four results / upcoming games are showing
// Sixteen cards unless ?layout=list asks for the old four cards and a list.
const GRID = !/[?&]layout=list\b/.test(location.search);
if(GRID) document.body.className = 'grid16';
function setMode(on, solo){
  solo = !!(on && solo);
  if(on === byuMode && solo === soloMode) return;
  byuMode = on; soloMode = solo;
  document.body.className = (on ? 'byumode' : '') + (solo ? ' solo' : '') + (GRID && !on ? ' grid16' : '');
  fitRows = 0;                   // the list's height changes with the layout
  lastHtml.list = lastHtml.hero = lastHtml.box = '';
}

/* --------------------------- BYU box score ---------------------------
   With "Watching BYU" on, the left of the screen is BYU's game: the score,
   the team stats, and who is doing what. ESPN's per-game summary has all
   of it; one extra request a minute, only while the view is on.          */
const SUMMARY = 'https://site.api.espn.com/apis/site/v2/sports/football/college-football/summary?event=';
let box = null;                  // { id, teams: {teamId: {stat: {label, value}}}, leaders: {teamId: {cat: [...]}} }

function byuFeature(list){
  if(!watching()) return null;
  const g = list.filter(x => x.byu)[0];
  return byuNear(g) ? g : null;
}

async function fetchBox(g){
  try{
    const ctl = typeof AbortController === 'function' ? new AbortController() : null;
    const kill = ctl ? setTimeout(() => ctl.abort(), 20000) : null;
    const res = await fetch(SUMMARY + encodeURIComponent(g.id), { cache:'no-store', signal: ctl ? ctl.signal : undefined });
    if(kill) clearTimeout(kill);
    if(!res.ok) throw new Error('HTTP ' + res.status);
    box = parseBox(g.id, await res.json());
  }catch(err){
    console.warn('box score fetch failed', err);   // keep the last one; the panel copes without
  }
}

function parseBox(id, d){
  const bs = (d && d.boxscore) || {};
  const teams = {}, leaders = {};
  (bs.teams || []).forEach(t => {
    const m = {};
    (t.statistics || []).forEach(x => { if(x && x.name) m[x.name] = { label: x.label || '', value: x.displayValue == null ? '' : String(x.displayValue) }; });
    teams[String((t.team || {}).id || '')] = m;
  });
  (bs.players || []).forEach(t => {
    const cats = {};
    (t.statistics || []).forEach(c => {
      if(!/^(passing|rushing|receiving)$/.test(c.name || '')) return;
      const col = keyFinder(c);
      const people = (c.athletes || []).map(a => {
        const st = a.stats || [];
        const get = k => { const i = col(k); return i < 0 ? '' : String(st[i] == null ? '' : st[i]); };
        const ath = a.athlete || {};
        return { name: ath.shortName || ath.displayName || '', yds: Number(get('YDS')) || 0, line: statLine(c.name, get) };
      }).filter(x => x.name);
      people.sort((x, y) => y.yds - x.yds);
      cats[c.name] = people;
    });
    leaders[String((t.team || {}).id || '')] = cats;
  });
  return { id, teams, leaders };
}

// ESPN labels its columns (C/ATT, YDS, TD...) and keys them too; accept either.
function keyFinder(c){
  const labels = (c.labels || []).map(x => String(x).toUpperCase());
  const keys = (c.keys || []).map(x => String(x));
  const byKey = { 'C/ATT': /completions/i, 'YDS': /yards$/i, 'TD': /touchdowns$/i, 'INT': /^interceptions$/i,
                  'CAR': /rushingAttempts/i, 'REC': /^receptions$/i };
  return k => {
    const i = labels.indexOf(k);
    if(i >= 0) return i;
    const re = byKey[k];
    return re ? keys.findIndex(x => re.test(x)) : -1;
  };
}

function statLine(cat, get){
  const td = Number(get('TD')) || 0, yds = get('YDS');
  const tdText = td ? ` · ${td} TD` : '';
  if(cat === 'passing'){
    const int = Number(get('INT')) || 0;
    return `${get('C/ATT')} · ${yds} yds${tdText}${int ? ` · ${int} INT` : ''}`;
  }
  if(cat === 'rushing') return `${get('CAR')} car · ${yds} yds${tdText}`;
  return `${get('REC')} rec · ${yds} yds${tdText}`;
}

// The rows that matter, in the order of ESPN's own game page.
const TEAM_STATS = [
  ['totalYards', 'Total yards', true],
  ['netPassingYards', 'Passing', true],
  ['rushingYards', 'Rushing', true],
  ['firstDowns', '1st downs', true],
  ['thirdDownEff', '3rd down', false],
  ['turnovers', 'Turnovers', false],
  ['totalPenaltiesYards', 'Penalties', false],
  ['possessionTime', 'Possession', false],
];

function boxPanel(g){
  const a = g.away, h = g.home;
  const lead = num(h.score) - num(a.score);
  const decided = g.state === 'in' || g.state === 'post';
  const side = (t, lo, cls) => `<div class="bx-tm ${cls}${lo ? ' lo' : ''}">${logoTag(t)}` +
    `<span class="nm">${rankTag(t)}${esc(t.short)}${ballTag(g, t)}</span>` +
    `<span class="sc">${scoreText(t.score)}</span></div>`;
  const showDown = g.state === 'in' && g.down && (hasBall(g, a) || hasBall(g, h));
  const sb = `<div class="bx-sb">${side(a, decided && lead > 0, 'aw')}` +
    `<div class="bx-mid ${g.state}"><div class="ck">${esc(clockText(g))}</div>` +
    `<div class="dn${g.redZone ? ' rz' : ''}">${esc(showDown ? (g.redZone ? 'Red zone · ' : '') + g.down : '')}</div>` +
    `<div class="tv">${esc(g.tv)}</div></div>` +
    `${side(h, decided && lead < 0, 'hm')}</div>`;

  const b = box && box.id === g.id ? box : null;
  const head = title => `<div class="bx-h">${title}<span class="ab">${esc(a.abbr)}</span><span class="ab">${esc(h.abbr)}</span></div>`;

  let stats = '';
  const ta = b && b.teams[a.id], th = b && b.teams[h.id];
  if(ta && th){
    TEAM_STATS.forEach(row => {
      const x = ta[row[0]], y = th[row[0]];
      if(!x || !y) return;
      // For the yardage rows, a bar shows how the two sides compare.
      let bar = '';
      const nx = parseFloat(x.value), ny = parseFloat(y.value);
      if(row[2] && nx + ny > 0){
        // Each side's share, BYU in blue.
        const pct = Math.round(100 * nx / (nx + ny));
        bar = `<span class="bar"><i class="${a.abbr === 'BYU' ? 'byu' : ''}" style="width:${pct}%"></i>` +
              `<i class="${h.abbr === 'BYU' ? 'byu' : ''}" style="flex:1"></i></span>`;
      }
      const better = row[0] === 'turnovers' || row[0] === 'totalPenaltiesYards' ? -1 : 1;
      const xl = row[2] && better * (nx - ny) < 0, yl = row[2] && better * (ny - nx) < 0;
      stats += `<div class="st"><span class="lb">${esc(row[1])}${bar}</span>` +
        `<span class="v${xl ? ' lo' : ''}">${esc(x.value)}</span><span class="v${yl ? ' lo' : ''}">${esc(y.value)}</span></div>`;
    });
  }
  if(!stats) stats = `<div class="bx-none">${g.state === 'in' ? 'Team stats appear once ESPN posts them.' : 'No team stats yet.'}</div>`;

  let ldr = '';
  const la = b && b.leaders[a.id], lh = b && b.leaders[h.id];
  if(la || lh){
    [['passing', 'Passing', 1], ['rushing', 'Rushing', 2], ['receiving', 'Receiving', 2]].forEach(c => {
      const people = [];
      [[a, la], [h, lh]].forEach(pair => {
        const list = (pair[1] && pair[1][c[0]]) || [];
        list.slice(0, c[2]).forEach(p => people.push({ t: pair[0], p }));
      });
      if(!people.length) return;
      ldr += `<div class="ld"><div class="cat">${c[1]}</div>` + people.map(x =>
        `<div class="p"><span class="t">${esc(x.t.abbr)}</span><span class="who">${esc(x.p.name)}</span>` +
        `<span class="ln">${esc(x.p.line)}</span></div>`).join('') + `</div>`;
    });
  }
  if(!ldr) ldr = `<div class="bx-none">Leaders appear once ESPN posts the box score.</div>`;

  return sb + `<div class="bx-body"><div class="bx-col">${head('Team stats')}${stats}</div>` +
    `<div class="bx-col"><div class="bx-h">Leaders</div>${ldr}</div></div>`;
}

function showMessage(html){
  setMode(false);
  $('box').style.display = 'none';
  $('hero').style.display = 'none';
  $('list').style.display = 'none';
  $('msg').style.display = '';
  lastHtml.hero = lastHtml.list = '';
  $('msg').innerHTML = html;
}

/* --------------------------- score alerts ---------------------------
   Compare each fetch with the one before. A score becomes an alert when it
   matters: anything BYU does, a lead change or a one-score game in the
   second half of a game worth caring about, and upsets. Not every field
   goal on the board.                                                    */
function snapshot(list){
  const m = {};
  list.forEach(g => { m[g.id] = { a: g.away.score, h: g.home.score, state: g.state }; });
  return m;
}

function scoreWord(points, playType){
  const t = String(playType || '');
  if(/touchdown/i.test(t)) return 'TOUCHDOWN';
  if(/safety/i.test(t)) return 'SAFETY';
  if(points >= 6 && points <= 8) return 'TOUCHDOWN';
  if(points === 3) return 'FIELD GOAL';
  if(points === 1 || points === 2) return null;   // the kick or conversion after a touchdown we already showed
  return 'SCORE';
}

function changes(prev, list){
  const out = [];
  list.forEach(g => {
    const p = prev[g.id]; if(!p) return;

    if(g.byu && p.state === 'pre' && g.state === 'in')
      out.push({ g, team: null, word: 'KICKOFF', kick: `${g.away.name} at ${g.home.name}`, big: false, pri: 50 });

    const da = num(g.away.score) - num(p.a), dh = num(g.home.score) - num(p.h);
    if((g.state === 'in' || g.state === 'post') && (da > 0 || dh > 0)){
      const team = da >= dh ? g.away : g.home, other = team === g.away ? g.home : g.away;
      const pts = Math.max(da, dh);
      const word = scoreWord(pts, g.playScore > 0 ? g.playType : '');
      const was = num(p.h) - num(p.a), now = num(g.home.score) - num(g.away.score);
      const leadChange = (was > 0) !== (now > 0) || (was < 0) !== (now < 0);
      const prog = progress(g);
      const matters = g.byu || !!g.away.rank || !!g.home.rank || g.b12;
      const upset = wouldUpset(team, other) && num(team.score) > num(other.score) && prog >= 0.5;
      const tense = (g.margin <= 8 && prog >= 0.5) || (leadChange && prog >= 0.5) ||
                    (g.margin <= 3 && prog >= 0.75);
      if(word && (g.byu || upset || (matters && tense))){
        const byuScored = team.abbr === 'BYU';
        out.push({ g, team, word,
          kick: upset ? 'Upset alert' : byuScored ? 'BYU' : leadChange && prog >= 0.5 ? `${team.name} takes the lead` : team.name,
          play: g.playScore > 0 ? g.playText : '',
          big: byuScored, pri: g.byu ? 100 : upset ? 80 : 60 });
      }
    }

    if(p.state === 'in' && g.state === 'post' && !g.off){
      const hw = num(g.home.score) > num(g.away.score);
      const win = hw ? g.home : g.away, lose = hw ? g.away : g.home;
      if(g.byu){
        const won = win.abbr === 'BYU';
        out.push({ g, team: won ? win : null, word: won ? 'BYU WINS' : 'FINAL',
                   kick: won ? 'Final' : `${win.name} wins`, big: won, pri: 100 });
      } else if(wouldUpset(win, lose)){
        out.push({ g, team: win, word: 'UPSET', kick: `${win.name} knocks off No. ${lose.rank} ${lose.name}`, big: false, pri: 80 });
      } else if(win.rank && lose.rank && Math.min(win.rank, lose.rank) <= 10){
        out.push({ g, team: win, word: 'FINAL', kick: `${win.name} wins`, big: false, pri: 40 });
      }
    }
  });
  return out.sort((x, y) => y.pri - x.pri);
}

const queue = [];
let showing = false;

function enqueue(list){
  list.forEach(a => queue.push(a));
  // On a wild Saturday don't fall behind: keep BYU's, drop the oldest of the rest.
  while(queue.length > 4){
    let i = -1;
    for(let j = 0; j < queue.length; j++) if(queue[j].pri < 100){ i = j; break; }
    queue.splice(i < 0 ? 0 : i, 1);
  }
  if(!showing) nextAlert();
}

// Mix a team colour toward the background, so white text always reads.
function tint(hex, k){
  const n = parseInt(hex || '2a2d36', 16);
  const mix = (v, bg) => Math.round(v * k + bg * (1 - k));
  return `rgb(${mix(n >> 16 & 255, 11)},${mix(n >> 8 & 255, 11)},${mix(n & 255, 12)})`;
}

function alertHtml(a){
  const g = a.g, t = a.team;
  const lead = num(g.home.score) - num(g.away.score);
  const side = (x, lo) => `<span class="${lo ? 'l' : ''}">${esc(x.abbr)}</span>`;
  const sc = (x, lo) => `<span class="${lo ? 'l' : ''}">${scoreText(x.score)}</span>`;
  return `<div class="shine"></div>` +
    `<div class="in">${t ? logoTag(t) : logoTag(g.byu ? (g.home.abbr === 'BYU' ? g.home : g.away) : g.home)}` +
    `<div class="txt"><div class="kick">${esc(a.kick)}</div>` +
    `<div class="word">${esc(a.word)}</div>` +
    `<div class="line">${side(g.away, lead > 0)}<span class="s">${sc(g.away, lead > 0)}` +
      `<span class="l"> – </span>${sc(g.home, lead < 0)}</span>${side(g.home, lead < 0)}` +
      `<span class="ck">${esc(clockText(g))}</span></div>` +
    (a.play ? `<div class="play">${esc(a.play)}</div>` : '') +
    `</div></div><div class="bar"></div>`;
}

function nextAlert(){
  const a = queue.shift();
  if(!a){ showing = false; return; }
  showing = true;
  const el = $('alert');
  const t = a.team || (a.g.home.abbr === 'BYU' ? a.g.home : a.g.away.abbr === 'BYU' ? a.g.away : null);
  const c = t && t.color ? t.color : '2a2d36';
  el.style.background = `linear-gradient(115deg, ${tint(c, .92)} 0%, ${tint(c, .6)} 55%, ${tint(c, .3)} 100%)`;
  el.innerHTML = alertHtml(a);
  const bar = el.querySelector('.bar');
  if(bar) bar.style.background = '#' + (t && t.alt && t.alt !== c ? t.alt : 'FFFFFF');
  void el.offsetWidth;                        // start the slide from below, every time
  el.className = 'al show';
  setTimeout(() => {
    el.className = 'al';
    setTimeout(nextAlert, 1200);
  }, a.big ? 16000 : 11000);
}

/* --------------------------- clock & freshness --------------------------- */
function stamp(){
  const now = new Date();
  $('clock').textContent = timeText(now).replace(/(am|pm)$/, '');
  $('date').textContent = now.toLocaleDateString([], { weekday:'short', month:'short', day:'numeric' });
  const hv = hoopsView();
  if(hv && soloMode){
    $('stamp').className = 'stamp';
    $('stamp').textContent = hv.at ? `Updated ${timeText(new Date(hv.at))}` : '';
    return;
  }
  if(!lastOk){ $('stamp').textContent = ''; return; }
  if(!inWindow(now) && !games.some(g => g.state === 'in')){
    // Not checking on purpose; say when it will, rather than "out of date".
    const next = new Date(Date.now() + nextWait());
    $('stamp').className = 'stamp';
    $('stamp').textContent = 'Next update ' + next.toLocaleDateString([], { weekday:'short' }) + ' ' +
                             timeText(next).replace(':00', '');
    return;
  }
  // A wall screen that quietly stops updating looks exactly like one that is
  // working. Say so when the scores are getting old.
  const age = (Date.now() - lastOk) / 60000;
  const liveNow = games.some(g => g.state === 'in');
  const stale = age > (liveNow ? 4 : 20);
  $('stamp').className = 'stamp' + (stale ? ' bad' : '');
  $('stamp').textContent = stale ? `No update since ${timeText(new Date(lastOk))}`
                                 : `Updated ${timeText(new Date(lastOk))}`;
}

/* --------------------------- polling ---------------------------
   Football happens Friday night and Saturday, so that is the only time
   the board checks: from Friday 4pm until 2am Sunday, local time. Inside
   that window, once a minute while a game is on; otherwise wait for the
   next kickoff, checking at least every 15 minutes. Outside it, nothing at
   all, apart from a kickoff the board already knows about (a game that
   runs past 2am, or one on the schedule for a weeknight).               */
const WINDOW_OPENS = { day: 5, hour: 16 };       // Friday 4pm
function inWindow(d){
  const day = d.getDay(), h = d.getHours();
  return (day === 5 && h >= WINDOW_OPENS.hour) || day === 6 || (day === 0 && h < 2);
}
function nextWindow(d){
  const t = new Date(d.getTime());
  t.setHours(WINDOW_OPENS.hour, 0, 0, 0);
  t.setDate(t.getDate() + ((WINDOW_OPENS.day - t.getDay() + 7) % 7));
  if(t <= d) t.setDate(t.getDate() + 7);
  return t;
}

async function tick(){
  let ok = false;
  try{
    // A request that hangs would stop the board for good, so give up on it.
    const ctl = typeof AbortController === 'function' ? new AbortController() : null;
    const kill = ctl ? setTimeout(() => ctl.abort(), 20000) : null;
    const res = await fetch(URL, { cache:'no-store', signal: ctl ? ctl.signal : undefined });
    if(kill) clearTimeout(kill);
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    const prevOk = lastOk;
    games = (data.events || []).map(parse).filter(Boolean).filter(counts);
    const wk = data.week && data.week.number;
    week = wk ? 'Week ' + wk : '';
    lastOk = Date.now(); failures = 0; ok = true;
    games.forEach(g => {
      if(g.state === 'post' && before && before[g.id] && before[g.id].state === 'in' && !finalSeen[g.id])
        finalSeen[g.id] = Date.now();
    });
    if(DEMO_BOX) demoBox();
    render();
    const f = byuFeature(onBoard());
    if(f && !DEMO_BOX){ await fetchBox(f); render(); }
    // Alerts only between fetches close together. After a long gap (the
    // Wi-Fi dropped, the screen was off) a pile of old scores is not news.
    if(before && Date.now() - prevOk < 5 * 60000) enqueue(changes(before, onBoard()));
    before = snapshot(games);
  }catch(err){
    failures++;
    console.warn('scoreboard fetch failed', err);
    if(!games.length)
      showMessage('<b>Can\'t reach the scoreboard</b>' +
        'Trying again in a couple of minutes. Check the calendar\'s Wi-Fi if this stays up.');
    else stamp();
  }

  // Reload the page now and then, while nothing is on, so a long-running
  // browser stays healthy and picks up changes to this page. Only right after
  // a good fetch: reloading with the network down would leave an error page
  // that never recovers.
  const liveNow = games.some(g => g.state === 'in');
  if(ok && !liveNow && inWindow(new Date()) && Date.now() - BOOT > 6 * 3600000){ location.reload(); return; }
  schedule();
}

function nextWait(){
  const now = new Date(), open = inWindow(now);
  if(games.some(g => g.state === 'in')) return failures ? Math.min(120000 * failures, 600000) : 60000;
  // The next kickoff we know of. One that should have started but hasn't
  // counts for four hours; after that it is stale data, not a late game.
  let soonest = Infinity;
  games.forEach(g => {
    if(g.state !== 'pre' || !g.kickoff || !g.timeKnown) return;
    const until = g.kickoff - now;
    if(until > -4 * 3600000) soonest = Math.min(soonest, until);
  });
  if(open){
    if(failures) return Math.min(120000 * failures, 600000);
    // A minute before the next kickoff, or 15 minutes, whichever comes first.
    return Math.max(60000, Math.min(15 * 60000, soonest - 60000));
  }
  // Off days: sleep until Friday, or a minute before a known kickoff.
  return Math.max(60000, Math.min(nextWindow(now) - now, soonest - 60000));
}

function schedule(){
  clearTimeout(timer);
  timer = setTimeout(tick, nextWait());
}

/* --------------------------- BYU basketball ---------------------------
   BYU men's basketball only. Its schedule is fetched twice a day (one small
   request). Ten minutes before tipoff the board starts checking the game
   once a minute and switches to the basketball view: the score, team stats
   and BYU's box score. An hour after the final it goes back to normal.
   Nothing on days without a game.                                       */
const HOOPS = 'https://site.api.espn.com/apis/site/v2/sports/basketball/mens-college-basketball/';
const HOOPS_TEAM = '252';                        // BYU
const HOOPS_DEMO = /[?&]hoopsdemo\b/.test(QS);
let hoopsSched = [], hoopsSchedAt = 0;          // [{ id, date }]
let hoops = null;                                // the game being shown, parsed
let hoopsTimer = null;
const hoopsEnded = {};                           // game id -> when it went final

async function getJSON(url){
  const ctl = typeof AbortController === 'function' ? new AbortController() : null;
  const kill = ctl ? setTimeout(() => ctl.abort(), 20000) : null;
  try{
    const res = await fetch(url, { cache:'no-store', signal: ctl ? ctl.signal : undefined });
    if(!res.ok) throw new Error('HTTP ' + res.status);
    return await res.json();
  } finally { if(kill) clearTimeout(kill); }
}

// When a game went final: when we saw it, or about two and a quarter hours
// after tipoff if it was already over when we first looked.
function hoopsEnd(g){
  return hoopsEnded[g.id] || (g.date ? g.date.getTime() + 2.25 * 3600000 : 0);
}

// The game worth watching right now, from the schedule: tipoff in the next
// ten minutes, under way, or finished less than an hour ago.
function hoopsDue(){
  const now = Date.now();
  for(let i = 0; i < hoopsSched.length; i++){
    const g = hoopsSched[i], since = now - g.date;
    if(since < -10 * 60000 || since > 5 * 3600000) continue;
    if(g.done && now - hoopsEnd(g) > 3600000) continue;
    return g;
  }
  return null;
}

// What the screen shows: the parsed game, while it is due.
function hoopsView(){
  if(!hoops) return null;
  if(hoops.state === 'post' && Date.now() - hoopsEnd(hoops) > 3600000) return null;
  if(hoops.state === 'pre' && hoops.date && hoops.date - Date.now() > 10 * 60000) return null;
  return hoops;
}

async function hoopsTick(){
  clearTimeout(hoopsTimer);
  if(HOOPS_DEMO) return;
  try{
    if(!hoopsSchedAt || Date.now() - hoopsSchedAt > 12 * 3600000){
      const d = await getJSON(HOOPS + 'teams/' + HOOPS_TEAM + '/schedule');
      hoopsSched = (d.events || []).map(e => {
        const c = (e.competitions || [])[0] || {};
        const ty = ((c.status || e.status || {}).type) || {};
        return { id: String(e.id), date: e.date ? new Date(e.date) : null, done: ty.state === 'post' };
      }).filter(g => g.date && !isNaN(g.date)).sort((x, y) => x.date - y.date);
      hoopsSchedAt = Date.now();
    }
    const due = hoopsDue();
    if(due){
      const was = hoops && hoops.id === due.id ? hoops.state : null;
      hoops = parseHoops(due.id, await getJSON(HOOPS + 'summary?event=' + encodeURIComponent(due.id)));
      if(hoops.state === 'post'){
        due.done = true;
        if(was === 'in' && !hoopsEnded[due.id]) hoopsEnded[due.id] = Date.now();
      }
    } else hoops = null;
  }catch(err){
    console.warn('basketball fetch failed', err);   // keep what we had; try again shortly
  }
  render();
  hoopsTimer = setTimeout(hoopsTick, hoopsWait());
}

// Once a minute around a game; otherwise until ten minutes before the next
// tipoff, and never longer than twelve hours so the schedule stays fresh.
function hoopsWait(){
  if(hoopsDue()) return 60000;
  const now = Date.now();
  let next = 12 * 3600000;
  hoopsSched.forEach(g => { const t = g.date - 10 * 60000 - now; if(t > 0) next = Math.min(next, t); });
  return Math.max(60000, next);
}

function parseHoops(id, d){
  const comp = ((d && d.header && d.header.competitions) || [])[0] || {};
  const st = comp.status || {}, ty = st.type || {};
  const side = {}; (comp.competitors || []).forEach(x => { side[x.homeAway] = x; });
  const team = x => {
    x = x || {};
    const t = x.team || {};
    const abbr = String(t.abbreviation || '??').toUpperCase();
    const name = t.shortDisplayName || t.location || t.displayName || abbr;
    let rank = parseInt(x.rank != null ? x.rank : (x.curatedRank || {}).current, 10);
    if(!(rank >= 1 && rank <= 25)) rank = null;
    const logo = (t.logos && t.logos[0] && t.logos[0].href) || t.logo || '';
    return { id: String(t.id || x.id || ''), abbr, name, short: name.length <= 9 ? name : abbr, rank,
             logo, color: '', alt: '', score: x.score == null || x.score === '' ? null : Number(x.score) };
  };
  const tv = [];
  (comp.broadcasts || []).forEach(b => {
    const n = (b.media && (b.media.shortName || b.media.name)) || (b.names && b.names[0]);
    if(n && tv.indexOf(n) < 0) tv.push(n);
  });
  const state = ty.state || 'pre';
  const g = { id, away: team(side.away), home: team(side.home), state, status: ty.name || '',
    period: Number(st.period || 0), clock: st.displayClock || '', detail: ty.shortDetail || '',
    date: comp.date ? new Date(comp.date) : null, tv: tv.slice(0, 2).join('/'), at: Date.now(), teams: {}, players: {} };
  if(state === 'pre'){ g.away.score = null; g.home.score = null; }

  const bs = (d && d.boxscore) || {};
  (bs.teams || []).forEach(t => {
    const m = {};
    (t.statistics || []).forEach(x => { if(x && x.name) m[x.name] = String(x.displayValue == null ? '' : x.displayValue); });
    g.teams[String((t.team || {}).id || '')] = m;
  });
  (bs.players || []).forEach(t => {
    const block = (t.statistics || [])[0] || {};
    const labels = (block.labels || []).map(x => String(x).toUpperCase());
    const col = k => labels.indexOf(k);
    g.players[String((t.team || {}).id || '')] = (block.athletes || []).filter(a => !a.didNotPlay).map(a => {
      const v = a.stats || [], get = k => { const i = col(k); return i < 0 || v[i] == null ? '' : String(v[i]); };
      const ath = a.athlete || {};
      return { name: ath.shortName || ath.displayName || '', starter: !!a.starter, min: get('MIN'), pts: get('PTS'),
               reb: get('REB'), ast: get('AST'), fg: get('FG'), three: get('3PT') };
    }).filter(p => p.name && (p.min === '' || p.min !== '0'));
  });
  return g;
}

function hoopsClock(g){
  if(g.state === 'post') return /OT/.test(g.detail) ? g.detail : 'Final';
  if(g.state === 'pre') return g.date ? timeText(g.date) : 'Tipoff soon';
  if(g.status === 'STATUS_HALFTIME') return 'Half';
  const p = g.period <= 2 ? (g.period === 1 ? '1st' : '2nd') : (g.period === 3 ? 'OT' : (g.period - 2) + 'OT');
  if(g.status === 'STATUS_END_PERIOD') return 'End ' + p;
  return g.clock ? p + ' ' + g.clock : (g.detail || 'Live');
}

// Team stats, in the order a basketball box score reads.
const HOOPS_STATS = [
  ['FG', 'fieldGoalsMade-fieldGoalsAttempted', 'fieldGoalPct'],
  ['3PT', 'threePointFieldGoalsMade-threePointFieldGoalsAttempted', 'threePointFieldGoalPct'],
  ['FT', 'freeThrowsMade-freeThrowsAttempted', 'freeThrowPct'],
  ['Rebounds', 'totalRebounds', null, true],
  ['Assists', 'assists', null, true],
  ['Turnovers', 'turnovers'],
  ['Steals', 'steals'],
  ['Blocks', 'blocks'],
  ['Fouls', 'fouls'],
  ['Largest lead', 'largestLead'],
];

function hoopsPanel(g, solo){
  const a = g.away, h = g.home;
  const lead = num(h.score) - num(a.score), decided = g.state !== 'pre';
  const side = (t, lo, cls) => `<div class="bx-tm ${cls}${lo ? ' lo' : ''}">${logoTag(t)}` +
    `<span class="nm">${rankTag(t)}${esc(t.short)}</span><span class="sc">${scoreText(t.score)}</span></div>`;
  const sb = `<div class="bx-sb">${side(a, decided && lead > 0, 'aw')}` +
    `<div class="bx-mid ${g.state}"><div class="ck">${esc(hoopsClock(g))}</div>` +
    `<div class="dn">${g.state === 'pre' ? 'Tipoff' : ''}</div>` +
    `<div class="tv">${esc(g.tv)}</div></div>${side(h, decided && lead < 0, 'hm')}</div>`;

  const head = title => `<div class="bx-h">${title}<span class="ab">${esc(a.abbr)}</span><span class="ab">${esc(h.abbr)}</span></div>`;
  const ta = g.teams[a.id], th = g.teams[h.id];
  let stats = '';
  if(ta && th){
    HOOPS_STATS.forEach(row => {
      let x = ta[row[1]], y = th[row[1]];
      if(x == null || y == null || x === '' || y === '') return;
      // Made-attempted, with the percentage beside it in smaller type.
      let px = '', py = '';
      if(row[2] && ta[row[2]] && th[row[2]]){
        px = ` <em>${Math.round(parseFloat(ta[row[2]]))}%</em>`;
        py = ` <em>${Math.round(parseFloat(th[row[2]]))}%</em>`;
      }
      let bar = '';
      const nx = parseFloat(x), ny = parseFloat(y);
      if(row[3] && nx + ny > 0){
        const pct = Math.round(100 * nx / (nx + ny));
        bar = `<span class="bar"><i class="${a.abbr === 'BYU' ? 'byu' : ''}" style="width:${pct}%"></i>` +
              `<i class="${h.abbr === 'BYU' ? 'byu' : ''}" style="flex:1"></i></span>`;
      }
      stats += `<div class="st"><span class="lb">${esc(row[0])}${bar}</span>` +
               `<span class="v w">${esc(x)}${px}</span><span class="v w">${esc(y)}${py}</span></div>`;
    });
  }
  if(!stats) stats = `<div class="bx-none">${g.state === 'pre' ? 'Stats start at tipoff.' : 'Team stats appear once ESPN posts them.'}</div>`;

  // BYU's box score: everyone who has played, most points first.
  const byu = a.abbr === 'BYU' ? a : h, opp = byu === a ? h : a;
  const pts = p => Number(p.pts) || 0;
  const mine = (g.players[byu.id] || []).slice().sort((x, y) => pts(y) - pts(x));
  const theirs = (g.players[opp.id] || []).slice().sort((x, y) => pts(y) - pts(x)).slice(0, 3);
  const maxRows = solo ? 10 : 8;
  let box = '';
  if(mine.length){
    box = `<div class="pl hd"><span class="who">BYU</span><span class="n">MIN</span><span class="n">PTS</span>` +
      `<span class="n">REB</span><span class="n">AST</span>` + (solo ? `<span class="n">FG</span><span class="n">3PT</span>` : '') + `</div>` +
      mine.slice(0, maxRows).map(p => `<div class="pl"><span class="who">${esc(p.name)}</span>` +
        `<span class="n">${esc(p.min)}</span><span class="n pts">${esc(p.pts)}</span><span class="n">${esc(p.reb)}</span>` +
        `<span class="n">${esc(p.ast)}</span>` + (solo ? `<span class="n">${esc(p.fg)}</span><span class="n">${esc(p.three)}</span>` : '') +
        `</div>`).join('');
  }
  if(theirs.length){
    box += `<div class="ld opp"><div class="cat">${esc(opp.name)} leaders</div>` + theirs.map(p =>
      `<div class="p"><span class="who">${esc(p.name)}</span>` +
      `<span class="ln">${esc(p.pts)} pts · ${esc(p.reb)} reb · ${esc(p.ast)} ast</span></div>`).join('') + `</div>`;
  }
  if(!box) box = `<div class="bx-none">The box score appears once ESPN posts it.</div>`;

  return sb + `<div class="bx-body"><div class="bx-col">${head('Team stats')}${stats}</div>` +
    `<div class="bx-col">${box}</div></div>`;
}
