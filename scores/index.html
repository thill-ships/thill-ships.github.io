<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Gameday Board</title>
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Board" />
<meta name="theme-color" content="#0B0B0C" />
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2032%2032'%3E%20%3Crect%20width='32'%20height='32'%20rx='7'%20fill='%23111'/%3E%20%3Crect%20x='5.5'%20y='7'%20width='9.5'%20height='7'%20rx='1.8'%20fill='%23F5F2ED'/%3E%20%3Crect%20x='17'%20y='7'%20width='9.5'%20height='7'%20rx='1.8'%20fill='%23FF9B2F'/%3E%20%3Crect%20x='5.5'%20y='18'%20width='9.5'%20height='7'%20rx='1.8'%20fill='%235C5F69'/%3E%20%3Crect%20x='17'%20y='18'%20width='9.5'%20height='7'%20rx='1.8'%20fill='%23F5F2ED'/%3E%3C/svg%3E" />
<style>
  :root{
    --bg:#0B0B0C; --tile:#15161A; --tile2:#1B1D22; --line:#25272E;
    --ink:#F3F1EC; --dim:#8A8C96; --faint:#5C5F69;
    --hot:#FF9B2F; --byu:#4D9BE6; --b12:#2F6E4F; --win:#F3F1EC;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{background:var(--bg);color:var(--ink);}
  body{
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;
    padding:calc(8px + env(safe-area-inset-top)) 8px calc(14px + env(safe-area-inset-bottom));
  }
  .bar{display:flex;align-items:center;gap:8px;padding:2px 4px 9px;}
  .ttl{font-size:13px;font-weight:800;letter-spacing:-.01em;}
  .meta{margin-left:auto;font-size:10.5px;color:var(--faint);display:flex;align-items:center;gap:7px;}
  .dot{width:6px;height:6px;border-radius:50%;background:var(--hot);}
  .dot.off{background:var(--faint);}
  button.tog{background:var(--tile);border:1px solid var(--line);color:var(--dim);
    font:inherit;font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:6px;cursor:pointer;}
  button.tog.on{background:var(--ink);color:var(--bg);border-color:var(--ink);}

  /* ---- the four you'd actually put on screen ---- */
  .top{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:9px;}
  .big{background:var(--tile);border-radius:10px;padding:8px 9px;border-left:3px solid var(--line);position:relative;}
  .big.byu{border-left-color:var(--byu);}
  .big.close{border-left-color:var(--hot);}
  .big .row{display:flex;align-items:baseline;gap:6px;}
  .big .nm{font-size:13.5px;font-weight:700;letter-spacing:-.01em;flex:1;min-width:0;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .big .sc{font-size:17px;font-weight:800;letter-spacing:-.02em;}
  .big .lo .nm,.big .lo .sc{color:var(--dim);}
  .big .ck{font-size:10.5px;color:var(--hot);font-weight:700;margin-top:4px;letter-spacing:.02em;}
  .big .ck.pre{color:var(--faint);}
  .rk{font-size:9.5px;font-weight:800;color:var(--hot);margin-right:3px;vertical-align:super;}
  .tv{font-size:9.5px;font-weight:700;color:var(--dim);letter-spacing:.03em;}
  .big .ckrow{display:flex;align-items:baseline;gap:8px;margin-top:4px;}
  .big .ckrow .ck{margin-top:0;}
  .big .ckrow .tv{margin-left:auto;}
  .g .tv{flex:none;width:58px;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

  /* ---- everything else, one line each ---- */
  .list{display:grid;grid-template-columns:1fr;gap:2px;}
  @media(min-width:620px){ .list{grid-template-columns:1fr 1fr;} .top{grid-template-columns:repeat(4,1fr);} }
  @media(min-width:1100px){ .list{grid-template-columns:repeat(3,1fr);} }
  .g{display:flex;align-items:center;gap:7px;background:var(--tile);border-radius:7px;
     padding:5px 8px;font-size:12.5px;line-height:1.25;border-left:2px solid transparent;}
  .g.byu{border-left-color:var(--byu);}
  .g.b12{border-left-color:var(--b12);}
  .g.close{background:var(--tile2);}
  .g .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600;}
  .g .t .l{color:var(--dim);}
  .g .n{font-weight:800;letter-spacing:-.02em;flex:none;}
  .g .n .l{color:var(--dim);font-weight:700;}
  .g .c{flex:none;font-size:10.5px;color:var(--hot);font-weight:700;min-width:52px;text-align:right;white-space:nowrap;}
  .g .c.pre,.g .c.done{color:var(--faint);}
  .sec{font-size:9.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;
    color:var(--faint);margin:12px 4px 6px;}
  .msg{padding:34px 18px;text-align:center;color:var(--dim);font-size:13.5px;line-height:1.6;}
  .msg b{display:block;color:var(--ink);font-size:15px;margin-bottom:6px;}
  code{background:#000;padding:1px 5px;border-radius:4px;font-size:11.5px;color:var(--dim);}
</style>
</head>
<body>
  <div class="bar">
    <span class="ttl">Gameday Board</span>
    <span class="meta">
      <button class="tog" id="togSoon" onclick="toggleSoon()">Upcoming</button>
      <button class="tog" id="togFinal" onclick="toggleFinals()">Finals</button>
      <span class="dot off" id="dot"></span><span id="stamp">starting…</span>
    </span>
  </div>
  <div id="out"><div class="msg">Loading the slate…</div></div>

<script>
/* ===========================================================================
   A board for choosing what to watch. No login, no database: it asks ESPN
   directly and ranks what is on. Score and clock only, by design.
   =========================================================================== */

// groups=80 is all of FBS, so one request covers every game on the board.
const URL = 'https://site.api.espn.com/apis/site/v2/sports/football/' +
            'college-football/scoreboard?groups=80&limit=300';

// Used only if ESPN stops telling us a team's conference.
const BIG12 = new Set(['ARIZ','ASU','BAY','BYU','CIN','COLO','HOU','ISU','KU',
                       'KSU','OKST','TCU','TTU','UCF','UTAH','WVU']);

let games = [], showFinals = false, showSoon = false, timer = null, failed = false;

const $ = id => document.getElementById(id);
const esc = s => String(s==null?'':s).replace(/[&<>"]/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* --------------------------- parsing --------------------------- */
function parse(ev){
  const c = (ev.competitions || [])[0]; if(!c) return null;
  const st = (c.status || {}), ty = st.type || {};
  const side = {}; (c.competitors || []).forEach(x => { side[x.homeAway] = x; });
  const h = side.home, a = side.away; if(!h || !a) return null;

  const team = x => {
    const t = x.team || {}, cr = x.curatedRank || {};
    let rank = parseInt(cr.current, 10);
    if(!(rank >= 1 && rank <= 25)) rank = null;
    return { abbr: t.abbreviation || '??',
             name: t.shortDisplayName || t.displayName || '??',
             conf: String(t.conferenceId || ''), rank,
             score: x.score == null || x.score === '' ? null : Number(x.score) };
  };
  const H = team(h), A = team(a);
  const state = ty.state || 'pre';                       // pre | in | post
  const period = Number(st.period || 0);
  const clock = st.displayClock || '';

  const isB12 = t => BIG12.has((t.abbr || '').toUpperCase());

  // TV: national broadcast names first, then the per-market list as a fallback.
  const tv = [];
  (c.broadcasts || []).forEach(b => (b.names || []).forEach(n => tv.push(n)));
  if(!tv.length) (c.geoBroadcasts || []).forEach(b => {
    const n = b.media && (b.media.shortName || b.media.callLetters);
    if(n) tv.push(n);
  });

  // ESPN reports "0" for a game that has not started. Treat that as no score,
  // or every upcoming game reads as a scoreless tie.
  if(state === 'pre'){ H.score = null; A.score = null; }

  return {
    tv: [...new Set(tv)].slice(0, 2).join('/'),   // cards have room for two
    tv1: tv[0] || '',                              // rows show the main channel
    id: String(ev.id), home: H, away: A, state,
    period, clock,
    detail: ty.shortDetail || ty.detail || '',
    kickoff: ev.date ? new Date(ev.date) : null,
    byu: H.abbr === 'BYU' || A.abbr === 'BYU',
    b12: isB12(H) || isB12(A),
    margin: (H.score != null && A.score != null) ? Math.abs(H.score - A.score) : null,
  };
}

/* --------------------- how good is this game? ---------------------
   Closeness matters most, and matters more the later it is. A one-score
   fourth quarter beats a one-score first quarter, and a blowout in the
   second half actively drops.                                          */
function watchability(g){
  if(g.state === 'post') return -1000;

  let s = 0;
  if(g.state === 'in'){
    s += 120;
    if(g.margin != null){
      const m = g.margin;
      const close = m <= 3 ? 46 : m <= 7 ? 34 : m <= 10 ? 24 : m <= 14 ? 14 : m <= 21 ? 6 : 0;
      let late = g.period >= 5 ? 2.1 : g.period === 4 ? 1.65
               : g.period === 3 ? 1.25 : g.period === 2 ? 1.0 : 0.8;
      // The last few minutes of a one-score game are the whole point of a board
      // like this, and treating all of the fourth quarter alike buried them.
      const left = clockSeconds(g.clock);
      if(g.period >= 4 && left != null && m <= 10){
        if(left <= 120) late += 0.9;
        else if(left <= 300) late += 0.4;
      }
      s += close * late;
      if(m >= 25 && g.period >= 3) s -= 30;       // garbage time
    }
  } else {
    // not started: the sooner it kicks, the more useful it is to see
    const mins = g.kickoff ? (g.kickoff - Date.now()) / 60000 : 999;
    s += Math.max(0, 42 - Math.max(0, mins) / 12);
  }

  // stakes
  const r1 = g.away.rank, r2 = g.home.rank;
  if(r1 && r2)      s += 34 + (r1 <= 10 ? 8 : 0) + (r2 <= 10 ? 8 : 0);
  else if(r1 || r2) s += 16 + ((r1 || r2) <= 10 ? 6 : 0);

  // who we care about
  if(g.byu)      s += 500;
  else if(g.b12) s += 26;
  return s;
}

// "7:21" -> 441. Null when ESPN gives us nothing useful.
function clockSeconds(c){
  const m = /^(\d+):(\d{2})$/.exec(String(c || '').trim());
  return m ? Number(m[1]) * 60 + Number(m[2]) : null;
}

const isClose = g => g.state === 'in' && g.margin != null &&
                     g.margin <= 8 && g.period >= 3;

/* --------------------------- rendering --------------------------- */
function clockText(g){
  if(g.state === 'post') return 'Final';
  if(g.state === 'in')   return g.clock ? `Q${g.period} ${g.clock}` : (g.detail || 'Live');
  if(!g.kickoff) return g.detail || '';
  const t = g.kickoff.toLocaleTimeString([], { hour:'numeric', minute:'2-digit' })
              .replace(' ', '').toLowerCase();
  const sameDay = g.kickoff.toDateString() === new Date().toDateString();
  return sameDay ? t : g.kickoff.toLocaleDateString([], { weekday:'short' }) + ' ' + t;
}

function bigCard(g){
  const lead = (g.home.score ?? 0) - (g.away.score ?? 0);
  const row = (t, lo) =>
    `<div class="row${lo ? ' lo' : ''}">` +
      `<span class="nm">${t.rank ? `<span class="rk">${t.rank}</span>` : ''}${esc(t.name)}</span>` +
      `<span class="sc">${t.score ?? '–'}</span></div>`;
  const cls = g.byu ? ' byu' : isClose(g) ? ' close' : '';
  return `<div class="big${cls}">` +
    row(g.away, g.state === 'in' && lead > 0) +
    row(g.home, g.state === 'in' && lead < 0) +
    `<div class="ckrow"><span class="ck${g.state === 'pre' ? ' pre' : ''}">${esc(clockText(g))}</span>` +
    (g.tv ? `<span class="tv">${esc(g.tv)}</span>` : '') + `</div></div>`;
}

function line(g){
  const lead = (g.home.score ?? 0) - (g.away.score ?? 0);
  const nm = (t, lo) => `<span class="${lo ? 'l' : ''}">` +
    `${t.rank ? `<span class="rk">${t.rank}</span>` : ''}${esc(t.abbr)}</span>`;
  const sc = (t, lo) => `<span class="${lo ? 'l' : ''}">${t.score ?? '–'}</span>`;
  const aLo = g.state === 'in' && lead > 0, hLo = g.state === 'in' && lead < 0;
  const cls = (g.byu ? ' byu' : g.b12 ? ' b12' : '') + (isClose(g) ? ' close' : '');
  const ck  = g.state === 'post' ? ' done' : g.state === 'pre' ? ' pre' : '';
  return `<div class="g${cls}">` +
    `<span class="t">${nm(g.away, aLo)} <span class="l">at</span> ${nm(g.home, hLo)}</span>` +
    (g.state === 'pre' ? '' :
      `<span class="n">${sc(g.away, aLo)}<span class="l">–</span>${sc(g.home, hLo)}</span>`) +
    `<span class="tv">${esc(g.tv1)}</span>` +
    `<span class="c${ck}">${esc(clockText(g))}</span></div>`;
}

function render(){
  if(!games.length){
    $('out').innerHTML = '<div class="msg">No games on the board right now.</div>';
    return;
  }
  // Only games actually being played compete for the top. Halftime counts:
  // ESPN keeps a game "in" through the break.
  const live = games.filter(g => g.state === 'in')
                    .sort((x, y) => watchability(y) - watchability(x));
  const soon = games.filter(g => g.state === 'pre')
                    .sort((x, y) => (x.kickoff || 0) - (y.kickoff || 0));
  const done = games.filter(g => g.state === 'post')
                    .sort((x, y) => (y.byu - x.byu) || (y.b12 - x.b12));

  // With nothing on yet, an empty screen helps nobody: show what is coming.
  const openSoon = showSoon || !live.length;
  $('togSoon').classList.toggle('on', openSoon);

  let html = '';
  if(live.length){
    const top = live.slice(0, 4), rest = live.slice(4);
    html += `<div class="top">${top.map(bigCard).join('')}</div>`;
    if(rest.length)
      html += `<div class="sec">${rest.length} more live</div><div class="list">${rest.map(line).join('')}</div>`;
  } else {
    const next = soon[0];
    html += `<div class="msg"><b>Nothing live yet</b>` +
      (next ? `Next kickoff ${esc(clockText(next))} &mdash; ${esc(next.away.abbr)} at ${esc(next.home.abbr)}.`
            : 'No more games scheduled on this board.') + `</div>`;
  }
  if(openSoon && soon.length)
    html += `<div class="sec">Upcoming &mdash; ${soon.length}</div><div class="list">${soon.map(line).join('')}</div>`;
  if(showFinals && done.length)
    html += `<div class="sec">Final &mdash; ${done.length}</div><div class="list">${done.map(line).join('')}</div>`;
  $('out').innerHTML = html;

  $('dot').className = 'dot' + (live.length ? '' : ' off');
  $('stamp').textContent = (live.length ? `${live.length} live · ` : '') +
    new Date().toLocaleTimeString([], { hour:'numeric', minute:'2-digit' });
}

function toggleSoon(){
  showSoon = !showSoon;
  render();
}

function toggleFinals(){
  showFinals = !showFinals;
  $('togFinal').classList.toggle('on', showFinals);
  render();
}

/* --------------------------- polling ---------------------------
   Fast while something is live, lazy when nothing is. One request each
   time, whatever is on.                                                */
async function tick(){
  try{
    const res = await fetch(URL, { cache:'no-store' });
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    games = (data.events || []).map(parse).filter(Boolean);
    failed = false;
    render();
  }catch(err){
    console.warn('scoreboard fetch failed', err);
    if(!games.length){
      failed = true;
      $('out').innerHTML = '<div class="msg"><b>Can\'t reach the scoreboard</b>' +
        'This page reads ESPN directly from your browser. If this keeps happening, ' +
        'the request is being refused and the scores need to come through the ' +
        'server instead.</div>';
    }
  }
  schedule();
}

function schedule(){
  clearTimeout(timer);
  if(document.hidden) return;                       // nothing to do in a pocket
  const liveNow = games.some(g => g.state === 'in');
  const soon = games.some(g => g.state === 'pre' && g.kickoff &&
                               g.kickoff - Date.now() < 30 * 60000);
  // Once a minute while live. The full FBS board is a large response, so
  // polling faster costs a real amount of cellular data for very little gain.
  const every = failed ? 120000 : liveNow ? 60000 : soon ? 60000 : 300000;
  timer = setTimeout(tick, every);
}

document.addEventListener('visibilitychange', () => {
  if(document.hidden) clearTimeout(timer); else tick();
});

tick();
</script>
</body>
</html>
