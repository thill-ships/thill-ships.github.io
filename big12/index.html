<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Big 12 War Room</title>
<meta name="description" content="Monday morning Big 12 board — every contender's schedule, our call on every game, and what it does to BYU's odds." />
<meta name="theme-color" content="#002E5D" />
<meta property="og:type" content="website" />
<meta property="og:title" content="Big 12 War Room" />
<meta property="og:description" content="Every contender's schedule, our call on every game, and what it does to BYU's odds." />
<meta property="og:url" content="https://thill-ships.github.io/big12/" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2064%2064'%3E%3Crect%20width='64'%20height='64'%20rx='14'%20fill='%23002E5D'/%3E%3Cg%20fill='%23fff'%3E%3Crect%20x='13'%20y='30'%20width='8'%20height='21'%20rx='2'/%3E%3Crect%20x='28'%20y='20'%20width='8'%20height='31'%20rx='2'/%3E%3Crect%20x='43'%20y='11'%20width='8'%20height='40'%20rx='2'/%3E%3C/g%3E%3C/svg%3E" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:#F1F3F7; --card:#FFFFFF; --panel:#F5F7FA;
    --ink:#14181F; --muted:#69727F; --faint:#A6AEBA; --line:#E6E9EF;
    --navy:#002E5D; --navy-soft:#E7EEF6;

    /* Status palette. Never used alone — every chip also carries a word. */
    --win:#1B6E42;      --win-bg:#E3F1E8;   --win-line:#BEDFCC;
    --loss:#B4322A;     --loss-bg:#FBE8E6;  --loss-line:#F0C9C4;
    --lean-win-bg:#EFF7F2; --lean-loss-bg:#FDF2F1;
    --toss:#8A5A0F;     --toss-bg:#FFF4DF;  --toss-line:#F2DCB4;

    /* The board's own scale: a diverging ramp on this team's chance of winning
       the game, green through neutral to red, with the two results as its
       endpoints — a win is just 100%. Every step's text clears 6:1 on its fill,
       and every cell carries the words too, so the colour is never doing the
       job alone. */
    --c-won:#B7DCC6;  --c-sw:#D8ECE1;  --c-lw:#EDF6F1;  --c-cf:#ECEEF3;
    --c-ll:#FBEFEC;   --c-sl:#F7DBD6;  --c-lost:#EFC4BD;
    --t-won:#12522F;  --t-win:#15603A; --t-cf:#3D4756;
    --t-loss:#A32C23; --t-sl:#95271F;  --t-lost:#7E1F19;

    --series-1:#2a78d6;         /* the one chart hue (validated) */
    --lift:0 1px 2px rgba(16,24,40,.04), 0 6px 18px rgba(16,24,40,.05);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);color:var(--ink);
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    -webkit-font-smoothing:antialiased;font-size:14px;
  }
  button{font:inherit;color:inherit;}
  .wrap{max-width:1400px;margin:0 auto;padding:0 22px 70px;}

  /* ---------------- gate ---------------- */
  #gate{max-width:430px;margin:12vh auto;padding:0 22px;}
  .gate-card{background:var(--card);border-radius:20px;padding:30px 30px 28px;box-shadow:var(--lift);}
  .gate-card h1{font-size:23px;font-weight:800;letter-spacing:-.02em;margin:0 0 6px;}
  .gate-card p{color:var(--muted);line-height:1.55;margin:0 0 20px;font-size:13.5px;}
  .gate-card label{display:block;font-size:11px;font-weight:700;letter-spacing:.1em;
    text-transform:uppercase;color:var(--faint);margin-bottom:6px;}
  .gate-card input{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:11px;
    font:inherit;font-size:15px;background:var(--panel);}
  .gate-card input:focus{outline:none;border-color:var(--navy);background:#fff;}
  .btn{border:none;border-radius:11px;background:var(--navy);color:#fff;font-weight:700;
    padding:12px 18px;cursor:pointer;font-size:14.5px;}
  .btn:disabled{opacity:.55;cursor:default;}
  .btn.ghost{background:var(--panel);color:var(--ink);}
  .btn.sm{padding:8px 13px;font-size:13px;border-radius:9px;}
  #gateMsg{margin-top:14px;font-size:13px;line-height:1.5;display:none;}

  /* ---------------- header ---------------- */
  .hd{background:var(--card);border-bottom:1px solid var(--line);}
  .hd-in{max-width:1400px;margin:0 auto;padding:20px 22px 0;
    display:flex;align-items:flex-start;justify-content:space-between;gap:20px;}
  .hd-k{font-size:10.5px;font-weight:800;letter-spacing:.15em;text-transform:uppercase;
    color:#8A93A1;margin-bottom:5px;}
  .hd-t{font-size:26px;font-weight:800;letter-spacing:-.03em;line-height:1.05;}
  .hd-s{font-size:12.5px;color:var(--muted);margin-top:6px;}
  .hd-actions{display:flex;align-items:center;gap:9px;flex:none;}
  .tabs{max-width:1400px;margin:0 auto;padding:18px 22px 0;display:flex;gap:26px;}
  .tab{border:none;background:none;font-size:14px;font-weight:700;color:var(--faint);
    padding:0 0 12px;cursor:pointer;border-bottom:3px solid transparent;}
  .tab.on{color:var(--ink);border-bottom-color:var(--navy);}
  .tab:hover{color:var(--muted);}
  .view{display:none;} .view.on{display:block;}

  /* ---------------- shared bits ---------------- */
  .card{background:var(--card);border-radius:16px;box-shadow:var(--lift);margin-top:18px;}
  .card-hd{padding:17px 20px 0;}
  .card-t{font-size:16px;font-weight:800;letter-spacing:-.02em;}
  .card-s{font-size:12.5px;color:var(--muted);margin-top:4px;line-height:1.5;}
  .row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .spacer{flex:1;}
  .pill{display:inline-flex;align-items:center;gap:6px;background:var(--panel);border-radius:999px;
    padding:5px 11px;font-size:12px;font-weight:700;color:var(--muted);}
  .num{font-variant-numeric:tabular-nums;}
  .muted{color:var(--muted);}
  .empty{padding:34px 20px;text-align:center;color:var(--muted);font-size:13.5px;line-height:1.6;}

  /* ---------------- the board ---------------- */
  .legend{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:14px 20px 16px;}
  .lg{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;color:var(--muted);}
  .lg i{width:13px;height:13px;border-radius:4px;display:block;border:1px solid var(--line);flex:none;}
  .scroller{overflow-x:auto;padding-bottom:4px;}
  .board{display:grid;min-width:max-content;border-top:1px solid var(--line);}
  .bcell{border-right:1px solid var(--line);border-bottom:1px solid var(--line);}
  .bhead{background:var(--card);padding:9px 8px;text-align:center;}
  .bhead .wk{font-size:11px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);}
  .bhead .dt{font-size:10.5px;color:var(--faint);margin-top:2px;}
  .bhead.now{background:var(--navy-soft);}
  .bteam{position:sticky;left:0;z-index:2;background:var(--card);padding:10px 12px;
    display:flex;align-items:center;gap:9px;box-shadow:7px 0 14px -10px rgba(16,24,40,.35);}
  .bproj{position:sticky;right:0;z-index:2;background:var(--card);padding:9px 12px;
    display:flex;flex-direction:column;justify-content:center;
    box-shadow:-7px 0 14px -10px rgba(16,24,40,.35);}
  .bteam.corner{z-index:4;}
  .bteam img{width:24px;height:24px;object-fit:contain;flex:none;}
  /* Hidden rather than removed: a logo that never arrives leaves its slot, so
     the team names stay on one line down the column instead of jumping. */
  .bteam .tn{font-size:13.5px;font-weight:800;letter-spacing:-.015em;line-height:1.15;}
  .bteam .tr{font-size:11px;color:var(--muted);margin-top:1px;}
  .rk{font-size:10.5px;font-weight:800;color:var(--navy);}
  .bteam .drag{margin-left:auto;color:var(--faint);cursor:grab;font-size:13px;user-select:none;}

  .g{width:100%;height:100%;min-height:56px;border:none;background:var(--card);cursor:pointer;
    padding:7px 6px;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:2px;text-align:center;transition:filter .12s;}
  .g:hover{filter:brightness(.975);}
  .g:focus-visible{outline:2px solid var(--navy);outline-offset:-2px;}
  .g .opp{font-size:12.5px;font-weight:800;letter-spacing:-.01em;white-space:nowrap;}
  .g .opp span{font-weight:600;color:var(--muted);font-size:11px;}
  .g .st{font-size:10.5px;font-weight:700;letter-spacing:.02em;}
  .g.bye{background:var(--panel);cursor:default;}
  .g.bye .opp{color:var(--faint);font-weight:700;font-size:11px;letter-spacing:.1em;}
  .g.won {background:var(--c-won);}  .g.won  .st{color:var(--t-won);}
  .g.sw  {background:var(--c-sw);}   .g.sw   .st{color:var(--t-win);}
  .g.lw  {background:var(--c-lw);}   .g.lw   .st{color:var(--t-win);}
  .g.cf  {background:var(--c-cf);}   .g.cf   .st{color:var(--t-cf);}
  .g.ll  {background:var(--c-ll);}   .g.ll   .st{color:var(--t-loss);}
  .g.sl  {background:var(--c-sl);}   .g.sl   .st{color:var(--t-sl);}
  .g.lost{background:var(--c-lost);} .g.lost .st{color:var(--t-lost);}
  .g.auto .st{color:var(--faint);font-weight:600;}
  .g.set{box-shadow:inset 0 0 0 1.5px rgba(0,46,93,.16);}
  .g.nc .opp:after{content:'NC';font-size:8.5px;font-weight:800;color:var(--faint);
    vertical-align:super;margin-left:3px;letter-spacing:.05em;}
  .g.link{filter:brightness(.955);}
  .g .flag{font-size:9px;color:var(--faint);}

  /* ---------------- popover ---------------- */
  #pop{position:absolute;z-index:60;display:none;width:260px;background:var(--card);
    border-radius:14px;box-shadow:0 4px 12px rgba(16,24,40,.1),0 20px 44px rgba(16,24,40,.16);
    border:1px solid var(--line);padding:14px;}
  #pop h4{margin:0 0 3px;font-size:13.5px;font-weight:800;letter-spacing:-.01em;}
  #pop .sub{font-size:11.5px;color:var(--muted);margin-bottom:11px;}
  #pop .opt{display:block;width:100%;text-align:left;border:1.5px solid var(--line);background:var(--card);
    border-radius:10px;padding:8px 11px;margin-bottom:6px;cursor:pointer;font-size:13px;font-weight:700;}
  #pop .opt:hover{background:var(--panel);}
  #pop .opt.on{border-color:var(--navy);background:var(--navy-soft);}
  #pop .opt small{display:block;font-weight:500;color:var(--muted);font-size:11px;margin-top:1px;}
  #pop textarea{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;
    font:inherit;font-size:12.5px;resize:vertical;min-height:52px;background:var(--panel);}
  #pop textarea:focus{outline:none;border-color:var(--navy);background:#fff;}

  /* ---------------- tables ---------------- */
  table{width:100%;border-collapse:collapse;}
  th{font-size:10.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--faint);
    text-align:right;padding:12px 12px 10px;border-bottom:1px solid var(--line);white-space:nowrap;}
  th.l,td.l{text-align:left;}
  td{padding:11px 12px;border-bottom:1px solid var(--line);font-size:13.5px;
    font-variant-numeric:tabular-nums;text-align:right;}
  tr:last-child td{border-bottom:none;}
  tr.me td{background:var(--navy-soft);}
  tr.tracked td{font-weight:700;}
  .tcell{display:flex;align-items:center;gap:9px;}
  .tcell img{width:21px;height:21px;object-fit:contain;flex:none;}
  .seed{display:inline-grid;place-items:center;width:21px;height:21px;border-radius:6px;
    background:var(--panel);font-size:11px;font-weight:800;color:var(--muted);}
  .seed.top2{background:var(--navy);color:#fff;}
  .bar{position:relative;height:7px;border-radius:999px;background:var(--panel);
    width:110px;display:inline-block;vertical-align:middle;overflow:hidden;}
  .bar i{position:absolute;left:0;top:0;bottom:0;border-radius:999px;background:var(--series-1);}
  .bar.dim i{background:#C3CBD8;}

  /* ---------------- this week ---------------- */
  .gm{display:grid;grid-template-columns:1fr 190px;gap:16px;align-items:center;
    padding:13px 20px;border-bottom:1px solid var(--line);}
  .gm:last-child{border-bottom:none;}
  .gm-t{font-size:14px;font-weight:700;letter-spacing:-.01em;}
  .gm-s{font-size:12px;color:var(--muted);margin-top:3px;line-height:1.45;}
  .gm-s b{color:var(--ink);font-weight:700;}
  .swing{text-align:right;}
  .swing .v{font-size:17px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;}
  .swing .k{font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--faint);}
  .root{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:800;
    padding:3px 9px;border-radius:999px;background:var(--win-bg);color:var(--win);margin-top:5px;}
  .root.none{background:var(--panel);color:var(--muted);}

  /* ---------------- BYU + props ---------------- */
  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));
    border-top:1px solid var(--line);}
  .tile{padding:16px 20px 18px;border-right:1px solid var(--line);}
  .tile:last-child{border-right:none;}
  .tile .k{font-size:10.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;
    color:var(--faint);margin-bottom:7px;}
  .tile .v{font-size:31px;font-weight:800;letter-spacing:-.035em;line-height:1;
    font-variant-numeric:tabular-nums;}
  .tile .s{font-size:12px;color:var(--muted);margin-top:5px;line-height:1.4;}

  .need{display:grid;grid-template-columns:78px 1fr 62px;gap:12px;align-items:center;
    padding:7px 20px;}
  .need .rc{font-size:13px;font-weight:800;font-variant-numeric:tabular-nums;}
  .need .tk{position:relative;height:9px;border-radius:999px;background:var(--panel);overflow:hidden;}
  .need .tk i{position:absolute;inset:0 auto 0 0;border-radius:999px;background:var(--series-1);}
  .need .tk b{position:absolute;inset:0 auto 0 0;border-radius:999px;background:#DDE3EC;}
  .need .pv{font-size:12.5px;font-weight:700;text-align:right;font-variant-numeric:tabular-nums;}
  .need.dim .rc,.need.dim .pv{color:var(--faint);}

  .sched{display:grid;grid-template-columns:52px 1fr 128px 118px;gap:12px;align-items:center;
    padding:10px 20px;border-bottom:1px solid var(--line);}
  .sched:last-child{border-bottom:none;}
  .sched .wk{font-size:11px;font-weight:800;color:var(--faint);letter-spacing:.06em;}
  .sched .op{font-size:13.5px;font-weight:700;}
  .sched .dt{font-size:11.5px;color:var(--muted);margin-top:2px;}
  /* The schedule reuses the board's cell classes for its colours, but not its
     box: these are one-line buttons, not grid cells. */
  .call{border:none;border-radius:9px;padding:8px 10px;font-size:12px;font-weight:800;
    cursor:pointer;width:100%;text-align:center;min-height:0;display:block;}
  .call:disabled{cursor:default;}
  .call.auto{background:var(--panel);color:var(--muted);}

  .pgrid{width:100%;border-collapse:collapse;}
  .pgrid th{text-align:center;} .pgrid th.l{text-align:left;}
  .pgrid td{text-align:center;vertical-align:middle;}
  .pgrid td.l{text-align:left;}
  .pq{font-size:13.5px;font-weight:700;letter-spacing:-.01em;}
  .pd{font-size:11.5px;color:var(--muted);margin-top:2px;}
  .pin{width:82px;padding:7px 8px;border:1.5px solid var(--line);border-radius:9px;font:inherit;
    font-size:13.5px;text-align:center;background:var(--panel);font-variant-numeric:tabular-nums;}
  .pin:focus{outline:none;border-color:var(--navy);background:#fff;}
  .pin.win{border-color:var(--win-line);background:var(--c-sw);color:var(--t-win);font-weight:800;}
  select.pin{width:132px;text-align:left;}
  .split{display:flex;flex-direction:column;gap:3px;}
  .sr{display:flex;align-items:center;gap:8px;}
  .sl{font-size:12px;font-weight:700;min-width:104px;}
  .st2{flex:1;height:12px;border-radius:4px;background:var(--panel);position:relative;
    overflow:hidden;max-width:120px;}
  .st2 i{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:#BBD3EE;}
  .sn{font-size:12px;font-weight:800;font-variant-numeric:tabular-nums;min-width:18px;}
  .now{display:inline-flex;align-items:baseline;gap:5px;}
  .now b{font-size:16px;font-weight:800;font-variant-numeric:tabular-nums;}
  .now span{font-size:11px;color:var(--muted);}
  .settled{font-size:9.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;
    color:var(--win);}

  /* ---------------- history ---------------- */
  .facets{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));
    border-top:1px solid var(--line);}
  .facet{padding:14px 16px 10px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);}
  .facet-hd{display:flex;align-items:baseline;gap:8px;margin-bottom:2px;}
  .facet-t{font-size:13.5px;font-weight:800;letter-spacing:-.015em;}
  .facet-v{margin-left:auto;font-size:15px;font-weight:800;font-variant-numeric:tabular-nums;}
  .facet-d{font-size:11.5px;font-weight:700;font-variant-numeric:tabular-nums;}
  .up{color:var(--win);} .down{color:var(--loss);} .flat{color:var(--faint);}
  .facet svg{display:block;width:100%;height:auto;overflow:visible;margin-top:4px;}
  .snaps{display:flex;gap:8px;overflow-x:auto;padding:14px 20px 16px;}
  .snap{flex:none;border:1.5px solid var(--line);background:var(--card);border-radius:11px;
    padding:8px 13px;cursor:pointer;text-align:left;min-width:120px;}
  .snap.on{border-color:var(--navy);background:var(--navy-soft);}
  .snap .sd{font-size:12.5px;font-weight:800;}
  .snap .ss{font-size:11px;color:var(--muted);margin-top:2px;}
  .chg{padding:12px 20px;border-bottom:1px solid var(--line);font-size:13px;line-height:1.55;}
  .chg:last-child{border-bottom:none;}
  .chg b{font-weight:700;}
  .tag{display:inline-block;font-size:9.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;
    padding:2px 7px;border-radius:5px;background:var(--panel);color:var(--muted);margin-right:8px;
    vertical-align:1px;}
  .tag.res{background:var(--navy-soft);color:var(--navy);}
  .tag.pred{background:var(--toss-bg);color:var(--toss);}

  /* ---------------- misc ---------------- */
  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(12px);
    background:#14181F;color:#fff;padding:11px 18px;border-radius:11px;font-size:13.5px;font-weight:600;
    opacity:0;pointer-events:none;transition:.2s;z-index:80;}
  .toast.on{opacity:1;transform:translateX(-50%) translateY(0);}
  .modal{position:fixed;inset:0;background:rgba(16,24,40,.4);display:none;z-index:70;
    align-items:center;justify-content:center;padding:22px;}
  .modal.on{display:flex;}
  .sheet{background:var(--card);border-radius:18px;max-width:520px;width:100%;max-height:86vh;
    overflow:auto;padding:24px;}
  .sheet h3{margin:0 0 5px;font-size:18px;font-weight:800;letter-spacing:-.02em;}
  .sheet p{margin:0 0 18px;font-size:13px;color:var(--muted);line-height:1.55;}
  .tpick{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;cursor:pointer;
    border:1.5px solid transparent;}
  .tpick:hover{background:var(--panel);}
  .tpick.on{border-color:var(--navy);background:var(--navy-soft);}
  .tpick img{width:22px;height:22px;object-fit:contain;}
  .tpick .nm{font-size:13.5px;font-weight:700;}
  .tpick .rc{margin-left:auto;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;}
  .tpick .acts{display:flex;gap:4px;margin-left:12px;flex:none;}
  .sec{font-size:10.5px;font-weight:800;letter-spacing:.11em;text-transform:uppercase;
    color:var(--faint);margin:16px 0 6px;}
  .sec:first-child{margin-top:2px;}
  .mini{border:1.5px solid var(--line);background:var(--card);border-radius:8px;padding:4px 8px;
    font-size:11.5px;font-weight:700;cursor:pointer;line-height:1.3;}
  .mini:hover:not(:disabled){background:var(--panel);}
  .mini:disabled{opacity:.35;cursor:default;}
  .mini.drop{color:var(--loss);border-color:var(--loss-line);}
  .mini.go{color:var(--navy);border-color:#C3D5E8;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:4px;}
  input[type=text],textarea.big{width:100%;padding:10px 12px;border:1.5px solid var(--line);
    border-radius:10px;font:inherit;font-size:14px;background:var(--panel);}

<script>
/* ==========================================================================
   CONFIG

   Same Supabase project as the pick'em app — the schedule, scores and betting
   lines this board runs on are the ones that sync job already keeps current.
   The publishable key belongs in public code; Row Level Security is what
   actually protects the data (see schema.sql). Full walkthrough in SETUP.md.
   ========================================================================== */
const CFG = {
  url:     'https://yehpygarkxdopdvugifk.supabase.co',
  key:     'sb_publishable_sGJHMMHbmIyLcORXh2pauw_CePLfJDo',
  account: 'warroom@thill-ships.app'   // the one shared login. Must match schema.sql.
};

const BUILD = '2026-09-01.1';
const SIMS  = 20000;    // Monte Carlo runs for the live view
const SIMS_HIST = 4000; // fewer per point when redrawing the whole season's history
const SIGMA = 16.0;     // std dev of a college football final margin, in points

/* The five calls you can make on a game, best to worst from the row team's
   point of view. `pick` is who the prediction favours; `strength` is how hard.
   Storing direction and strength separately is what keeps a game between two
   contenders honest: one row's "Should win" IS the other row's "Should lose".
   Rename the labels here and they change everywhere. */
const LEVELS = [
  { k:'sw', label:'Should win',  full:'Should win',   pick:'me',  strength:'strong' },
  { k:'lw', label:'Lean win',    full:'Lean win',     pick:'me',  strength:'lean'   },
  { k:'cf', label:'Coin flip',   full:'Coin flip',    pick:null,  strength:'tossup' },
  { k:'ll', label:'Lean loss',   full:'Lean loss',    pick:'opp', strength:'lean'   },
  { k:'sl', label:'Should lose', full:'Should lose',  pick:'opp', strength:'strong' }
];

/* ========================= state ========================= */
let supa = null, user = null;
let season = null;
let games = [];                 // every Big 12 game this season
let teams = {};                 // id -> {id,name,abbr,logo,rank,record}
let members = [];               // Big 12 team ids, alphabetical by name
let preds = {};                 // game_id -> {pick_team_id, strength, note}
let settings = { contenders: [], strong_prob: 0.80, lean_prob: 0.65 };
let props = [];                 // season-long questions about BYU
let propPicks = [], propPlayers = {}, propLocks = [];   // read-only, from /props/
let snapshots = [];             // newest first, payload included
let view = 'board';
let weekSel = null;             // week shown on the "This week" tab
let focusId = null;             // whose odds the swing numbers are measured in
let sim = null;                 // cached simulate() output for the live board
let popGame = null;             // game_id the popover is editing
let boardScroll = 0;            // horizontal scroll, kept across re-renders

const $  = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const pct = v => v > 0 && v < 0.005 ? '<1%'
              : v < 1 && v > 0.995 ? '>99%'
              : Math.round(v * 100) + '%';
const pct1 = v => (v * 100).toFixed(1) + '%';
const ready = () => CFG.url.startsWith('http') && CFG.key.length > 20;

function toast(m, ms = 2600){
  const t = $('toast'); t.textContent = m; t.classList.add('on');
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('on'), ms);
}
function seasonOf(d){ d = d || new Date(); return d.getMonth() >= 7 ? d.getFullYear() : d.getFullYear()-1; }
function fmtDate(iso){
  return new Date(iso).toLocaleDateString([], { month:'short', day:'numeric' });
}
function fmtWhen(iso){
  return new Date(iso).toLocaleString([], { weekday:'short', month:'short', day:'numeric',
                                            hour:'numeric', minute:'2-digit' });
}
function teamName(id){ return (teams[id] && teams[id].name) || 'TBD'; }
function teamAbbr(id){ return (teams[id] && teams[id].abbr) || '—'; }

/* ========================= boot ========================= */
(function(){
  if(!ready()){
    $('gate').innerHTML = '<div class="gate-card"><h1>Almost there</h1><p>This board still needs '+
      'its Supabase keys. Open <code>big12/index.html</code>, find the <code>CFG</code> block, and '+
      'paste in the project URL and publishable key — the same pair the pick’em app uses. '+
      'Walkthrough in <code>big12/SETUP.md</code>.</p></div>';
    return;
  }
  supa = window.supabase.createClient(CFG.url, CFG.key);
  supa.auth.getSession().then(({ data }) => {
    if(data && data.session) signedIn(data.session.user); else $('gate').style.display = '';
  });
  supa.auth.onAuthStateChange((_e, s) => {
    if(s && s.user){ if(!user || user.id !== s.user.id) signedIn(s.user); }
    else { user = null; $('gate').style.display = ''; $('app').style.display = 'none'; }
  });
})();

async function doAuth(ev){
  if(ev) ev.preventDefault();
  const pw = $('pw').value || '';
  if(pw.length < 6) return toast('The password is at least 6 characters');
  const btn = $('authBtn'); btn.disabled = true; btn.textContent = 'Opening…';

  const { error } = await supa.auth.signInWithPassword({ email: CFG.account, password: pw });
  btn.disabled = false; btn.textContent = 'Open the board';
  if(!error) return;

  const msg = $('gateMsg');
  msg.style.display = ''; msg.style.color = 'var(--loss)';
  if(/invalid login credentials/i.test(error.message || '')){
    // Either the password is wrong, or nobody has claimed the account yet.
    msg.innerHTML = 'That password did not work. If this is the very first time anyone has '+
      'opened the board, <button class="btn ghost sm" style="margin-top:8px" onclick="claim()">'+
      'set this as the password</button>';
  } else {
    msg.textContent = error.message;
  }
}

/* First-run only: claims the shared account with whatever is in the box. */
async function claim(){
  const pw = $('pw').value || '';
  const { error } = await supa.auth.signUp({ email: CFG.account, password: pw });
  if(error){
    $('gateMsg').innerHTML = /already registered/i.test(error.message)
      ? 'The account already exists, so that password is simply wrong. Ask whoever set it, or '+
        'reset it in Supabase under Authentication → Users.'
      : esc(error.message);
    return;
  }
  toast('Password set. You are in.');
}

function signOut(){ supa.auth.signOut(); }

async function signedIn(u){
  user = u;
  $('gate').style.display = 'none';
  $('app').style.display = '';
  await loadAll();
}

/* ========================= loading ========================= */
async function loadAll(){
  season = seasonOf();

  const [gRes, pRes, sRes] = await Promise.all([
    supa.from('pickem_games').select('*').eq('season', season).order('kickoff'),
    supa.from('b12_predictions').select('*').eq('season', season),
    supa.from('b12_settings').select('*').eq('season', season).maybeSingle()
  ]);

  if(gRes.error){ fatal(gRes.error, 'the schedule'); return; }
  if(pRes.error){ fatal(pRes.error, 'the predictions'); return; }

  games = gRes.data || [];
  preds = {};
  (pRes.data || []).forEach(r => { preds[r.game_id] = r; });

  indexTeams();
  if(!members.length){
    $('app').innerHTML = '<div class="wrap"><div class="card"><div class="empty">'
      + 'No ' + season + ' Big 12 schedule in the database yet.<br><br>Run '
      + '<b>Actions → Pick’em — sync games</b> once; it loads the whole season from ESPN and '
      + 'both apps read it. This page will work as soon as it has.</div></div></div>';
    return;
  }

  if(sRes.data){
    settings = {
      contenders: sRes.data.contenders || [],
      // strong_prob/lean_prob arrived with the five-level board; a row written
      // by the three-level one only has likely_prob.
      strong_prob: Number(sRes.data.strong_prob != null ? sRes.data.strong_prob
                                                        : sRes.data.likely_prob || 0.80),
      lean_prob:   Number(sRes.data.lean_prob != null ? sRes.data.lean_prob : 0.65)
    };
  } else {
    settings = { contenders: defaultContenders(), strong_prob: 0.80, lean_prob: 0.65 };
    await saveSettings();     // first run: write the defaults so both of you see the same board
  }
  settings.contenders = settings.contenders.filter(id => members.includes(id));
  if(!settings.contenders.length) settings.contenders = defaultContenders();

  focusId = settings.contenders.includes(byuId()) ? byuId() : settings.contenders[0];
  weekSel = currentWeek();

  await Promise.all([loadSnapshots(), loadProps()]);
  live();
  render();
  subscribe();
}

function fatal(error, what){
  $('app').innerHTML = '<div class="wrap"><div class="card"><div class="empty">'+
    'Could not load '+what+'.<br><br><code>'+esc(error.message||'')+'</code><br><br>'+
    'If this says the table does not exist, <code>big12/schema.sql</code> has not been run yet — '+
    'see <code>big12/SETUP.md</code>.</div></div></div>';
}

/* The props live in their own app at /props/, where everyone has a login and
   locks their own answers in. Here they are read-only: the row-level policy
   only hands this account answers that have already been locked, so the window
   cannot show a number its owner could still change. */
async function loadProps(){
  const [pr, pk, pl, lk] = await Promise.all([
    supa.from('b12_props').select('*').eq('season', season).order('sort').order('id'),
    supa.from('b12_prop_picks').select('*'),
    supa.from('b12_prop_players').select('*'),
    supa.from('b12_prop_locks').select('*').eq('season', season)
  ]);
  props = pr.error ? [] : (pr.data || []);
  propPicks = pk.error ? [] : (pk.data || []);
  propPlayers = {};
  (pl.error ? [] : (pl.data || [])).forEach(x => { propPlayers[x.user_id] = x; });
  propLocks = lk.error ? [] : (lk.data || []);
}

async function loadSnapshots(){
  const { data, error } = await supa.from('b12_snapshots').select('*')
    .eq('season', season).order('taken_at', { ascending: false }).limit(60);
  snapshots = (error ? [] : (data || []))
    .slice().sort((a, b) => (a.taken_at < b.taken_at ? 1 : a.taken_at > b.taken_at ? -1 : 0));
}

/* Teams come out of the schedule itself rather than a hardcoded list, so a
   conference realignment fixes itself. A team counts as a Big 12 member if it
   plays at least one conference game — true for all 16 from day one, because
   the sync job loads the whole season's schedule up front. */
function indexTeams(){
  teams = {};
  const isMember = {};
  for(const g of games){
    for(const side of ['home','away']){
      const id = g[side+'_id'];
      if(!id) continue;
      const cur = teams[id] || { id, name:'', abbr:'', logo:'', rank:null, record:'' };
      cur.name   = g[side+'_name']   || cur.name;
      cur.abbr   = g[side+'_abbr']   || cur.abbr;
      cur.logo   = g[side+'_logo']   || cur.logo;
      cur.record = g[side+'_record'] || cur.record;
      if(g[side+'_rank'] != null) cur.rank = g[side+'_rank'];
      teams[id] = cur;
    }
    if(g.conference_game){ isMember[g.home_id] = 1; isMember[g.away_id] = 1; }
  }
  members = Object.keys(isMember).sort((a,b) => teams[a].name.localeCompare(teams[b].name));
}

function byuId(){
  const hit = members.find(id => (teams[id].abbr || '').toUpperCase() === 'BYU');
  return hit || members[0];
}

/* The six we start the season watching. Matched by abbreviation rather than a
   hardcoded id, so it survives ESPN renumbering anything. Add and remove teams
   in the Contenders sheet — this list only decides the very first load. */
const OPENING_SIX = ['BYU', 'ASU', 'TTU', 'UTAH', 'ARIZ', 'HOU'];

function defaultContenders(){
  const byAbbr = {};
  members.forEach(id => { byAbbr[(teams[id].abbr || '').toUpperCase()] = id; });
  const picked = OPENING_SIX.map(a => byAbbr[a]).filter(Boolean);
  if(picked.length >= 4) return picked;
  // Something has changed about the conference. Fall back to the ranked teams.
  const rest = members.filter(id => picked.indexOf(id) < 0)
    .sort((a,b) => (teams[a].rank || 99) - (teams[b].rank || 99)
                || teams[a].name.localeCompare(teams[b].name));
  return picked.concat(rest).slice(0, 6);
}

function subscribe(){
  supa.channel('b12')
    .on('postgres_changes', { event:'*', schema:'public', table:'b12_predictions' }, p => {
      const r = p.new && p.new.game_id ? p.new : null;
      if(p.eventType === 'DELETE' && p.old) delete preds[p.old.game_id];
      else if(r) preds[r.game_id] = r;
      live(); render();
    })
    .on('postgres_changes', { event:'*', schema:'public', table:'b12_settings' }, p => {
      if(p.new && p.new.season === season){
        settings = { contenders: p.new.contenders || [],
                     strong_prob: Number(p.new.strong_prob),
                     lean_prob: Number(p.new.lean_prob) };
        live(); render();
      }
    })
    .on('postgres_changes', { event:'*', schema:'public', table:'b12_props' },
        () => loadProps().then(render))
    .on('postgres_changes', { event:'*', schema:'public', table:'b12_prop_picks' },
        () => loadProps().then(render))
    .on('postgres_changes', { event:'*', schema:'public', table:'b12_prop_locks' },
        () => loadProps().then(render))
    .subscribe();
}

/* ==========================================================================
   THE MATH

   Every undecided game gets a win probability. In order of preference:
     1. your call on it        — "likely" is worth `likely_prob` (0.75 by default)
     2. the betting line       — a spread converted through a normal curve
     3. nothing at all         — a coin flip
   That second step is what makes an untouched board already worth reading: the
   market has an opinion about all 72 conference games, and yours overrides it
   one game at a time.
   ========================================================================== */

/* Normal CDF, Zelen & Severo 26.2.17 — plenty accurate for this. */
function normCdf(z){
  const t = 1 / (1 + 0.2316419 * Math.abs(z));
  const d = 0.3989422804014327 * Math.exp(-z * z / 2);
  const p = d * t * (0.319381530 + t * (-0.356563782 + t * (1.781477937 +
            t * (-1.821255978 + t * 1.330274429))));
  return z > 0 ? 1 - p : p;
}

/* home_spread is negative when the home team is favored, so the expected home
   margin is its negation. SIGMA is the spread of actual results around it. */
function marketPHome(g){
  if(g.home_spread == null) return 0.5;
  return normCdf(-Number(g.home_spread) / SIGMA);
}

/* `probs` is {strong, lean} — what the two confident calls are worth. */
function pHome(g, P, probs){
  const p = P[g.id];
  if(p && p.strength && p.strength !== 'auto'){
    if(p.strength === 'tossup' || !p.pick_team_id) return 0.5;
    // 'likely' is the three-level board's old name for 'strong'.
    const v = p.strength === 'lean' ? probs.lean : probs.strong;
    if(p.pick_team_id === g.home_id) return v;
    if(p.pick_team_id === g.away_id) return 1 - v;
  }
  return marketPHome(g);
}
function pFor(g, teamId, P, probs){
  const h = pHome(g, P, probs);
  return teamId === g.home_id ? h : 1 - h;
}
const probsOf = st => ({ strong: Number(st.strong_prob), lean: Number(st.lean_prob) });

/* Which of the five calls a stored row represents, from teamId's side. */
function levelOf(p, teamId){
  if(!p || !p.strength || p.strength === 'auto') return null;
  if(p.strength === 'tossup' || !p.pick_team_id) return LEVELS[2];
  const mine = p.pick_team_id === teamId;
  const strong = p.strength !== 'lean';          // 'strong', or legacy 'likely'
  return LEVELS.find(l => l.strength === (strong ? 'strong' : 'lean')
                       && l.pick === (mine ? 'me' : 'opp'));
}
/* Turn one of the five back into a storable row. */
function rowFor(level, g, teamId){
  return {
    pick_team_id: level.pick === 'me' ? teamId
                : level.pick === 'opp' ? oppOf(g, teamId) : null,
    strength: level.strength
  };
}

function oppOf(g, teamId){ return teamId === g.home_id ? g.away_id : g.home_id; }
function isHome(g, teamId){ return teamId === g.home_id; }

/* What one cell of the board says. `set` means a human decided it. */
function cellState(g, teamId){
  const P = preds;
  if(g.status === 'final' && g.winner_id){
    const won = g.winner_id === teamId;
    const me = teamId === g.home_id ? g.home_score : g.away_score;
    const them = teamId === g.home_id ? g.away_score : g.home_score;
    return { k: won ? 'won' : 'lost', label: (won ? 'W ' : 'L ') + me + '–' + them,
             set: true, done: true };
  }
  const lvl = levelOf(P[g.id], teamId);
  if(lvl) return { k: lvl.k, label: lvl.label, set: true };

  const pv = pFor(g, teamId, P, probsOf(settings));
  const sp = g.home_spread == null ? null
           : (teamId === g.home_id ? Number(g.home_spread) : -Number(g.home_spread));
  const line = sp == null ? '' : (sp > 0 ? '+' + sp : sp === 0 ? 'PK' : String(sp));
  return { k:'auto', label: line || (pv >= .5 ? 'lean W' : 'lean L'), set:false, auto:true, p:pv };
}

function confRecords(){
  const rec = {};
  for(const g of games){
    if(!g.conference_game) continue;
    for(const id of [g.home_id, g.away_id]) rec[id] = rec[id] || { w:0, l:0, games:0 };
    rec[g.home_id].games++; rec[g.away_id].games++;
    if(g.status === 'final' && g.winner_id){
      const lose = g.winner_id === g.home_id ? g.away_id : g.home_id;
      rec[g.winner_id].w++; rec[lose].l++;
    }
  }
  return rec;
}
function overallRecords(){
  const rec = {};
  for(const g of games){
    for(const id of [g.home_id, g.away_id]) rec[id] = rec[id] || { w:0, l:0 };
    if(g.status === 'final' && g.winner_id){
      const lose = g.winner_id === g.home_id ? g.away_id : g.home_id;
      rec[g.winner_id].w++; rec[lose].l++;
    }
  }
  return rec;
}

function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

/* --------------------------------------------------------------------------
   Monte Carlo the rest of the conference season.

   Plays every undecided conference game `runs` times at its probability, ranks
   the league each time, and counts how often each team lands in the top two —
   which is the whole ballgame, because the top two play for the title.

   Ties are broken head to head using that same simulated season, then at
   random. That is a simplification of the real multi-team tiebreaker, but it
   gets the two-team case (much the most common) exactly right.

   The run is seeded, so the same board always produces the same numbers. Odds
   that wiggle when you switch tabs are odds nobody trusts.
   -------------------------------------------------------------------------- */
function simulate(opts){
  const G = opts.games, P = opts.preds, probs = opts.probs;
  const runs = opts.runs || SIMS;
  const n = members.length;
  const idx = {}; members.forEach((id, i) => { idx[id] = i; });

  const conf = G.filter(g => g.conference_game && idx[g.home_id] !== undefined
                                               && idx[g.away_id] !== undefined);

  const gh = new Int32Array(conf.length), ga = new Int32Array(conf.length);
  const gfinal = new Int8Array(conf.length), gpend = new Int32Array(conf.length);
  const pairGame = new Int32Array(n * n).fill(-1);
  const baseW = new Int32Array(n), baseL = new Int32Array(n), played = new Int32Array(n);
  const pendP = [], pendCi = [];

  conf.forEach((g, ci) => {
    const h = idx[g.home_id], a = idx[g.away_id];
    gh[ci] = h; ga[ci] = a;
    pairGame[h * n + a] = ci; pairGame[a * n + h] = ci;
    played[h]++; played[a]++;
    if(g.status === 'final' && g.winner_id){
      const hw = g.winner_id === g.home_id ? 1 : 0;
      gfinal[ci] = hw; gpend[ci] = -1;
      if(hw){ baseW[h]++; baseL[a]++; } else { baseW[a]++; baseL[h]++; }
    } else {
      gfinal[ci] = -1; gpend[ci] = pendP.length;
      pendP.push(pHome(g, P, probs)); pendCi.push(ci);
    }
  });

  // Which games we want conditional odds for, and for whom.
  const levCi = [], levGames = [];
  if(opts.leverageWeek != null){
    conf.forEach((g, ci) => {
      if(g.week === opts.leverageWeek && gpend[ci] >= 0){ levCi.push(ci); levGames.push(g); }
    });
  }
  const foc = (opts.focus || []).filter(id => idx[id] !== undefined);
  const L = levCi.length, F = foc.length;
  const hitH = new Float64Array(L * F), hitA = new Float64Array(L * F);
  const nH = new Float64Array(L), nA = new Float64Array(L);

  const cnt1 = new Float64Array(n), cnt2 = new Float64Array(n), sumW = new Float64Array(n);
  const hist = new Float64Array(n * 12);      // how often a team finishes on W wins
  const hist2 = new Float64Array(n * 12);     // ...and makes the title game from there
  const outcomes = new Uint8Array(pendP.length);
  const wins = new Int32Array(n), rk = new Float64Array(n);
  const ord = new Int32Array(n);
  const rnd = mulberry32(0x9E3779B9 ^ (pendP.length * 7919) ^ runs);
  const ordArr = [];

  for(let s = 0; s < runs; s++){
    wins.set(baseW);
    for(let k = 0; k < pendP.length; k++){
      const r = rnd() < pendP[k] ? 1 : 0;
      outcomes[k] = r;
      wins[r ? gh[pendCi[k]] : ga[pendCi[k]]]++;
    }
    for(let i = 0; i < n; i++){ ord[i] = i; rk[i] = rnd(); }
    ordArr.length = 0;
    for(let i = 0; i < n; i++) ordArr.push(ord[i]);
    ordArr.sort((a, b) => (wins[b] - wins[a]) || (rk[a] - rk[b]));

    // Head-to-head, but only where it can change who the top two are.
    let i = 0;
    while(i <= 1 && i < n){
      let j = i;
      while(j + 1 < n && wins[ordArr[j + 1]] === wins[ordArr[i]]) j++;
      if(j > i){
        const grp = ordArr.slice(i, j + 1);
        const h2h = grp.map(t => {
          let c = 0;
          for(const o of grp){
            if(o === t) continue;
            const ci = pairGame[t * n + o];
            if(ci < 0) continue;
            const hw = gfinal[ci] >= 0 ? gfinal[ci] : outcomes[gpend[ci]];
            if((hw ? gh[ci] : ga[ci]) === t) c++;
          }
          return c;
        });
        const order = grp.map((t, q) => q).sort((a, b) => (h2h[b] - h2h[a]) || (rk[grp[a]] - rk[grp[b]]));
        for(let q = 0; q < order.length; q++) ordArr[i + q] = grp[order[q]];
      }
      i = j + 1;
    }

    const t1 = ordArr[0], t2 = ordArr[1];
    cnt1[t1]++; cnt2[t1]++; cnt2[t2]++;
    hist2[t1 * 12 + (wins[t1] < 12 ? wins[t1] : 11)]++;
    hist2[t2 * 12 + (wins[t2] < 12 ? wins[t2] : 11)]++;
    for(let k = 0; k < n; k++){
      sumW[k] += wins[k];
      const w = wins[k] < 12 ? wins[k] : 11;
      hist[k * 12 + w]++;
    }
    for(let e = 0; e < L; e++){
      const ci = levCi[e], home = outcomes[gpend[ci]] === 1;
      if(home) nH[e]++; else nA[e]++;
      for(let f = 0; f < F; f++){
        const ti = idx[foc[f]];
        if(ti === t1 || ti === t2){ if(home) hitH[e * F + f]++; else hitA[e * F + f]++; }
      }
    }
  }

  const out = { runs, teams:{}, leverage:[], pending: pendP.length };
  members.forEach((id, k) => {
    const dist = [], byRecord = [];
    for(let w = 0; w < 12; w++){
      dist.push(hist[k * 12 + w] / runs);
      // "Finish 8-1 and you are in 96% of the time" — the number that actually
      // answers "what do we need to do?".
      if(hist[k * 12 + w] > 0 && w <= played[k]){
        byRecord.push({ wins: w, pFinish: hist[k * 12 + w] / runs,
                        pTop2: hist2[k * 12 + w] / hist[k * 12 + w] });
      }
    }
    out.teams[id] = {
      confW: baseW[k], confL: baseL[k], confGames: played[k],
      projWins: sumW[k] / runs,
      projLosses: played[k] - sumW[k] / runs,
      pTop2: cnt2[k] / runs,
      pTop1: cnt1[k] / runs,
      dist, byRecord
    };
  });
  levGames.forEach((g, e) => {
    const by = {};
    foc.forEach((id, f) => {
      by[id] = {
        ifHome: nH[e] ? hitH[e * F + f] / nH[e] : null,
        ifAway: nA[e] ? hitA[e * F + f] / nA[e] : null
      };
    });
    out.leverage.push({ game: g, by });
  });
  return out;
}

/* Re-run the live board. Cheap enough to just do it on every change. */
function live(){

    games, preds, probs: probsOf(settings),

  });
}

function go(v){
  view = v;
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('on', t.dataset.v === v));
  document.querySelectorAll('.view').forEach(s => s.classList.toggle('on', s.id === 'v-' + v));
  render();
}

function weeksList(){
  const seen = {};
  for(const g of games){
    if(g.week == null) continue;
    if(!seen[g.week] || g.kickoff < seen[g.week]) seen[g.week] = g.kickoff;
  }
  return Object.keys(seen).map(Number).sort((a,b) => a-b).map(w => ({ w, start: seen[w] }));
}
function currentWeek(){
  const wl = weeksList();
  for(const { w } of wl){
    if(games.some(g => g.week === w && g.status !== 'final')) return w;
  }
  return wl.length ? wl[wl.length-1].w : 1;
}
function needsCall(){
  return games.filter(g => g.conference_game && g.status !== 'final' &&
    !(preds[g.id] && preds[g.id].strength !== 'auto')).length;
}

function render(){
  const rec = confRecords();
  const done = games.filter(g => g.conference_game && g.status === 'final').length;
  const total = games.filter(g => g.conference_game).length;
  const synced = games.reduce((m, g) => g.updated_at > m ? g.updated_at : m, '');
  $('hdSub').innerHTML = season + ' season &nbsp;·&nbsp; ' + done + ' of ' + total +
    ' conference games played &nbsp;·&nbsp; <b>' + needsCall() + '</b> still need a call' +
    (synced ? ' &nbsp;·&nbsp; scores synced ' + fmtWhen(synced) : '');

  if(view === 'board')     renderBoard(rec);
  if(view === 'byu')       renderByu();
  if(view === 'standings') renderStandings(rec);
  if(view === 'week')      renderWeek();
  if(view === 'props')     renderProps();
  if(view === 'history')   renderHistory();
}

function onCellHover(ev){

function onCell(ev){
  const b = ev.target.closest('.g[data-g]');
  if(!b) return;
  closePop();          // a left-click elsewhere abandons whatever the popover was editing
  const g = games.find(x => x.id === b.dataset.g);
  if(!g) return;
  if(g.status === 'final') return toast('That one is in the books.');
  cycle(g, b.dataset.t, ev.shiftKey);
}

/* Six states in a ring: the line stands → should win → lean win → coin flip →
   lean loss → should lose → back. Shift-click walks it the other way, which
   matters once the ring is this long. */
function cycle(g, teamId, back){
  const cur = levelOf(preds[g.id], teamId);
  const at = cur ? LEVELS.indexOf(cur) + 1 : 0;        // 0 is "the line stands"
  const next = (at + (back ? -1 : 1) + (LEVELS.length + 1)) % (LEVELS.length + 1);
  setPred(g.id, next === 0 ? { pick_team_id: null, strength: 'auto' }
                           : rowFor(LEVELS[next - 1], g, teamId));
}

async function setPred(gameId, next, note){
  const had = preds[gameId];
  const keepNote = note !== undefined ? note : (had ? had.note : null);
  if(next.strength === 'auto' && !keepNote){
    delete preds[gameId];
    live(); render();
    const { error } = await supa.from('b12_predictions').delete()
      .eq('season', season).eq('game_id', gameId);
    if(error) toast('Could not clear that: ' + error.message, 4000);
    return;
  }
  const directional = next.strength !== 'tossup' && next.strength !== 'auto';
  const row = {
    season, game_id: gameId,
    pick_team_id: directional ? next.pick_team_id : null,
    strength: next.strength, note: keepNote || null,
    updated_at: new Date().toISOString()
  };
  preds[gameId] = row;
  live(); render();
  const { error } = await supa.from('b12_predictions').upsert(row);
  if(error) toast('Could not save that: ' + error.message, 4000);
}

  ev.preventDefault();
  const g = games.find(x => x.id === b.dataset.g);

  openPop(g, b.dataset.t, b);
}

function openPop(g, teamId, anchor){
  popGame = g.id;
  const cur = levelOf(preds[g.id], teamId);
  const p = preds[g.id] || {};
  const me = teams[teamId] || {};
  const mk = (k, on, title, sub) =>
    '<button class="opt' + (on ? ' on' : '') + '" data-k="' + k + '">' + title +
    (sub ? '<small>' + sub + '</small>' : '') + '</button>';
  const auto = cellState({ ...g, id:'__' }, teamId);   // market view, ignoring the saved row
  const pr = probsOf(settings);
  const odds = { sw: pr.strong, lw: pr.lean, cf: .5, ll: 1 - pr.lean, sl: 1 - pr.strong };

  $('pop').innerHTML =
      '<h4>' + esc(matchupText(g)) + '</h4>'
    + '<div class="sub">' + esc(fmtWhen(g.kickoff))
    + (g.odds_detail ? ' · line ' + esc(g.odds_detail) : ' · no line posted')
    + ' · from ' + esc(me.abbr || me.name) + '’s side</div>'
    + LEVELS.map(l => mk(l.k, !!cur && cur.k === l.k, esc(l.full),
        Math.round(odds[l.k] * 100) + '% to win')).join('')
    + mk('auto', !cur, 'Let the line decide', 'currently ' + esc(auto.label))
    + '<div style="margin-top:10px"><textarea id="popNote" placeholder="Note — injury, weather, '
    + 'whatever you two said about it">' + esc(p.note || '') + '</textarea></div>'
    + '<div class="row" style="margin-top:9px"><button class="btn sm" id="popSave">Save</button>'
    + '<button class="btn ghost sm" onclick="closePop()">Cancel</button></div>';

  const pop = $('pop'), r = anchor.getBoundingClientRect();
  pop.style.display = 'block';
  pop.style.left = Math.min(window.scrollX + r.left, window.scrollX + window.innerWidth - 280) + 'px';
  pop.style.top  = (window.scrollY + r.bottom + 6) + 'px';

  let chosen = cur ? cur.k : 'auto';
  pop.querySelectorAll('.opt').forEach(b => b.onclick = () => {
    chosen = b.dataset.k;
    pop.querySelectorAll('.opt').forEach(o => o.classList.toggle('on', o === b));
  });
  $('popSave').onclick = () => {
    const note = $('popNote').value.trim();
    const lvl = LEVELS.find(l => l.k === chosen);
    closePop();
    setPred(g.id, lvl ? rowFor(lvl, g, teamId) : { pick_team_id: null, strength:'auto' }, note);
  };
}
function closePop(){ $('pop').style.display = 'none'; popGame = null; }
document.addEventListener('click', e => {

});

/* ------------------------------ this week ------------------------------- */
function setWeek(w){ weekSel = w; live(); render(); }

function renderWeek(){
  const wl = weeksList();
  const wkGames = games.filter(g => g.week === weekSel);
  const swing = {};
  sim.leverage.forEach(L => {
    const b = L.by[focusId];
    swing[L.game.id] = (b && b.ifHome != null && b.ifAway != null)
      ? { home: b.ifHome, away: b.ifAway, delta: Math.abs(b.ifHome - b.ifAway) } : null;
  });

  const pending = wkGames.filter(g => g.conference_game && g.status !== 'final')
    .sort((a,b) => ((swing[b.id]||{}).delta || 0) - ((swing[a.id]||{}).delta || 0));
  const finals  = wkGames.filter(g => g.conference_game && g.status === 'final');
  const nonconf = wkGames.filter(g => !g.conference_game);

  let h = '<div class="card"><div class="card-hd"><div class="card-t">Week ' + weekSel
    + ' — what actually matters to ' + esc(teamName(focusId)) + '</div>'
    + '<div class="card-s">Each number is how far ' + esc(teamAbbr(focusId)) + '’s odds of reaching '
    + 'the championship game move between the two results. Sorted by how much is riding on them.</div></div>'
    + '<div class="snaps" style="padding:14px 20px 6px">'
    + wl.map(({ w }) => '<button class="snap' + (w === weekSel ? ' on' : '') + '" onclick="setWeek(' + w + ')">'
        + '<div class="sd">Week ' + w + '</div><div class="ss">'
        + games.filter(g => g.week === w && g.conference_game).length + ' conf</div></button>').join('')
    + '</div><div class="row" style="padding:4px 20px 14px">' + contenderChips() + '</div>';

  if(!pending.length && !finals.length){
    const next = wl.map(x => x.w).find(w => w > weekSel &&
      games.some(g => g.week === w && g.conference_game));
    h += '<div class="empty">No Big 12 conference games in week ' + weekSel + ', so nothing here '
      + 'moves the race.' + (next ? ' Conference play picks back up in <b>week ' + next + '</b> — '
      + '<button class="btn ghost sm" onclick="setWeek(' + next + ')">jump there</button>' : '')
      + '</div>';
  }

  for(const g of pending){
    const s = swing[g.id];
    const rootHome = s && s.home >= s.away;
    const p = preds[g.id];
    const call = !p || p.strength === 'auto'
      ? '<span class="muted">no call yet — the line stands</span>'
      : p.strength === 'tossup' ? 'we called it <b>50-50</b>'
      : 'we like <b>' + esc(teamName(p.pick_team_id)) + '</b>';
    h += '<div class="gm"><div>'
      + '<div class="gm-t">' + rankName(g.away_id) + ' at ' + rankName(g.home_id) + '</div>'
      + '<div class="gm-s">' + esc(fmtWhen(g.kickoff))
      + (g.odds_detail ? ' · line ' + esc(g.odds_detail) : ' · no line') + ' · ' + call + '</div></div>'
      + '<div class="swing">'
      + (s ? '<div class="v">' + (s.delta * 100).toFixed(1) + ' pts</div>'
           + '<div class="k">swing for ' + esc(teamAbbr(focusId)) + '</div>'
           + (s.delta < 0.005
              ? '<div class="root none">Doesn’t move the needle</div>'
              : '<div class="root">Root for ' + esc(teamAbbr(rootHome ? g.home_id : g.away_id))
                + ' &nbsp;' + pct1(rootHome ? s.home : s.away) + ' vs ' + pct1(rootHome ? s.away : s.home) + '</div>')
         : '<div class="k">—</div>')
      + '</div></div>';
  }

  for(const g of finals){
    const w = g.winner_id;
    h += '<div class="gm"><div>'
      + '<div class="gm-t">' + rankName(g.away_id) + ' at ' + rankName(g.home_id) + '</div>'
      + '<div class="gm-s"><b>' + esc(teamName(w)) + '</b> won ' + Math.max(g.home_score, g.away_score)
      + '–' + Math.min(g.home_score, g.away_score) + ' · already in the standings</div></div>'
      + '<div class="swing"><div class="k">Final</div></div></div>';
  }
  h += '</div>';

  if(nonconf.length){
    h += '<div class="card"><div class="card-hd"><div class="card-t">Non-conference this week</div>'
      + '<div class="card-s">These change nobody’s Big 12 record, so the swing is zero by '
      + 'definition — they only matter for the polls.</div></div><div style="padding:6px 0 4px">';
    for(const g of nonconf){
      h += '<div class="gm"><div><div class="gm-t">' + rankName(g.away_id) + ' at ' + rankName(g.home_id) + '</div>'
        + '<div class="gm-s">' + (g.status === 'final'
            ? esc(teamName(g.winner_id)) + ' won ' + Math.max(g.home_score, g.away_score) + '–'
              + Math.min(g.home_score, g.away_score)
            : esc(fmtWhen(g.kickoff))) + '</div></div><div class="swing"></div></div>';
    }
    h += '</div></div>';
  }
  $('v-week').innerHTML = h;
}

function tile(k, v, sub){

/* Where they land if today's board simply happens. */
function projSeed(id){
  const order = members.slice().sort((a,b) =>
    sim.teams[b].projWins - sim.teams[a].projWins || sim.teams[b].pTop2 - sim.teams[a].pTop2);
  const at = order.indexOf(id) + 1;
  return at + (['th','st','nd','rd'][at % 10 > 3 || (at > 10 && at < 14) ? 0 : at % 10]);

/* ============================ season props ==============================
   The once-a-year guesses about BYU. There is one login here, so a "person" is
   a name in a list rather than an account -- you both type your numbers into
   the same table, which is how it worked on paper anyway.
   ======================================================================== */

/* The questions the app can answer for itself out of the schedule it already
   syncs. Each returns where the number stands, and where it is heading if that
   is a meaningful thing to say. */
const AUTO_PROPS = {
  wins:        { label: 'BYU wins (all games)',
                 of: () => rec(false, 'w') },
  losses:      { label: 'BYU losses (all games)',
                 of: () => rec(false, 'l') },
  conf_wins:   { label: 'BYU Big 12 wins',
                 of: () => rec(true, 'w') },
  conf_losses: { label: 'BYU Big 12 losses',
                 of: () => rec(true, 'l') },
  blowouts:    { label: 'BYU wins by 14+ points',
                 // No projection: a win probability says nothing about margin.
                 of: () => ({ value: blowouts(homeId()), projected: null,
                              left: projectedRecord(homeId(), false).left }) }
};

function rec(confOnly, side){
  const r = projectedRecord(homeId(), confOnly);
  return { value: side === 'w' ? r.w : r.l,
           projected: side === 'w' ? r.projW : r.projL, left: r.left };
}

function blowouts(id){
  return games.filter(g => g.status === 'final' && g.winner_id === id &&
    Math.abs((g.home_score || 0) - (g.away_score || 0)) >= 14).length;
}

/* Record so far and where it is heading, over all games or conference only. */
function projectedRecord(id, confOnly){
  const P = preds, pr = probsOf(settings);
  let w = 0, l = 0, expected = 0, left = 0;
  for(const g of games){
    if(g.home_id !== id && g.away_id !== id) continue;
    if(confOnly && !g.conference_game) continue;
    if(g.status === 'final' && g.winner_id){ g.winner_id === id ? w++ : l++; }
    else { expected += pFor(g, id, P, pr); left++; }
  }
  return { w, l, left, total: w + l + left, projW: w + expected, projL: l + (left - expected) };
}

/* Where a prop stands right now: computed for the auto ones, typed for the rest. */
function propNow(pr){
  if(pr.auto && AUTO_PROPS[pr.auto]){
    return Object.assign({ auto: true }, AUTO_PROPS[pr.auto].of());
  }
  if(pr.kind === 'choice') return { choice: pr.actual_choice || null, auto: false };
  return { value: pr.actual == null ? null : Number(pr.actual), auto: false };
}

/* Who has locked in, alphabetical — the columns of the window. */
function lockedPlayers(){
  return propLocks.map(l => l.user_id).filter(id => propPlayers[id])
    .sort((a,b) => propPlayers[a].display_name.localeCompare(propPlayers[b].display_name));
}
function answerOf(uid, pr){
  const r = propPicks.find(x => x.user_id === uid && x.prop_id === pr.id);
  if(!r) return null;
  return pr.kind === 'choice' ? (r.choice || null) : (r.value == null ? null : Number(r.value));
}

/* Who is closest, on the number as it stands. Ties share the honour. */
function propLeaders(pr, ids){
  const now = propNow(pr);
  const target = pr.kind === 'choice' ? now.choice : now.value;
  if(target == null || target === '') return [];
  const scored = ids.map(id => ({ id, v: answerOf(id, pr) })).filter(x => x.v != null);
  if(!scored.length) return [];
  if(pr.kind === 'choice') return scored.filter(x => x.v === target).map(x => x.id);
  const best = Math.min(...scored.map(x => Math.abs(x.v - target)));
  return scored.filter(x => Math.abs(x.v - target) === best).map(x => x.id);
}

function propBoardStandings(ids){
  const tally = {};
  ids.forEach(id => tally[id] = { id, won: 0 });
  props.filter(pr => pr.settled).forEach(pr => {
    const win = propLeaders(pr, ids);
    win.forEach(id => { if(tally[id]) tally[id].won += 1 / win.length; });
  });
  return Object.values(tally).sort((a,b) => b.won - a.won
    || propPlayers[a.id].display_name.localeCompare(propPlayers[b.id].display_name));
}

function propSummary(pr, ids){
  const vals = ids.map(id => ({ id, v: answerOf(id, pr) })).filter(x => x.v != null);
  if(!vals.length) return { empty: true, n: 0 };
  if(pr.kind === 'choice'){
    const counts = {};
    vals.forEach(x => counts[x.v] = (counts[x.v] || 0) + 1);
    const order = Object.keys(counts).sort((a,b) => counts[b] - counts[a] || a.localeCompare(b));
    return { choice: true, n: vals.length, order, counts, vals };
  }
  const nums = vals.map(x => x.v).sort((a,b) => a - b);
  return { n: vals.length, vals, lo: nums[0], hi: nums[nums.length-1],
           avg: nums.reduce((a,b) => a + b, 0) / nums.length };
}

    + '<th style="min-width:130px">Where it stands</th><th style="width:148px"></th>'
    + '</tr></thead><tbody>';

  for(const pr of props){

         : pr.auto ? '<div class="pd">kept automatically</div>' : '')
      + '</td>';

    h += '<td class="l">';
    if(sum.empty){
      h += '<span class="muted">nobody locked in yet</span>';
    } else if(sum.choice){

      h += '<div class="split">' + sum.order.map(o =>

          + '%' + (pr.settled && now.choice === o ? ';background:var(--win)' : '') + '"></i></span>'

const nfmt = n => (Math.round(n * 100) / 100).toLocaleString();
function togglePropRow(id){
  const el = $('pw-' + id);
  if(el) el.style.display = el.style.display === 'none' ? '' : 'none';
}

async function saveActual(el){
  const prop = props.find(p => String(p.id) === el.dataset.actual);
  const raw = el.value.trim();
  const patch = prop.kind === 'choice' ? { actual_choice: raw || null }
                                       : { actual: raw === '' ? null : Number(raw) };
  Object.assign(prop, patch);
  renderProps();
  const { error } = await supa.from('b12_props').update(patch).eq('id', prop.id);
  if(error) toast('Could not save that: ' + error.message, 4000);
}

async function toggleSettled(id){
  const prop = props.find(p => p.id === id);
  prop.settled = !prop.settled;
  renderProps();
  const { error } = await supa.from('b12_props').update({ settled: prop.settled }).eq('id', id);
  if(error) toast(error.message, 4000);
}

async function saveProp(id){
  const question = ($('prQ').value || '').trim();
  if(!question) return toast('Give it a question');
  const opts = ($('prO').value || '').split(',').map(x => x.trim()).filter(Boolean);
  const num = id => { const v = ($(id).value || '').trim();
                      return v === '' ? null : Number(v); };
  const row = {
    season, question,
    detail: ($('prD').value || '').trim() || null,
    kind: $('prK').value,
    unit: ($('prU').value || '').trim() || null,
    options: opts.length ? opts : null,
    auto: $('prA').value || null,
    min_val: num('prMin'), max_val: num('prMax'),
    whole: $('prWhole').checked
  };
  if(row.min_val != null && !isFinite(row.min_val)) return toast('The lowest allowed must be a number');
  if(row.max_val != null && !isFinite(row.max_val)) return toast('The highest allowed must be a number');
  if(row.min_val != null && row.max_val != null && row.min_val >= row.max_val)
    return toast('The highest allowed has to be above the lowest');
  if(row.kind === 'choice' && !row.options) return toast('A menu prop needs some options');
  if(row.kind === 'choice'){ row.auto = null; row.min_val = null; row.max_val = null; }
  closeModal();
  const { error } = id
    ? await supa.from('b12_props').update(row).eq('id', id)
    : await supa.from('b12_props').insert({ ...row, sort: props.length });
  if(error) return toast(error.message, 4500);
  await loadProps(); render();
}

async function deleteProp(id){
  if(!confirm('Delete this question and everyone’s answers to it?')) return;
  closeModal();
  const { error } = await supa.from('b12_props').delete().eq('id', id);
  if(error) return toast(error.message, 4500);
  await loadProps(); render();
}

/* ------------------------------- history -------------------------------- */
function liveOdds(){
  const o = {};
  members.forEach(id => o[id] = { pTop2: sim.teams[id].pTop2, projWins: sim.teams[id].projWins });
  return o;
}
function oddsFromPayload(p){
  const P = {};
  (p.predictions || []).forEach(r => { P[r.game_id] = r; });
  // A v1 payload only knew one confidence level; read it as "should win".
  const probs = { strong: Number(p.strong_prob != null ? p.strong_prob : p.likely_prob || 0.80),
                  lean:   Number(p.lean_prob != null ? p.lean_prob : 0.65) };
  const r = simulate({ games: p.games || [], preds: P, probs, runs: SIMS_HIST });
  const o = {};
  members.forEach(id => o[id] = r.teams[id]
    ? { pTop2: r.teams[id].pTop2, projWins: r.teams[id].projWins }
    : { pTop2: 0, projWins: 0 });
  return o;
}

function renderHistory(){
  if(!snapshots.length){
    $('v-history').innerHTML = '<div class="card"><div class="card-hd">'
      + '<div class="card-t">Nothing saved yet</div><div class="card-s">Hit '
      + '<b>Save this week</b> up top when you finish a Monday and the board is frozen exactly as '
      + 'it stands — every prediction and every result to date. From then on this page shows how '
      + 'each contender’s odds moved week to week. A snapshot is also taken automatically every '
      + 'Monday at 6am Mountain, so a skipped week still gets recorded.</div></div>'
      + '<div class="empty">Save one and come back.</div></div>';
    return;
  }

  const asc = snapshots.slice().reverse();
  asc.forEach(s => { if(!s._odds) s._odds = oddsFromPayload(s.payload); });
  const nowSnap = { label:'Now', taken_at: new Date().toISOString(), live: true,
                    payload: buildPayload(), _odds: liveOdds() };
  const chain = asc.concat([nowSnap]);
  const pts = chain.map(s => ({ label: s.live ? 'Now' : (s.label || fmtDate(s.taken_at)),
                                at: s.taken_at, odds: s._odds }));

  let h = '<div class="card"><div class="card-hd"><div class="card-t">How the odds have moved</div>'
    + '<div class="card-s">Each panel is one contender’s chance of reaching the championship game, '
    + 'recomputed from that week’s board — the predictions you had made <i>and</i> the results that '
    + 'had happened by then. Every panel is on the same 0–100% scale; the faint lines behind are the '
    + 'other contenders. Hover a dot for the exact number.</div></div>'
    + '<div class="facets">';

  for(const id of settings.contenders){
    const series = pts.map(p => (p.odds[id] || {}).pTop2 || 0);
    const last = series[series.length - 1];
    const prev = series.length > 1 ? series[series.length - 2] : null;
    const dp = prev == null ? null : Math.round((last - prev) * 1000) / 10;
    const others = settings.contenders.filter(o => o !== id)
      .map(o => pts.map(p => (p.odds[o] || {}).pTop2 || 0));
    h += '<div class="facet"><div class="facet-hd">'
      + '<div class="facet-t">' + esc(teamName(id)) + '</div>'
      + (dp == null ? '' : dp === 0
          ? '<div class="facet-d flat">no change</div>'
          : '<div class="facet-d ' + (dp > 0 ? 'up' : 'down') + '">' + (dp > 0 ? '▲ ' : '▼ ')
            + Math.abs(dp).toFixed(1) + ' pts</div>')
      + '<div class="facet-v num">' + pct(last) + '</div></div>'
      + spark(series, others, pts) + '</div>';
  }
  h += '</div></div>';

  // What changed, most recent transition first.
  h += '<div class="card"><div class="card-hd"><div class="card-t">What changed</div>'
    + '<div class="card-s">Between each saved week and the one before it, newest first — '
    + 'starting with everything that has happened since your last save.</div></div>';
  const rows = [];
  for(let i = chain.length - 1; i >= 0; i--){
    const cur = chain[i], prv = i > 0 ? chain[i - 1] : null;
    rows.push('<div class="chg" style="background:var(--panel);font-weight:700">'
      + (cur.live
          ? 'Since ' + esc(prv ? (prv.label || fmtDate(prv.taken_at)) : 'the start')
            + ' <span class="muted" style="font-weight:500">· not saved yet</span>'
          : esc(cur.label || fmtDate(cur.taken_at)) + ' <span class="muted" style="font-weight:500">· saved '
            + fmtWhen(cur.taken_at) + (cur.source === 'auto' ? ' automatically' : '') + '</span>')
      + (cur.note ? '<div style="font-weight:400;color:var(--muted);margin-top:4px">' + esc(cur.note) + '</div>' : '')
      + '</div>');
    if(prv) rows.push(...diffSnapshots(prv, cur));
  }
  h += rows.join('') + '</div>';

  h += '<div class="card"><div class="card-hd"><div class="card-t">Saved weeks</div></div>'
    + '<div class="snaps">' + snapshots.map(s =>
        '<div class="snap"><div class="sd">' + esc(s.label || fmtDate(s.taken_at)) + '</div>'
        + '<div class="ss">' + fmtDate(s.taken_at) + ' · '
        + '<a href="#" onclick="return delSnap(' + s.id + ')" style="color:var(--loss)">delete</a>'
        + '</div></div>').join('') + '</div></div>';
  $('v-history').innerHTML = h;
}

/* A 300x88 sparkline. One colored series, the rest as recessive context. */
function spark(series, others, pts){
  const W = 300, H = 76, PAD = 3;
  const n = series.length;
  const x = i => n === 1 ? W / 2 : PAD + i * (W - PAD * 2) / (n - 1);
  const y = v => H - PAD - v * (H - PAD * 2);
  const path = s => s.map((v, i) => (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(v).toFixed(1)).join(' ');
  let g = '<svg viewBox="0 0 ' + W + ' ' + (H + 12) + '" role="img" aria-label="odds over time">'
    + '<line x1="0" y1="' + y(.5) + '" x2="' + W + '" y2="' + y(.5)
    + '" stroke="#EDEFF3" stroke-width="1"/>'
    + '<line x1="0" y1="' + y(0) + '" x2="' + W + '" y2="' + y(0) + '" stroke="#E6E9EF" stroke-width="1"/>';
  for(const o of others){
    g += '<path d="' + path(o) + '" fill="none" stroke="#DCE1E8" stroke-width="1"/>';
  }
  g += '<path d="' + path(series) + '" fill="none" stroke="var(--series-1)" stroke-width="2" '
     + 'stroke-linejoin="round" stroke-linecap="round"/>';
  series.forEach((v, i) => {
    const lastOne = i === n - 1;
    g += '<circle cx="' + x(i).toFixed(1) + '" cy="' + y(v).toFixed(1) + '" r="' + (lastOne ? 4 : 2.6)
      + '" fill="var(--series-1)" stroke="#fff" stroke-width="2">'
      + '<title>' + esc(pts[i].label) + ': ' + pct1(v) + '</title></circle>';
  });
  g += '<text x="0" y="' + (H + 10) + '" font-size="9" fill="#A6AEBA">' + esc(pts[0].label) + '</text>'
     + '<text x="' + W + '" y="' + (H + 10) + '" font-size="9" fill="#A6AEBA" text-anchor="end">'
     + esc(pts[n-1].label) + '</text></svg>';
  return g;
}

function diffSnapshots(a, b){
  const out = [];
  const moved = settings.contenders.map(id => {
    const was = (a._odds[id] || {}).pTop2 || 0, now = (b._odds[id] || {}).pTop2 || 0;
    return { id, was, now, d: Math.round((now - was) * 1000) / 10 };
  }).filter(m => Math.abs(m.d) >= 0.5).sort((x, y) => Math.abs(y.d) - Math.abs(x.d));
  if(moved.length){
    out.push('<div class="chg"><span class="tag">Odds</span>' + moved.map(m =>
      esc(teamAbbr(m.id)) + ' ' + pct(m.was) + '→<b>' + pct(m.now) + '</b> <span class="'
      + (m.d > 0 ? 'up' : 'down') + '">' + (m.d > 0 ? '▲' : '▼') + Math.abs(m.d).toFixed(1)
      + '</span>').join(' &nbsp; ') + '</div>');
  }
  const gsA = {}, gsB = {};
  (a.payload.games || []).forEach(g => gsA[g.id] = g);
  (b.payload.games || []).forEach(g => gsB[g.id] = g);
  const pA = {}, pB = {};
  (a.payload.predictions || []).forEach(r => pA[r.game_id] = r);
  (b.payload.predictions || []).forEach(r => pB[r.game_id] = r);

  for(const id in gsB){
    const g = gsB[id], was = gsA[id];
    if(g.status === 'final' && (!was || was.status !== 'final') && g.winner_id){
      const loser = g.winner_id === g.home_id ? g.away_id : g.home_id;
      out.push('<div class="chg"><span class="tag res">Result</span><b>' + esc(teamName(g.winner_id))
        + '</b> beat ' + esc(teamName(loser)) + (g.conference_game ? '' : ' <span class="muted">(non-conference)</span>') + '</div>');
    }
  }
  for(const id in pB){
    const nowP = pB[id], wasP = pA[id];
    if(sameCall(wasP, nowP)) continue;
    const g = gsB[id] || gsA[id];
    if(!g || g.status === 'final') continue;
    out.push('<div class="chg"><span class="tag pred">Call</span>'
      + esc(teamName(g.away_id)) + ' at ' + esc(teamName(g.home_id)) + ': '
      + callText(wasP, g) + ' → <b>' + callText(nowP, g) + '</b></div>');
  }
  for(const id in pA){
    if(pB[id]) continue;
    const g = gsB[id] || gsA[id];
    if(!g || g.status === 'final') continue;
    out.push('<div class="chg"><span class="tag pred">Call</span>'
      + esc(teamName(g.away_id)) + ' at ' + esc(teamName(g.home_id)) + ': '
      + callText(pA[id], g) + ' → <b>back to the line</b></div>');
  }
  if(!out.length) out.push('<div class="chg muted">Nothing moved.</div>');
  return out;
}
function sameCall(x, y){
  const k = r => !r || !r.strength || r.strength === 'auto' ? 'auto'
    : r.strength === 'tossup' ? 'toss'
    : (r.strength === 'lean' ? 'lean:' : 'strong:') + r.pick_team_id;
  return k(x) === k(y);
}
function callText(r, g){
  if(!r || !r.strength || r.strength === 'auto') return 'the line';
  if(r.strength === 'tossup') return 'a coin flip';
  const lvl = levelOf(r, r.pick_team_id);            // read from the picked team's side
  return teamName(r.pick_team_id) + (lvl && lvl.k === 'lw' ? ' by a lean' : ' should win');
}

/* ========================= snapshots ========================= */
/* Self-contained on purpose: the results as they stood go in alongside the
   predictions, so a saved week can be re-scored exactly as you saw it rather
   than against games that had not been played yet. */
function buildPayload(){
  return {
    v: 2, season,
    strong_prob: settings.strong_prob,
    lean_prob: settings.lean_prob,
    contenders: settings.contenders.slice(),
    predictions: Object.keys(preds).map(id => ({
      game_id: id,
      pick_team_id: preds[id].pick_team_id || null,
      strength: preds[id].strength,
      note: preds[id].note || null
    })),
    games: games.map(g => ({
      id: g.id, week: g.week, conference_game: !!g.conference_game,
      status: g.status, winner_id: g.winner_id || null,
      home_id: g.home_id, away_id: g.away_id,
      home_score: g.home_score, away_score: g.away_score,
      home_spread: g.home_spread == null ? null : Number(g.home_spread)
    }))
  };
}

  openModal('<h3>Save this week</h3>'

    + 'so you can look back at it in November and see what you two were thinking.</p>'

    + 'color:var(--faint)">Label</label>'
    + '<input type="text" id="snapLabel" value="Week ' + w + '" style="margin:6px 0 14px" />'
    + '<label style="font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;'
    + 'color:var(--faint)">Notes from this morning</label>'
    + '<textarea class="big" id="snapNote" rows="4" style="margin-top:6px" '
    + 'placeholder="Optional — what you argued about, who you moved and why"></textarea>'
    + '<div class="row" style="margin-top:18px"><button class="btn" onclick="saveSnapshot()">Save it</button>'

}

async function saveSnapshot(){
  const label = ($('snapLabel').value || '').trim() || ('Week ' + currentWeek());
  const note  = ($('snapNote').value || '').trim();
  closeModal();
  const { error } = await supa.from('b12_snapshots').insert({
    season, week: currentWeek(), label, note: note || null, source: 'app',
    taken_at: new Date().toISOString(), payload: buildPayload()
  });
  if(error) return toast('Could not save: ' + error.message, 4500);
  await loadSnapshots();
  toast('Saved. It is on the History tab.');
  render();
}

async function delSnap(id){
  if(!confirm('Delete this saved week? The history chart will lose that point.')) return false;
  const { error } = await supa.from('b12_snapshots').delete().eq('id', id);
  if(error) toast(error.message, 4000);
  await loadSnapshots();
  render();
  return false;
}

function paintContenders(){
  const rec = confRecords();
  const line = id => {
    const t = teams[id], r = rec[id] || { w:0, l:0 };
    return (t.logo ? '<img src="' + esc(t.logo) + '" alt="" onerror="this.style.visibility=\'hidden\'">' : '')
      + '<span class="nm">' + esc(t.name) + '</span>'
      + '<span class="rc">' + r.w + '–' + r.l + ' · ' + pct(sim.teams[id].pTop2) + '</span>';
  };
  const rest = members.filter(id => draft.indexOf(id) < 0).sort((a,b) =>
    (sim.teams[b].pTop2 - sim.teams[a].pTop2) || teams[a].name.localeCompare(teams[b].name));

  $('tlist').innerHTML =
      '<div class="sec">On the board · ' + draft.length + '</div>'
    + (draft.length ? draft.map((id, i) =>
        '<div class="tpick on">' + line(id)
        + '<span class="acts">'
        + '<button class="mini" data-act="up" data-id="' + id + '"' + (i === 0 ? ' disabled' : '')
        + ' title="Move up">▲</button>'
        + '<button class="mini" data-act="down" data-id="' + id + '"'
        + (i === draft.length - 1 ? ' disabled' : '') + ' title="Move down">▼</button>'
        + '<button class="mini drop" data-act="remove" data-id="' + id + '">Remove</button>'
        + '</span></div>').join('')
       : '<div class="empty" style="padding:16px">Nobody yet — add a team below.</div>')
    + '<div class="sec">Everyone else</div>'
    + rest.map(id => '<div class="tpick">' + line(id)
        + '<span class="acts"><button class="mini go" data-act="add" data-id="' + id + '">Add</button>'
        + '</span></div>').join('');
}

function onContenderClick(e){
  const b = e.target.closest('[data-act]');
  if(!b) return;
  const id = b.dataset.id, at = draft.indexOf(id);
  if(b.dataset.act === 'add'){
    if(draft.length >= 8) return toast('Eight rows is plenty for one board');
    draft.push(id);
  } else if(b.dataset.act === 'remove'){
    draft.splice(at, 1);
  } else {
    const to = at + (b.dataset.act === 'up' ? -1 : 1);
    if(to < 0 || to >= draft.length) return;
    draft.splice(to, 0, draft.splice(at, 1)[0]);
  }
  paintContenders();
}

async function saveContenders(){
  if(!draft.length) return toast('Pick at least one team');
  closeModal();
  settings.contenders = draft.slice();
  if(!settings.contenders.includes(focusId)) focusId = settings.contenders[0];
  await saveSettings();
  live(); render();
}

function openTuning(){
  const dial = (id, label, val, lo, hi, blurb) =>
      '<div style="margin-bottom:22px">'
    + '<div class="row"><b style="font-size:13.5px">' + label + '</b><div class="spacer"></div>'
    + '<span class="num" id="' + id + 'V" style="font-size:26px;font-weight:800;'
    + 'letter-spacing:-.03em">' + val + '%</span></div>'
    + '<input type="range" id="' + id + '" min="' + lo + '" max="' + hi + '" step="1" value="' + val
    + '" style="width:100%;margin:6px 0 3px" '
    + 'oninput="document.getElementById(\'' + id + 'V\').textContent=this.value+\'%\'" />'
    + '<div class="muted" style="font-size:11.5px;line-height:1.45">' + blurb + '</div></div>';

  openModal('<h3>What the calls are worth</h3>'
    + '<p>Two numbers drive everything: the chance the simulation gives a team when you say it '
    + '<b>should win</b>, and the chance when you only <b>lean</b> its way. A coin flip is always '
    + '50%, and the mirror image of each applies to the losing side.</p>'
    + dial('tuneS', 'Should win', Math.round(settings.strong_prob * 100), 60, 95,
           'Clear favourite, but not a certainty. 80% is about a 12-point spread.')
    + dial('tuneL', 'Lean', Math.round(settings.lean_prob * 100), 51, 79,
           'You would take them, without much conviction. 65% is about a 6-point spread.')
    + '<div class="row" style="margin-top:4px"><button class="btn" onclick="saveTuning()">Save</button>'
    + '<button class="btn ghost" onclick="closeModal()">Cancel</button></div>');
}
async function saveTuning(){
  const strong = Number($('tuneS').value) / 100, lean = Number($('tuneL').value) / 100;
  if(lean >= strong) return toast('A lean has to be softer than a should-win');
  settings.strong_prob = strong; settings.lean_prob = lean;
  closeModal();
  await saveSettings();
  live(); render();
}

/* ========================= modal plumbing ========================= */
function openModal(html){ $('sheet').innerHTML = html; $('modal').classList.add('on'); }
function closeModal(){ $('modal').classList.remove('on'); }
document.addEventListener('keydown', e => {
  if(e.key === 'Escape'){ closeModal(); closePop(); }
});
</script>
